<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steel 101 | Your Company</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #000; color: #e4e4e7;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5; min-height: 100vh;
    background-image:
      radial-gradient(circle at 90% 10%, rgba(234,88,12,0.08), transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(255,184,0,0.04), transparent 40%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  a { color: inherit; text-decoration: none; }
  p { margin: 0; }
  h1, h2, h3 { margin: 0; font-weight: normal; }
  ul { margin: 0; padding: 0; }
  input { font-family: inherit; }

  .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
  .bebas { font-family: 'Bebas Neue', 'Impact', 'Arial Black', sans-serif; letter-spacing: 0.04em; }
  .mono  { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease-in-out; }

  /* ─── Header ─── */
  header.site {
    border-bottom: 2px solid #27272a;
    background: rgba(0,0,0,0.85);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .header-row { max-width: 1000px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .logo-tile { width: 40px; height: 40px; background: #fbbf24; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-meta { flex: 1; min-width: 0; }
  .header-meta .small { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #52525b; }
  .header-meta .big { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 18px; color: #fff; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-progress { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #ea580c; letter-spacing: 0.2em; }

  /* ─── Footer ─── */
  footer.site { max-width: 1000px; margin: 0 auto; padding: 20px; border-top: 1px solid #27272a; text-align: center; }
  footer.site p { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #3f3f46; }

  /* ─── Back button ─── */
  .back-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #71717a; display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }

  /* ─── Hero (module home) ─── */
  .hero {
    position: relative; border: 2px solid #ea580c; background: #1a0a05;
    overflow: hidden; margin-bottom: 28px;
  }
  .hero-glow {
    position: absolute; top: -30%; right: -15%;
    width: 360px; height: 360px;
    background: radial-gradient(circle, #ea580c 0%, transparent 70%);
    filter: blur(80px); opacity: 0.3;
  }
  .hero-grain {
    position: absolute; inset: 0; opacity: 0.04;
    background-image: radial-gradient(#ea580c 0.5px, transparent 0.5px);
    background-size: 4px 4px;
  }
  .hero-inner { position: relative; padding: 32px 26px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px;
    background: #000; border: 1px solid #ea580c; margin-bottom: 16px;
  }
  .hero-badge span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #ea580c;
    text-transform: uppercase; letter-spacing: 0.3em;
  }
  .hero h1 {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    letter-spacing: 0.04em; font-size: clamp(48px, 9vw, 76px);
    color: #fff; line-height: 0.9; margin: 0 0 16px;
  }
  .hero h1 .accent { color: #ea580c; }
  .hero-blurb {
    color: #e4e4e7; max-width: 600px;
    font-size: 15px; line-height: 1.7; margin-bottom: 22px;
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 460px; }
  .hero-stat-tile { border: 1px solid #ea580c; background: rgba(0,0,0,0.6); padding: 8px 10px; }
  .hero-stat-num { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 24px; color: #ea580c; }
  .hero-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: #9a3412; }

  /* ─── Category cards ─── */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .cat-card { text-align: left; background: #18181b; border: 2px solid #3f3f46; padding: 0; overflow: hidden; cursor: pointer; display: block; }
  .cat-card.is-complete { border-color: #10b981; }
  .cat-card-band { height: 6px; }
  .cat-card-body { padding: 18px; }
  .cat-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .cat-card-icon { width: 44px; height: 44px; color: #000; display: flex; align-items: center; justify-content: center; }
  .cat-card-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 22px; color: #fff; margin: 0 0 6px; line-height: 1.05; }
  .cat-card-blurb { font-size: 12px; color: #a1a1aa; margin: 0 0 14px; line-height: 1.5; }
  .cat-card-meta { display: flex; justify-content: space-between; align-items: center; }
  .cat-card-meta-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; }
  .cat-card-progress { margin-top: 10px; height: 4px; background: #27272a; }
  .cat-card-progress-fill { height: 100%; transition: width 0.4s; }

  /* ─── Info bar ─── */
  .info-bar {
    margin-top: 28px; padding: 18px;
    background: #1a0a05; border: 1px dashed #ea580c;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .info-bar-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #ea580c; text-transform: uppercase; letter-spacing: 0.2em; margin: 0 0 6px; }
  .info-bar-text { font-size: 13px; color: #d4d4d8; line-height: 1.7; }

  /* ─── Category page header card ─── */
  .cat-header { border: 2px solid #3f3f46; background: #18181b; margin-bottom: 20px; }
  .cat-header-top { padding: 20px 22px; display: flex; gap: 16px; align-items: center; }
  .cat-header-icon-tile { width: 56px; height: 56px; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cat-header-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 36px; color: #000; margin: 0; line-height: 1; }
  .cat-header-blurb { color: rgba(0,0,0,0.78); font-size: 13px; margin: 6px 0 0; font-weight: 500; }

  /* ─── Lesson row ─── */
  .lesson-list { display: flex; flex-direction: column; gap: 10px; }
  .lesson-row {
    text-align: left; width: 100%; background: #18181b;
    border: 2px solid #3f3f46; padding: 14px 18px; cursor: pointer;
    display: flex; align-items: center; gap: 14px;
  }
  .lesson-row.is-complete { border-color: #10b981; }
  .lesson-row.is-locked { cursor: not-allowed; opacity: 0.45; border-color: #27272a; }
  .lesson-num-tile {
    width: 38px; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 16px;
  }
  .lesson-row-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 18px; color: #fff; margin: 0; line-height: 1.1; }
  .lesson-row-meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; margin: 4px 0 0; }

  /* ─── Lesson view ─── */
  .lesson-card { border: 2px solid #3f3f46; background: #18181b; }
  .lesson-card-header { color: #000; padding: 16px 22px; }
  .lesson-card-cat-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; opacity: 0.85; margin: 0; font-weight: 700; }
  .lesson-card-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 32px; color: #000; margin: 4px 0 0; line-height: 1; }
  .lesson-card-body { padding: 24px 22px; }
  .lesson-section { margin-bottom: 22px; }
  .lesson-section-h { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 22px; color: #ea580c; margin: 0 0 8px; }
  .lesson-section-b { color: #d4d4d8; font-size: 14px; line-height: 1.75; margin: 0; }

  .tip-box {
    margin-top: 24px; padding: 14px;
    background: #1a0a05; border-left: 3px solid #fbbf24;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .tip-box .tip-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.25em; margin: 0 0 4px; font-weight: 700; }
  .tip-box .tip-body { font-size: 13px; color: #fde68a; line-height: 1.6; margin: 0; }

  .continue-btn {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; font-size: 16px;
    margin-top: 28px; background: #fbbf24; color: #000;
    padding: 12px 24px; border: 2px solid #fbbf24;
    display: inline-flex; align-items: center; gap: 8px;
  }

  /* ─── Prompt card (info above interactive) ─── */
  .prompt-card { background: #09090b; border: 1px solid #ea580c; padding: 14px; margin-bottom: 20px; }
  .prompt-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .prompt-card-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #ea580c; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; }
  .prompt-card-text { color: #fed7aa; font-size: 13px; line-height: 1.6; }

  /* ─── Quiz / scenario shared ─── */
  .quiz-q { margin-bottom: 18px; }
  .quiz-q-text { color: #fff; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .quiz-q-num { font-family: 'JetBrains Mono', monospace; color: #ea580c; margin-right: 8px; font-size: 11px; letter-spacing: 0.15em; font-weight: 700; }
  .quiz-options { display: flex; flex-direction: column; gap: 6px; }
  .quiz-option {
    text-align: left; padding: 10px 14px;
    background: #18181b; border: 2px solid #3f3f46;
    color: #d4d4d8; font-size: 13px; line-height: 1.5;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    cursor: pointer; font-family: inherit; width: 100%;
  }
  .quiz-option.is-picked { background: #2a1410; border-color: #ea580c; color: #fed7aa; }
  .quiz-option.is-correct { background: rgba(16,185,129,0.12); border-color: #10b981; color: #86efac; }
  .quiz-option.is-wrong { background: rgba(239,68,68,0.12); border-color: #ef4444; color: #fca5a5; }
  .quiz-option:disabled { cursor: default; }
  .quiz-why {
    font-size: 11px; margin-top: 6px;
    padding-left: 10px; border-left: 2px solid #fbbf24;
    color: #fde68a; line-height: 1.6; font-style: italic;
  }

  /* ─── Submit / result ─── */
  .submit-btn {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; font-size: 16px;
    width: 100%; padding: 12px 0;
    border: 2px solid #ea580c; background: #ea580c; color: #fff;
  }
  .submit-btn:disabled { background: #27272a; color: #52525b; border-color: #3f3f46; cursor: not-allowed; }
  .result-box { padding: 18px; }
  .result-box.passed { background: rgba(16,185,129,0.1); border: 2px solid #10b981; }
  .result-box.failed { background: rgba(234,88,12,0.1); border: 2px solid #ea580c; }
  .result-headline { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 22px; margin: 0 0 8px; }
  .result-headline.passed { color: #6ee7b7; }
  .result-headline.failed { color: #fed7aa; }
  .result-body { font-size: 13px; color: #d4d4d8; margin: 0 0 14px; line-height: 1.6; }
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .try-again-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.15em;
    background: #27272a; color: #a1a1aa; padding: 8px 14px; border: 1px solid #3f3f46;
    display: flex; align-items: center; gap: 6px;
  }
  .complete-btn {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; font-size: 16px;
    background: #fbbf24; color: #000; padding: 10px 22px; border: 2px solid #fbbf24;
    display: flex; align-items: center; gap: 8px;
  }

  /* ─── Shape Library ─── */
  .shape-row { background: #18181b; border: 2px solid #3f3f46; overflow: hidden; }
  .shape-row.is-open { border-color: #ea580c; }
  .shape-row-toggle {
    width: 100%; text-align: left; background: transparent; border: none;
    padding: 12px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
  }
  .shape-svg-wrap { background: #000; padding: 6px; flex-shrink: 0; display: flex; }
  .shape-row-meta { flex: 1; min-width: 0; }
  .shape-row-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #ea580c; margin: 0; letter-spacing: 0.1em; }
  .shape-row-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; margin: 2px 0 0; line-height: 1.1; }
  .shape-row-cat { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; margin: 4px 0 0; }
  .shape-row-detail { padding: 0 14px 16px; border-top: 1px solid #ea580c; }
  .shape-row-detail p { color: #e4e4e7; font-size: 13px; margin: 12px 0 0; line-height: 1.6; }
  .shape-row-detail p strong.use { color: #ea580c; }
  .shape-row-detail p strong.read { color: #fbbf24; }

  /* ─── Welds reference grid ─── */
  .weld-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8; padding: 12px; background: #0f0f10; border: 1px solid #3f3f46; margin-bottom: 22px; }
  .weld-grid > div { text-align: center; padding: 4px; }
  .weld-grid p { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #fb923c; text-transform: uppercase; letter-spacing: 0.15em; margin: 0; }

  /* ─── Process flow & order quiz ─── */
  .process-ref { background: #0f0f10; border: 1px solid #3f3f46; padding: 12px; margin-bottom: 20px; }
  .process-ref p { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; margin: 0 0 8px; text-align: center; }
  .picked-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .picked-tile {
    background: #10b981; color: #000; padding: 6px 10px;
    font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.1em;
    display: flex; align-items: center; gap: 6px;
  }
  .picked-tile .picked-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; }
  .step-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .step-tile { background: #18181b; border: 2px solid #3f3f46; padding: 12px; cursor: pointer; text-align: left; }
  .step-tile.shake-now { border-color: #ef4444; }
  .step-tile-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #ea580c; margin: 0; line-height: 1; }
  .step-tile-desc { font-size: 11px; color: #a1a1aa; margin: 4px 0 0; line-height: 1.4; }

  /* ─── Glossary ─── */
  .gloss-search-wrap { position: relative; margin-bottom: 14px; }
  .gloss-search-wrap .gloss-search-icon { position: absolute; top: 12px; left: 12px; pointer-events: none; }
  .gloss-search-input {
    width: 100%; background: #09090b; border: 1px solid #3f3f46; color: #e4e4e7;
    padding: 10px 10px 10px 34px; font-size: 13px; outline: none;
  }
  .gloss-search-input:focus { border-color: #ea580c; }
  .gloss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .gloss-card {
    text-align: left; background: #18181b; border: 2px solid #3f3f46;
    padding: 12px; cursor: pointer;
  }
  .gloss-card.is-reviewed { background: #2a1410; border-color: #ea580c; }
  .gloss-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .gloss-card-term { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; letter-spacing: 0.05em; }
  .gloss-card.is-reviewed .gloss-card-term { color: #ea580c; }
  .gloss-card-def { font-size: 12px; color: #a1a1aa; margin: 0; line-height: 1.5; }

  /* ─── Term Match ─── */
  .match-term-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .match-term-tile {
    background: #18181b; border: 2px solid #3f3f46; padding: 10px 8px;
    font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #fff; letter-spacing: 0.05em;
    cursor: pointer;
  }
  .match-term-tile.is-active { background: #2a1410; border-color: #ea580c; }
  .match-term-tile.is-matched { background: #27272a; border-color: #fbbf24; }
  .match-term-tile.is-correct { background: rgba(16,185,129,0.12); border-color: #10b981; }
  .match-term-tile.is-wrong { background: rgba(239,68,68,0.12); border-color: #ef4444; }
  .match-def-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .match-def-tile {
    text-align: left; padding: 10px 14px;
    background: #18181b; border: 2px solid #3f3f46; color: #d4d4d8;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .match-def-tile.is-matched { background: #27272a; border-color: #fbbf24; color: #fde68a; }
  .match-def-tile.is-correct { background: rgba(16,185,129,0.12); border-color: #10b981; color: #86efac; }
  .match-def-tile.is-wrong { background: rgba(239,68,68,0.12); border-color: #ef4444; color: #fca5a5; }
  .match-def-tile.is-dim { opacity: 0.5; }
  .match-def-tile .match-def-arrow { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: #fbbf24; margin-left: 8px; }

  .reviewed-counter { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 12px; }
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <div class="logo-tile" id="logo-slot"></div>
    <div class="header-meta">
      <p class="small">Your Company &middot; Owner Onboarding</p>
      <p class="big">Module 04</p>
    </div>
    <div class="header-progress" id="header-progress"></div>
  </div>
</header>

<main class="container" style="padding: 24px 20px 40px;">
  <div id="app"></div>
</main>

<footer class="site">
  <p>Built by Joseph &middot; Module 04 &middot; Confidential &middot; Offline Edition</p>
</footer>

function shapeSVG(type, color, size) {
  color = color || '#a1a1aa';
  size = size || 80;
  var inner = '';
  switch (type) {
    case 'W':         inner = '<rect x="18" y="20" width="64" height="8" fill="' + color + '"/><rect x="46" y="28" width="8" height="44" fill="' + color + '"/><rect x="18" y="72" width="64" height="8" fill="' + color + '"/>'; break;
    case 'HSS_sq':    inner = '<rect x="22" y="22" width="56" height="56" fill="none" stroke="' + color + '" stroke-width="8"/>'; break;
    case 'HSS_rect':  inner = '<rect x="14" y="32" width="72" height="36" fill="none" stroke="' + color + '" stroke-width="7"/>'; break;
    case 'HSS_round': inner = '<circle cx="50" cy="50" r="26" fill="none" stroke="' + color + '" stroke-width="8"/>'; break;
    case 'C':         inner = '<path d="M 28 18 L 78 18 L 78 28 L 38 28 L 38 72 L 78 72 L 78 82 L 28 82 Z" fill="' + color + '"/>'; break;
    case 'L':         inner = '<path d="M 25 18 L 25 82 L 82 82 L 82 72 L 35 72 L 35 18 Z" fill="' + color + '"/>'; break;
    case 'PL':        inner = '<rect x="14" y="42" width="72" height="16" fill="' + color + '"/>'; break;
    case 'T':         inner = '<rect x="18" y="28" width="64" height="8" fill="' + color + '"/><rect x="46" y="36" width="8" height="44" fill="' + color + '"/>'; break;
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100">' + inner + '</svg>';
}

function weldSVG(type, size) {
  size = size || 120;
  var inner = '';
  switch (type) {
    case 'fillet':
      inner =
        '<rect x="10" y="60" width="80" height="14" fill="#71717a"/>' +
        '<rect x="40" y="20" width="14" height="40" fill="#71717a"/>' +

        '<text x="55" y="86" font-size="6" fill="#a1a1aa">horizontal plate</text>' +
        '<text x="32" y="44" font-size="6" fill="#fb923c" font-weight="bold">fillet</text>';
      break;
    case 'groove':
      inner =
        '<path d="M 10 40 L 45 40 L 50 55 L 45 70 L 10 70 Z" fill="#71717a"/>' +
        '<path d="M 90 40 L 55 40 L 50 55 L 55 70 L 90 70 Z" fill="#71717a"/>' +
        '<path d="M 45 40 L 55 40 L 55 70 L 45 70 L 50 55 Z" fill="#ea580c" stroke="#9a3412" stroke-width="0.5"/>' +
        '<text x="42" y="32" font-size="6" fill="#fb923c" font-weight="bold">groove (V)</text>' +
        '<text x="14" y="84" font-size="6" fill="#a1a1aa">two plates joined end-to-end</text>';
      break;
    case 'plug':
      inner =
        '<rect x="10" y="55" width="80" height="14" fill="#71717a"/>' +
        '<path d="M 10 35 L 40 35 L 40 55 L 10 55 Z" fill="#71717a"/>' +
        '<path d="M 60 35 L 90 35 L 90 55 L 60 55 Z" fill="#71717a"/>' +
        '<ellipse cx="50" cy="45" rx="10" ry="8" fill="#ea580c" stroke="#9a3412" stroke-width="0.5"/>' +
        '<rect x="42" y="45" width="16" height="10" fill="#ea580c" stroke="#9a3412" stroke-width="0.5"/>' +
        '<text x="42" y="28" font-size="6" fill="#fb923c" font-weight="bold">plug weld</text>' +
        '<text x="14" y="84" font-size="6" fill="#a1a1aa">fills a hole to join two plates</text>';

  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100">' + inner + '</svg>';

function boltSVG(size) {
  size = size || 120;
  var bolts = '';
  [28, 50, 72].forEach(function(x) {
    bolts +=
      '<circle cx="' + x + '" cy="32" r="5" fill="#fbbf24" stroke="#000" stroke-width="0.5"/>' +
      '<rect x="' + (x - 2) + '" y="36" width="4" height="28" fill="#fbbf24"/>' +
      '<circle cx="' + x + '" cy="68" r="5" fill="#fbbf24" stroke="#000" stroke-width="0.5"/>';
  });
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100">' +
    '<rect x="10" y="38" width="80" height="10" fill="#71717a"/>' +
    '<rect x="10" y="52" width="80" height="10" fill="#52525b"/>' +
    bolts +
    '<text x="14" y="20" font-size="6" fill="#fb923c" font-weight="bold">bolted connection</text>' +
    '<text x="14" y="86" font-size="6" fill="#a1a1aa">3 high-strength bolts in shear</text>' +
    '</svg>';
}

function processFlowSVG() {
  var labels = ['RFQ','Bid','Award','Detail','Material','Fab','Coat','Ship','Erect'];
  var svg = '<svg viewBox="0 0 540 100" style="width:100%;height:auto;">' +
    '<line x1="20" y1="50" x2="500" y2="50" stroke="#52525b" stroke-width="2" stroke-dasharray="3,3"/>';
  for (var i = 0; i < labels.length; i++) {
    var x = 20 + i * 60;
    var color = i % 2 === 0 ? '#ea580c' : '#fbbf24';
    svg += '<g>' +
      '<circle cx="' + x + '" cy="50" r="14" fill="' + color + '" stroke="#000" stroke-width="1.5"/>' +
      '<text x="' + x + '" y="53" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">' + (i + 1) + '</text>' +
      '<text x="' + x + '" y="80" font-size="9" fill="#e4e4e7" text-anchor="middle" font-family="JetBrains Mono, monospace">' + labels[i] + '</text>' +
      '</g>';
  }
  return svg + '</svg>';
}

function shuffleArr(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

  glossFilter: '',

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function getCategory(catId) { for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === catId) return CATEGORIES[i]; return null; }
function getLesson(cat, lessonId) { for (var i = 0; i < cat.lessons.length; i++) if (cat.lessons[i].id === lessonId) return cat.lessons[i]; return null; }
function totalLessons() { var t = 0; for (var i = 0; i < CATEGORIES.length; i++) t += CATEGORIES[i].lessons.length; return t; }
function completedCount() { return Object.keys(state.completed).length; }
function size(obj) { return Object.keys(obj).length; }

  var html = '';
  html += '<button class="cat-card ' + (allDone ? 'is-complete' : '') + '" data-action="open-cat" data-cat-id="' + c.id + '">';
  html += '<div class="cat-card-band" style="background: ' + c.color + ';"></div>';

  html += '<div class="cat-card-icon" style="background: ' + c.color + ';">' + icon(c.iconKey, 22, '#000') + '</div>';
  if (allDone) html += icon('check', 18, '#10b981');
  html += '</div>';
  html += '<h3 class="cat-card-title">' + escapeHtml(c.title) + '</h3>';
  html += '<p class="cat-card-blurb">' + escapeHtml(c.blurb) + '</p>';

function renderLessonRow(cat, l, idx) {
  var isDone = !!state.completed[l.id];
  var prevDone = idx === 0 || !!state.completed[cat.lessons[idx - 1].id];
  var locked = !isDone && !prevDone;
  var typeLabel = l.type === 'interactive' ? 'Interactive' : 'Reading';
  var typeColor = l.type === 'interactive' ? '#ea580c' : '#a1a1aa';
  var classNames = 'lesson-row';
  if (isDone) classNames += ' is-complete';
  if (locked) classNames += ' is-locked';
  var html = '<button class="' + classNames + '"';
  if (!locked) html += ' data-action="open-lesson" data-cat-id="' + cat.id + '" data-lesson-id="' + l.id + '"';
  if (locked) html += ' disabled';
  html += '>';
  var bg, fg;
  if (isDone) { bg = '#10b981'; fg = '#fff'; }
  else if (locked) { bg = '#27272a'; fg = '#52525b'; }
  else { bg = cat.color; fg = '#000'; }
  html += '<div class="lesson-num-tile" style="background: ' + bg + '; color: ' + fg + ';">';
  if (locked) html += icon('lock', 14, '#52525b');
  else if (isDone) html += icon('check', 18, '#fff');
  else html += String(idx + 1);
  html += '</div>';
  html += '<div style="flex:1;">';
  html += '<p class="lesson-row-title">' + escapeHtml(l.title) + '</p>';
  html += '<p class="lesson-row-meta" style="color: ' + typeColor + ';">' + typeLabel + ' &middot; ~' + l.minutes + ' min</p>';
  html += '</div>';
  if (!locked) html += icon('arrow-right', 16, '#71717a');
  html += '</button>';
  return html;
}

// ─── MULTIPLE CHOICE QUIZ (Shape Quiz, generic) ─────────────────────────────
function renderQuizMC(cat, lesson, questions, passThreshold, label, passMsg, failMsg) {
  var key = lesson.id;
  var answers = state.quizAnswers[key] || {};
  var submitted = !!state.quizSubmitted[key];
  var totalQ = questions.length;
  var allAnswered = size(answers) === totalQ;
  var score = 0;
  for (var i = 0; i < totalQ; i++) if (answers[i] === questions[i].correct) score++;
  var passed = score >= passThreshold;

  var html = '';
  html += '<div class="prompt-card">';
  html += '<div class="prompt-card-row">' + icon('search', 14, '#ea580c');
  html += '<span class="prompt-card-label">' + totalQ + ' questions &middot; ' + passThreshold + ' to pass</span></div>';
  html += '<p class="prompt-card-text">Test what you learned. Read each designation, pick the right answer.</p>';
  html += '</div>';

  html += '<div style="display:flex;flex-direction:column;gap:18px;margin-bottom:18px;">';
  for (var qi = 0; qi < totalQ; qi++) {
    html += renderQuizQuestion(key, qi, questions[qi], answers[qi], submitted);
  }
  html += '</div>';

  if (!submitted) {
    html += '<button class="submit-btn" data-action="submit-quiz" data-lesson-id="' + key + '"' + (allAnswered ? '' : ' disabled') + '>';
    html += allAnswered ? 'Submit Answers' : ('Answer all ' + totalQ + ' questions');
    html += '</button>';
  } else {
    html += '<div class="result-box ' + (passed ? 'passed' : 'failed') + '">';
    html += '<p class="result-headline ' + (passed ? 'passed' : 'failed') + '">';
    html += score + ' of ' + totalQ + (passed ? '. Passed.' : '. Almost.');
    html += '</p>';
    html += '<p class="result-body">' + (passed ? passMsg : failMsg) + '</p>';
    html += '<div class="result-actions">';
    if (!passed) html += '<button class="try-again-btn" data-action="reset-quiz" data-lesson-id="' + key + '">' + icon('rotate-ccw', 11) + ' Try again</button>';
    else html += '<button class="complete-btn" data-action="complete-quiz" data-cat-id="' + cat.id + '" data-lesson-id="' + key + '">Mark Complete ' + icon('arrow-right', 16, '#000') + '</button>';
    html += '</div></div>';
  }
  return html;
}

function renderQuizQuestion(quizKey, idx, q, picked, submitted) {
  var html = '<div class="quiz-q">';
  html += '<p class="quiz-q-text"><span class="quiz-q-num">Q' + (idx + 1) + '.</span>' + escapeHtml(q.q || q.s) + '</p>';
  html += '<div class="quiz-options">';
  for (var o = 0; o < q.options.length; o++) {
    var isPicked = picked === o;
    var isCorrect = o === q.correct;
    var cls = 'quiz-option';
    if (submitted && isCorrect) cls += ' is-correct';
    else if (submitted && isPicked) cls += ' is-wrong';
    else if (isPicked) cls += ' is-picked';
    html += '<button class="' + cls + '"';
    if (!submitted) html += ' data-action="pick-option" data-quiz-key="' + quizKey + '" data-q-idx="' + idx + '" data-v="' + o + '"';
    if (submitted) html += ' disabled';
    html += '><span>' + escapeHtml(q.options[o]) + '</span>';
    if (submitted && isCorrect) html += icon('check', 14, '#34d399');
    else if (submitted && isPicked && !isCorrect) html += icon('x', 14, '#f87171');
    html += '</button>';
  }
  html += '</div>';
  if (submitted) html += '<p class="quiz-why">' + escapeHtml(q.why) + '</p>';
  html += '</div>';
  return html;
}

// ─── CONNECTION QUIZ (with weld diagrams) ───────────────────────────────────
function renderConnectionQuiz(cat, lesson) {
  var key = lesson.id;
  var answers = state.quizAnswers[key] || {};
  var submitted = !!state.quizSubmitted[key];
  var totalQ = CONNECTION_SCENARIOS.length;
  var allAnswered = size(answers) === totalQ;
  var score = 0;
  for (var i = 0; i < totalQ; i++) if (answers[i] === CONNECTION_SCENARIOS[i].correct) score++;
  var passed = score >= 4;

  var html = '';
  html += '<div class="prompt-card">';
  html += '<div class="prompt-card-row">' + icon('git-branch', 14, '#ea580c');
  html += '<span class="prompt-card-label">5 scenarios &middot; 4 to pass</span></div>';
  html += '<p class="prompt-card-text">Each scenario describes a real connection situation. Pick the right join method.</p>';
  html += '</div>';

  // weld reference grid
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px;background:#0f0f10;border:1px solid #3f3f46;margin-bottom:22px;">';
  html += '<div style="text-align:center;">' + weldSVG('fillet', 120) + '<p class="mono" style="font-size:9px;color:#fb923c;text-transform:uppercase;letter-spacing:0.15em;margin:0;">Fillet</p></div>';
  html += '<div style="text-align:center;">' + weldSVG('groove', 120) + '<p class="mono" style="font-size:9px;color:#fb923c;text-transform:uppercase;letter-spacing:0.15em;margin:0;">Groove</p></div>';
  html += '<div style="text-align:center;">' + weldSVG('plug', 120) + '<p class="mono" style="font-size:9px;color:#fb923c;text-transform:uppercase;letter-spacing:0.15em;margin:0;">Plug</p></div>';
  html += '<div style="text-align:center;">' + boltSVG(120) + '<p class="mono" style="font-size:9px;color:#fb923c;text-transform:uppercase;letter-spacing:0.15em;margin:0;">Bolted</p></div>';
  html += '</div>';

  html += '<div style="display:flex;flex-direction:column;gap:18px;margin-bottom:18px;">';
  for (var qi = 0; qi < totalQ; qi++) {
    html += renderQuizQuestion(key, qi, CONNECTION_SCENARIOS[qi], answers[qi], submitted);
  }
  html += '</div>';

  if (!submitted) {
    html += '<button class="submit-btn" data-action="submit-quiz" data-lesson-id="' + key + '"' + (allAnswered ? '' : ' disabled') + '>';
    html += allAnswered ? 'Submit Answers' : ('Answer all ' + totalQ + ' scenarios');
    html += '</button>';
  } else {
    html += '<div class="result-box ' + (passed ? 'passed' : 'failed') + '">';
    html += '<p class="result-headline ' + (passed ? 'passed' : 'failed') + '">' + score + ' of ' + totalQ + (passed ? '. You read connections.' : '.') + '</p>';
    html += '<p class="result-body">' + (passed ? 'Connections are 80% of the engineering conversation. Knowing the basic types means you can follow when Owner or Mario talks shop.' : 'Almost there. Re-read the diagrams and try again.') + '</p>';
    html += '<div class="result-actions">';
    if (!passed) html += '<button class="try-again-btn" data-action="reset-quiz" data-lesson-id="' + key + '">' + icon('rotate-ccw', 11) + ' Try again</button>';
    else html += '<button class="complete-btn" data-action="complete-quiz" data-cat-id="' + cat.id + '" data-lesson-id="' + key + '">Mark Complete ' + icon('arrow-right', 16, '#000') + '</button>';
    html += '</div></div>';
  }
  return html;
}

// ─── PROCESS ORDER ──────────────────────────────────────────────────────────
function renderProcessOrder(cat, lesson) {
  var html = '';
  html += '<div class="prompt-card">';
  html += '<div class="prompt-card-row">' + icon('cog', 14, '#ea580c');
  html += '<span class="prompt-card-label">Click in correct order</span></div>';
  html += '<p class="prompt-card-text">The 9 phases got scrambled. Click them in order from RFQ to Erection. Wrong click shakes red, try again.</p>';
  html += '</div>';

  html += '<div class="process-ref"><p>Reference: the correct order</p>' + processFlowSVG() + '</div>';

  if (state.processPicked.length > 0) {
    html += '<div style="margin-bottom:16px;">';
    html += '<p class="mono" style="font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:0.2em;margin:0 0 8px;">Your sequence so far</p>';
    html += '<div class="picked-row">';
    for (var i = 0; i < state.processPicked.length; i++) {
      var p = state.processPicked[i];
      html += '<div class="picked-tile"><span class="picked-num">' + (i + 1) + '.</span> ' + escapeHtml(p.label) + ' ' + icon('check', 12, '#000') + '</div>';
    }
    html += '</div></div>';
  }

  var isDone = state.processPicked.length === PROCESS_STEPS.length;

  if (!isDone) {
    html += '<div class="step-grid">';
    for (var s = 0; s < state.processAvailable.length; s++) {
      var step = state.processAvailable[s];
      var shakeClass = state.shakeId === step.id ? ' shake-now shake' : '';
      html += '<button class="step-tile' + shakeClass + '" data-action="pick-step" data-step-id="' + step.id + '">';
      html += '<p class="step-tile-label">' + escapeHtml(step.label) + '</p>';
      html += '<p class="step-tile-desc">' + escapeHtml(step.desc) + '</p>';
      html += '</button>';
    }
    html += '</div>';
  }

  if (isDone) {
    html += '<div style="background:rgba(16,185,129,0.1);border:2px solid #10b981;padding:18px;margin-bottom:14px;">';
    html += '<p class="bebas" style="font-size:24px;color:#6ee7b7;margin:0 0 8px;">All 9 in order. Done.</p>';
    html += '<p style="font-size:13px;color:#d4d4d8;margin:0;line-height:1.6;">That is the lifecycle of every project we run. RFQ in, building standing 8-15 weeks later. The front desk touches Phase 1 (RFQ intake), Phase 2 (sending bids), and Phase 3 (logging the award). The shop runs 4 through 8. The erector handles 9.</p>';
    html += '</div>';
  }

  html += '<div class="result-actions">';
  html += '<button class="try-again-btn" data-action="reset-process">' + icon('rotate-ccw', 11) + ' Reshuffle</button>';
  if (isDone) {
    html += '<button class="complete-btn" data-action="complete-quiz" data-cat-id="' + cat.id + '" data-lesson-id="' + lesson.id + '" style="margin-left:auto;">Mark Complete ' + icon('arrow-right', 16, '#000') + '</button>';
  }
  html += '</div>';
  return html;
}

// ─── GLOSSARY ───────────────────────────────────────────────────────────────
function renderGlossary(cat, lesson) {
  var filter = (state.glossFilter || '').toLowerCase();
  var filtered = GLOSSARY.filter(function(g) {
    return g.term.toLowerCase().indexOf(filter) >= 0 || g.def.toLowerCase().indexOf(filter) >= 0;
  });
  var reviewedCount = size(state.glossReviewed);
  var canComplete = reviewedCount >= 20;

  var html = '';
  html += '<div class="prompt-card">';
  html += '<div class="prompt-card-row">' + icon('book-open', 14, '#ea580c');
  html += '<span class="prompt-card-label">25 terms &middot; tap to mark reviewed</span></div>';
  html += '<p class="prompt-card-text">The vocabulary of structural steel. You do not need to memorize all 25, but you should recognize them when you hear them on the phone or in an email.</p>';
  html += '</div>';

  html += '<div class="gloss-search-wrap">';
  html += '<div class="gloss-search-icon">' + icon('search', 14, '#71717a') + '</div>';
  html += '<input class="gloss-search-input" type="text" id="gloss-filter-input" placeholder="Filter terms..." value="' + escapeHtml(state.glossFilter) + '" />';
  html += '</div>';

  html += '<div class="gloss-grid">';
  for (var i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var isReviewed = !!state.glossReviewed[g.term];
    html += '<button class="gloss-card ' + (isReviewed ? 'is-reviewed' : '') + '" data-action="review-term" data-term="' + escapeHtml(g.term) + '">';
    html += '<div class="gloss-card-top">';
    html += '<span class="gloss-card-term">' + escapeHtml(g.term) + '</span>';
    if (isReviewed) html += icon('check', 14, '#ea580c');
    html += '</div>';
    html += '<p class="gloss-card-def">' + escapeHtml(g.def) + '</p>';
    html += '</button>';
  }
  html += '</div>';

  html += '<p class="reviewed-counter">' + reviewedCount + ' of ' + GLOSSARY.length + ' reviewed</p>';

  html += '<button class="submit-btn" style="background:' + (canComplete ? '#fbbf24' : '#27272a') + ';color:' + (canComplete ? '#000' : '#52525b') + ';border-color:' + (canComplete ? '#fbbf24' : '#3f3f46') + ';" ';
  if (canComplete) html += 'data-action="complete-quiz" data-cat-id="' + cat.id + '" data-lesson-id="' + lesson.id + '"';
  else html += 'disabled';
  html += '>';
  html += canComplete ? 'Mark Complete' : ('Review at least 20 terms (' + reviewedCount + '/20)');
  html += '</button>';
  return html;
}

// ─── TERM MATCH ─────────────────────────────────────────────────────────────
function renderTermMatch(cat, lesson) {
  var assignments = state.matchAssignments;
  var submitted = state.matchSubmitted;
  var allMatched = MATCH_PAIRS.every(function(p) { return !!assignments[p.term]; });
  var correctCount = 0;
  for (var i = 0; i < MATCH_PAIRS.length; i++) {
    if (assignments[MATCH_PAIRS[i].term] === MATCH_PAIRS[i].def) correctCount++;
  }
  var passed = correctCount >= 7;

  var html = '';
  html += '<div class="prompt-card">';
  html += '<div class="prompt-card-row">' + icon('hash', 14, '#ea580c');
  html += '<span class="prompt-card-label">Match terms to definitions</span></div>';
  html += '<p class="prompt-card-text">Tap a term, then tap its definition. Tap again to change. 7 of 8 to pass.</p>';
  html += '</div>';

  // term tiles
  html += '<div class="match-term-grid">';
  for (var t = 0; t < MATCH_PAIRS.length; t++) {
    var p = MATCH_PAIRS[t];
    var isActive = state.matchActiveTerm === p.term;
    var matched = assignments[p.term];
    var cls = 'match-term-tile';
    if (submitted && matched && matched === p.def) cls += ' is-correct';
    else if (submitted && matched && matched !== p.def) cls += ' is-wrong';
    else if (isActive) cls += ' is-active';
    else if (matched) cls += ' is-matched';
    html += '<button class="' + cls + '"';
    if (!submitted) html += ' data-action="match-tap-term" data-term="' + escapeHtml(p.term) + '"';
    if (submitted) html += ' disabled';
    html += '>' + escapeHtml(p.term) + '</button>';
  }
  html += '</div>';

  // definitions
  html += '<div class="match-def-list">';
  for (var d = 0; d < state.matchDefs.length; d++) {
    var def = state.matchDefs[d];
    var matchedTo = null;
    for (var ti = 0; ti < MATCH_PAIRS.length; ti++) {
      if (assignments[MATCH_PAIRS[ti].term] === def) { matchedTo = MATCH_PAIRS[ti].term; break; }
    }
    var defCls = 'match-def-tile';
    if (submitted && matchedTo) {
      var isCorrectMatch = false;
      for (var pi = 0; pi < MATCH_PAIRS.length; pi++) {
        if (MATCH_PAIRS[pi].term === matchedTo && MATCH_PAIRS[pi].def === def) { isCorrectMatch = true; break; }
      }
      defCls += isCorrectMatch ? ' is-correct' : ' is-wrong';
    } else if (matchedTo) {
      defCls += ' is-matched';
    } else if (!state.matchActiveTerm && !submitted) {
      defCls += ' is-dim';
    }
    html += '<button class="' + defCls + '"';
    if (!submitted && state.matchActiveTerm) html += ' data-action="match-tap-def" data-def="' + escapeHtml(def) + '"';
    else html += ' disabled';
    html += '><span>' + escapeHtml(def) + '</span>';
    if (matchedTo) html += '<span class="match-def-arrow">&larr; ' + escapeHtml(matchedTo) + '</span>';
    html += '</button>';
  }
  html += '</div>';

  if (!submitted) {
    html += '<button class="submit-btn" data-action="submit-match"' + (allMatched ? '' : ' disabled') + '>';
    html += allMatched ? 'Submit Answers' : ('Match all ' + MATCH_PAIRS.length + ' terms');
    html += '</button>';
  } else {
    html += '<div class="result-box ' + (passed ? 'passed' : 'failed') + '">';
    html += '<p class="result-headline ' + (passed ? 'passed' : 'failed') + '">' + correctCount + ' of ' + MATCH_PAIRS.length + (passed ? '. The vocabulary is yours.' : '. Almost.') + '</p>';
    html += '<div class="result-actions">';
    if (!passed) html += '<button class="try-again-btn" data-action="reset-match">' + icon('rotate-ccw', 11) + ' Try again</button>';
    else html += '<button class="complete-btn" data-action="complete-quiz" data-cat-id="' + cat.id + '" data-lesson-id="' + lesson.id + '">Mark Complete ' + icon('arrow-right', 16, '#000') + '</button>';
    html += '</div></div>';
  }
  return html;
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render() {
  var app = document.getElementById('app');
  var html = '';
  if (state.view === 'home') {
    html = renderHome();
  } else if (state.view.indexOf('cat:') === 0) {
    var c = getCategory(state.view.slice(4));
    if (c) html = renderCategory(c);
  } else if (state.view.indexOf('lesson:') === 0) {
    var parts = state.view.split(':');
    var c2 = getCategory(parts[1]);
    var l2 = c2 ? getLesson(c2, parts[2]) : null;
    if (c2 && l2) html = renderLesson(c2, l2);
  }
  app.innerHTML = html;
  document.getElementById('header-progress').textContent = completedCount() + '/' + totalLessons();

  // re-attach glossary search input listener since it gets recreated
  var glossInput = document.getElementById('gloss-filter-input');
  if (glossInput) {
    glossInput.addEventListener('input', function(ev) {
      state.glossFilter = ev.target.value;
      // update only the grid + counter, not the whole view (to keep input focus)
      var newFilter = (state.glossFilter || '').toLowerCase();
      var matches = GLOSSARY.filter(function(g) {
        return g.term.toLowerCase().indexOf(newFilter) >= 0 || g.def.toLowerCase().indexOf(newFilter) >= 0;
      });
      var grid = document.querySelector('.gloss-grid');
      if (grid) {
        var html = '';
        for (var i = 0; i < matches.length; i++) {
          var g = matches[i];
          var isReviewed = !!state.glossReviewed[g.term];
          html += '<button class="gloss-card ' + (isReviewed ? 'is-reviewed' : '') + '" data-action="review-term" data-term="' + escapeHtml(g.term) + '">';
          html += '<div class="gloss-card-top">';
          html += '<span class="gloss-card-term">' + escapeHtml(g.term) + '</span>';
          if (isReviewed) html += icon('check', 14, '#ea580c');
          html += '</div>';
          html += '<p class="gloss-card-def">' + escapeHtml(g.def) + '</p>';
          html += '</button>';
        }
        grid.innerHTML = html;
      }
    });
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================================
// EVENTS
// ============================================================================
function markComplete(catId, lessonId) {
  state.completed[lessonId] = true;
  var cat = getCategory(catId);
  var lesson = getLesson(cat, lessonId);
  var idx = cat.lessons.indexOf(lesson);
  if (idx >= 0 && idx < cat.lessons.length - 1) {
    state.view = 'lesson:' + catId + ':' + cat.lessons[idx + 1].id;
  } else {
    state.view = 'cat:' + catId;
  }
  render();
}

document.body.addEventListener('click', function(ev) {
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  var action = t.getAttribute('data-action');

  if (action === 'open-cat') {
    state.view = 'cat:' + t.getAttribute('data-cat-id');
    render();
  } else if (action === 'open-lesson') {
    state.view = 'lesson:' + t.getAttribute('data-cat-id') + ':' + t.getAttribute('data-lesson-id');
    render();
  } else if (action === 'back-home') {
    state.view = 'home';
    render();
  } else if (action === 'complete-reading') {
    markComplete(t.getAttribute('data-cat-id'), t.getAttribute('data-lesson-id'));
  } else if (action === 'pick-option') {
    var qkey = t.getAttribute('data-quiz-key');
    var qidx = parseInt(t.getAttribute('data-q-idx'), 10);
    var v = parseInt(t.getAttribute('data-v'), 10);
    if (!state.quizAnswers[qkey]) state.quizAnswers[qkey] = {};
    state.quizAnswers[qkey][qidx] = v;
    render();
  } else if (action === 'submit-quiz') {
    state.quizSubmitted[t.getAttribute('data-lesson-id')] = true;
    render();
  } else if (action === 'reset-quiz') {
    var lk = t.getAttribute('data-lesson-id');
    state.quizAnswers[lk] = {};
    state.quizSubmitted[lk] = false;
    render();
  } else if (action === 'complete-quiz') {
    markComplete(t.getAttribute('data-cat-id'), t.getAttribute('data-lesson-id'));
  } else if (action === 'toggle-shape') {
    var sid = t.getAttribute('data-shape-id');
    if (state.expandedShapes[sid]) delete state.expandedShapes[sid];
    else state.expandedShapes[sid] = true;
    render();
  } else if (action === 'pick-step') {
    var sId = parseInt(t.getAttribute('data-step-id'), 10);
    var expectedNext = state.processPicked.length + 1;
    if (sId !== expectedNext) {
      state.shakeId = sId;
      render();
      setTimeout(function() { state.shakeId = null; render(); }, 400);
      return;
    }
    var step = null;
    for (var si = 0; si < state.processAvailable.length; si++) {
      if (state.processAvailable[si].id === sId) { step = state.processAvailable[si]; break; }
    }
    if (step) {
      state.processPicked.push(step);
      state.processAvailable = state.processAvailable.filter(function(x) { return x.id !== sId; });
    }
    render();
  } else if (action === 'reset-process') {
    state.processPicked = [];
    state.processAvailable = shuffleArr(PROCESS_STEPS);
    render();
  } else if (action === 'review-term') {
    state.glossReviewed[t.getAttribute('data-term')] = true;
    render();
  } else if (action === 'match-tap-term') {
    var term = t.getAttribute('data-term');
    state.matchActiveTerm = state.matchActiveTerm === term ? null : term;
    render();
  } else if (action === 'match-tap-def') {
    if (!state.matchActiveTerm) return;
    var newDef = t.getAttribute('data-def');
    var newAss = {};
    Object.keys(state.matchAssignments).forEach(function(k) {
      if (state.matchAssignments[k] !== newDef) newAss[k] = state.matchAssignments[k];
    });
    newAss[state.matchActiveTerm] = newDef;
    state.matchAssignments = newAss;
    state.matchActiveTerm = null;
    render();
  } else if (action === 'submit-match') {
    state.matchSubmitted = true;
    render();
  } else if (action === 'reset-match') {
    state.matchAssignments = {};
    state.matchActiveTerm = null;
    state.matchSubmitted = false;
    state.matchDefs = shuffleArr(MATCH_PAIRS).map(function(p) { return p.def; });
    render();
  }
});

// ============================================================================
// INIT
// ============================================================================
document.getElementById('logo-slot').innerHTML = icon('hard-hat', 22, '#000');
render();
</script>
