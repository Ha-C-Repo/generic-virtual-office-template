<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Professional Business Communication | Your Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#000;color:#e4e4e7;
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% 8%,rgba(13,148,136,0.10),transparent 40%),
    radial-gradient(circle at 15% 92%,rgba(8,145,178,0.07),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}

header.site{border-bottom:2px solid #27272a;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#0d9488;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#52525b;}
.header-meta .big{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #27272a;text-align:center;}
footer.site p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#3f3f46;}

/* Hero */
.lab-hero{position:relative;border:2px solid #3f3f46;background:#18181b;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(13,148,136,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.3) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#0d9488;border-radius:50%;filter:blur(80px);opacity:.22;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#5eead4;margin-bottom:8px;}
.lab-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#5eead4;}
.lab-blurb{color:#a1a1aa;max-width:540px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #3f3f46;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#5eead4;margin:0;}
.lab-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#52525b;margin:0;}

/* Category cards */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#18181b;border:2px solid #3f3f46;padding:0;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#10b981;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#a1a1aa;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#27272a;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#10b981;}

/* Category view */
.cat-back-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#71717a;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#18181b;border:2px solid #3f3f46;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#a1a1aa;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#18181b;
  border:2px solid #3f3f46;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#10b981;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;}
.lesson-num-tile.done   {background:#10b981;color:#000;}
.lesson-num-tile.current{background:#5eead4;color:#000;}
.lesson-num-tile.pending{background:#27272a;color:#71717a;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

/* Reading card */
.lesson-card{border:2px solid #3f3f46;background:#18181b;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.8;margin:0;}
.lesson-card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#5eead4;margin:0 0 8px;}
.lesson-section p{color:#a1a1aa;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(13,148,136,.08);border-left:4px solid #0d9488;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#5eead4;margin:0 0 6px;font-weight:700;}
.tip-body{color:#99f6e4;font-size:13px;margin:0;line-height:1.55;font-style:italic;}

/* Roster table (for er-1) */
.roster{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.roster-row{background:#0c0c0c;border:1px solid #3f3f46;padding:12px 14px;}
.roster-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#5eead4;margin-bottom:4px;}
.roster-owns{font-size:12px;color:#a1a1aa;line-height:1.5;}

/* Phone scripts table */
.scripts-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.script-block{background:#0c0c0c;border:1px solid #3f3f46;padding:14px;}
.script-num{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#5eead4;margin-bottom:4px;}
.script-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-bottom:8px;line-height:1.1;}
.script-quote{font-style:italic;font-size:13px;color:#d4d4d8;border-left:3px solid #0d9488;padding-left:10px;line-height:1.6;}
.script-rule{font-size:11px;color:#a1a1aa;margin-top:8px;line-height:1.5;}

.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#0d9488;color:#fff;border:2px solid #0d9488;
  display:flex;align-items:center;justify-content:center;gap:10px;}

/* Interactive shared */
.int-card{border:2px solid #3f3f46;background:#18181b;}
.int-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.int-card-body{padding:24px 22px;}

/* Voice Rewrite */
.vr-stage{background:#0c0c0c;border:1px solid #3f3f46;padding:16px;margin-bottom:14px;}
.vr-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#5eead4;margin-bottom:8px;}
.vr-original{background:#1c1917;border-left:3px solid #ef4444;padding:10px 14px;margin-bottom:14px;}
.vr-original-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#fca5a5;margin-bottom:4px;}
.vr-original-text{font-size:13px;color:#e4e4e7;font-style:italic;line-height:1.5;}
.vr-options{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.vr-opt{padding:10px 14px;background:#09090b;border:1px solid #3f3f46;text-align:left;font-size:13px;color:#a1a1aa;line-height:1.45;}
.vr-opt:hover{border-color:#5eead4;}
.vr-opt.correct{background:rgba(16,185,129,.12);border-color:#10b981;color:#a7f3d0;}
.vr-opt.wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.vr-feedback{margin-top:14px;padding:10px 14px;font-size:12px;line-height:1.55;}
.vr-feedback.ok{background:rgba(16,185,129,.08);border:1px solid #10b981;color:#a7f3d0;}
.vr-feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}
.vr-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.vr-progress{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#71717a;}
.vr-next{padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#0d9488;color:#fff;border:2px solid #0d9488;}

/* Escalation Routing Quiz */
.er-stage{background:#0c0c0c;border:1px solid #3f3f46;padding:16px;margin-bottom:14px;}
.er-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#22d3ee;margin-bottom:8px;}
.er-scenario{font-size:14px;color:#e4e4e7;margin-bottom:14px;line-height:1.55;}
.er-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;}
.er-btn{padding:10px 8px;background:#09090b;border:1px solid #3f3f46;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.1em;color:#a1a1aa;}
.er-btn:hover{border-color:#22d3ee;}
.er-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}
.er-btn.picked-wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.er-btn.correct-shown{background:rgba(16,185,129,.08);border-color:#10b981;color:#a7f3d0;}
.er-feedback{margin-top:14px;padding:10px 14px;font-size:12px;line-height:1.55;}
.er-feedback.ok{background:rgba(16,185,129,.08);border:1px solid #10b981;color:#a7f3d0;}
.er-feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}

/* Phone Script Picker */
.psp-stage{background:#0c0c0c;border:1px solid #3f3f46;padding:16px;margin-bottom:14px;}
.psp-call-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa;margin-bottom:8px;}
.psp-call-line{font-style:italic;font-size:13px;color:#d4d4d8;border-left:3px solid #1e40af;padding:10px 12px;background:#1e1e2e;line-height:1.6;}
.psp-pick-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#a1a1aa;margin-top:14px;margin-bottom:8px;}
.psp-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;}
.psp-opt{padding:10px 12px;background:#09090b;border:1px solid #3f3f46;text-align:left;font-size:12px;color:#a1a1aa;line-height:1.4;}
.psp-opt:hover{border-color:#60a5fa;}
.psp-opt.correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}
.psp-opt.wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.psp-reveal{margin-top:14px;}
.psp-script-box{background:#1c1917;border:1px solid #0d9488;padding:14px;}
.psp-script-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#5eead4;margin-bottom:6px;}
.psp-script-text{font-style:italic;font-size:13px;color:#d4d4d8;line-height:1.65;}
.psp-rule{font-size:11px;color:#a1a1aa;margin-top:10px;line-height:1.5;font-style:normal;}

.score-line{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  color:#a1a1aa;margin-top:16px;padding-top:14px;border-top:1px solid #27272a;}
</style>
</head>

const LESSON_CONTENT={
  'mv-1':{ sections:[
    { h:'Short sentences carry weight', b:'If a sentence can be split in two, split it. "We received your quote and we appreciate the detailed work but we have some concerns about the timeline that we would like to discuss." Becomes: "We received your quote. The detail is appreciated. We have concerns about the timeline. Let us discuss." Same content. Half the words. More impact.' },
    { h:'Specific numbers beat vague language', b:'"Soon" means nothing. "By Friday at 5 PM" means something. "A lot of jobs" is weak. "47 jobs since 2020" is strong. If you do not have a number, find one before sending.' },
    { h:'Active voice, never passive', b:'Active: Mario welded the connection. Passive: The connection was welded by Mario. Active is shorter and clearer. Passive hides who did what. Owner does not hide who did what.' },

      '<div class="roster-row"><div class="roster-name">The Owner (CEO)</div><div class="roster-owns">Strategic decisions, client-facing commitments, pricing, bid acceptance and rejection, hiring, anything over $5,000 unbudgeted, all media or PR. Final approval on anything that commits the company externally.</div></div>'+
      '<div class="roster-row"><div class="roster-name">Joseph Hasse (IT / EA to CEO)</div><div class="roster-owns">IT infrastructure, M365, this training, virtual office systems, document templates, Excel formulas, calendar templates, anything technical that breaks. Default routing destination when you are unsure.</div></div>'+
      '<div class="roster-row"><div class="roster-name">Amber (COO)</div><div class="roster-owns">Legal review, LLC paperwork, contracts before signature, commercial product reviews, IP questions, insurance claims, collections from vendors or to vendors.</div></div>'+
      '<div class="roster-row"><div class="roster-name">Paul Guerrero (Safety Director, NCCER #27160819)</div><div class="roster-owns">All safety incidents, ISNetworld document submissions, RAVS questionnaires, OSHA inspections, EMR letter coordination with Texas Mutual (Policy [POLICY NUMBER], 800-859-5995), safety training records, Marathon Petroleum compliance pathway.</div></div>'+
      '<div class="roster-row"><div class="roster-name">Mario Gutierrez (Crew Lead / Welding Lead, AWS D1.1)</div><div class="roster-owns">Shop floor operations, weld questions, fab quality, ironworker schedules, jobsite execution. Day-to-day shop authority when Owner is offsite.</div></div>'+
    '</div>' },
  'er-2':{ sections:[
    { h:'Default escalation order', b:'If you do not know who handles it: Joseph first. He can usually answer or knows who can. Joseph escalates to Owner if it requires the CEO. Never go directly to Owner unless it is a client he is expecting, an emergency, or Joseph has told you it is his decision.' },
    { h:'The 5-minute rule', b:'If someone calls or walks in and you genuinely do not know what to do, give yourself 5 minutes to figure it out before interrupting anyone. Check Teams, search OneDrive for past handling of similar items, or ask Joseph by chat (not phone). Most situations resolve in 5 minutes of clear thinking.' },
    { h:'Hot transfers vs. messages', b:'Emergency or time-sensitive: hot-transfer the call (put them on hold, tell the recipient who is holding and why, then transfer). Routine: take a message and send it via Teams chat with caller name, company, callback number, and the reason in one sentence. Never write down "caller wants to discuss something." Useless.' }
  ], tip:'A good message has all four: name spelled out, company, callback number, reason in one sentence. If you cannot give all four, you did not finish the call.' },
  'pt-1':{ sections:[
    { h:'Email is the default for everything that matters', b:'A decision. A commitment. A price. A deadline. A question that needs an answer in writing. Email. Email creates the paper trail. Email is searchable, archivable, and admissible. Text and phone calls are not. Default to email.' },
    { h:'Text only for urgency-with-no-decision', b:'"I am running 10 minutes late." Text. "Can you confirm the meeting price?" Email. Text is for time-sensitive operational signals: I am here, I am running late, the gate is open, the truck is loaded. Anything that requires a decision or commits to a number goes in email.' },
    { h:'Phone calls are the worst record', b:'Most call notes are reconstructed after the fact, which means they are wrong. If you call someone, follow up the call with an email summarizing what was discussed and what each side committed to. Subject: "Recap from our call today." Do this even when it feels redundant. The recap is the record.' }
  ], tip:'Owner\'s rule: if it is not in email, it did not happen. That does not mean every conversation needs a paragraph-long follow-up. It means anything that commits Your Company to action, money, or time gets a confirmation email. No exceptions.' },
  'pt-2':{ sections:[
    { h:'Document: commitments and dollar amounts', b:'Anyone (vendor, client, employee) makes a commitment involving Your Company money or time, document it. Email confirmation: "Confirming our conversation today. ICD will deliver the structural drawings by Friday May 17. We will return marked-up drawings by Tuesday May 21." Names, dates, deliverables, deadlines.' },
    { h:'Document: anything that could be disputed later', b:'A vendor delivers late. A client changes scope verbally on site. An employee verbally agrees to overtime. These can all become disputes. The email record protects everyone. Send the documentation email even when the other side is cooperative. Especially then.' },
    { h:'Document: every inspection, audit, or compliance interaction', b:'OSHA visit. Texas Mutual call. ISNetworld update. Marathon Petroleum compliance review. Every one gets a written summary in email immediately afterward. Cc Paul on safety items. Cc Amber on compliance items. The compliance record at Your Company is built from these emails.' }
  ], tip:'Write the subject line so a stranger reading it six months from now knows what is inside. "Recap: ICD drawing delivery commitment - May 14" beats "Following up."' },
  'pt-3':{ sections:[
    { h:'Confirm in writing within one hour', b:'After any meeting, call, or in-person commitment involving Your Company, send the confirmation email within one hour. Memory degrades fast. After 24 hours you are guessing what was said.' },
    { h:'The structure: who, what, when, who owns what', b:'Subject: "Recap: [topic] - [date]." Body: "Confirming our conversation today. [Their name] committed to [X] by [date]. Your Company will [Y] by [date]. Please reply if anything is off." Five sentences. Done.' },
    { h:'"Please reply if anything is off" is the magic phrase', b:'This sentence flips the burden of correction onto the other party. If they do not reply, you have a documented agreement. If they reply with corrections, you have a documented agreement. Either way, you have the record.' }
  ], tip:'Confirmation emails are not negotiations. Do not write "I think we agreed that..." Write "We agreed that..." Then "Please reply if anything is off." Confidence flips the dynamic.' },
  'ps-1':{ sections:[
    { h:'The Your Company greeting', b:'"Your Company, this is [Your Name], how can I help you?" Eight words. Says the company. Says who is answering. Opens the door. Never "hello?" Never "this is [Your Name] speaking." Never your personal cell voicemail greeting.' },
    { h:'Listen before you speak', b:'Let the caller finish their first sentence before responding. Most callers tell you in the first sentence why they are calling. If you cut them off, you waste both your time.' },
    { h:'Always get three things: name, company, callback', b:'Before transferring or taking a message: name (spelled), company, callback number. If they refuse to provide these, that itself is information. Tell Owner "caller refused to identify themselves." He will know what to do.' },
    { h:'The hold protocol', b:'"I am going to put you on hold for one moment while I check on that." Press hold. Do not leave the line open. When you return: "Thanks for holding. [Outcome.]" Never leave anyone on hold for more than 90 seconds. If you need longer, take their number and call back.' }
  ], tip:'Speak slower on the phone than you think you need to. Phone audio is worse than in-person. Names and numbers especially: slow down for those.' },
  'ps-2':{ sections:[
    { h:'These are scripts, not rituals', b:'Each one handles a specific call type that comes in regularly. Read them, save them where you can grab them in 5 seconds, practice them once or twice. Then they become muscle memory.' }
  ], tip:'Print these. Put them in a folder at the front desk. The first call you take that fits one of the eight types: read the script word for word until the conversation flows. By the fifth call of that type, the words are yours.',
    customHtml:'<div class="scripts-list">'+
      '<div class="script-block"><div class="script-num">Script 01 &middot; Vendor pitch (incoming sales call)</div>'+
        '<div class="script-title">Polite block, no callback</div>'+
        '<div class="script-quote">"Thanks for the call. We are not actively evaluating new vendors right now. If you would like to send a brief introduction to info@yourcompany.example.com, we will add it to our file for future reference. Have a good day."</div>'+
        '<div class="script-rule">Do not promise a callback. Do not transfer. Do not ask what they are selling. End the call.</div></div>'+

        '<div class="script-title">Hand to Owner, fast and clean</div>'+

        '<div class="script-rule">Get full details. Email Owner within 10 minutes with the recap. Subject: "NEW CLIENT - [Company] - [Project type]."</div></div>'+
      '<div class="script-block"><div class="script-num">Script 03 &middot; Emergency (injury, accident)</div>'+

        '<div class="script-rule">Hot-transfer to Paul. If Paul unavailable, hot-transfer to Owner. Document the call timestamp immediately. After: email both with what was said.</div></div>'+

        '<div class="script-rule">Do not accept delivery without paperwork match. Check the bid pipeline. Call the project lead. If unsure: politely ask driver to wait, escalate to Joseph or Owner.</div></div>'+

        '<div class="script-rule">Hot-transfer if Paul is available. If not, get all details. Tell inspector Paul will call back within one hour. Email Paul and Owner immediately.</div></div>'+

};

// ============================================================================
// HELPERS
// ============================================================================
function esc(s){ if(s==null)return''; return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function getCat(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i]; return null; }
function getLesson(id){
  for(var i=0;i<CATEGORIES.length;i++){
    var c=CATEGORIES[i];
    for(var j=0;j<c.lessons.length;j++) if(c.lessons[j].id===id) return{lesson:c.lessons[j],cat:c,idx:j};
  }return null;
}
function totalLessons(){ return CATEGORIES.reduce(function(a,c){return a+c.lessons.length;},0); }
function completedCount(){ return Object.keys(state.completed).length; }

// ============================================================================
// RENDER: HOME
// ============================================================================
function renderHome(){
  var done=completedCount();
  var html='';
  html+='<div class="lab-hero"><div class="hero-grid"></div><div class="hero-glow"></div>';
  html+='<div class="lab-hero-inner">';
  html+='<p class="lab-eyebrow">Your Company &middot; Module 7</p>';
  html+='<h1 class="lab-h1">Business <span class="accent">Communication</span></h1>';
  html+='<p class="lab-blurb">Owner\'s voice on the page. The escalation matrix in your head. Paper trail discipline so nothing falls through. Eight phone scripts ready to deploy. Four categories, twelve lessons, three drills.</p>';
  html+='<div class="lab-stats">';
  [['4','Categories'],[String(totalLessons()),'Lessons'],['3','Drills'],[String(done),'Done']].forEach(function(s){
    html+='<div class="lab-stat"><p class="lab-stat-num">'+s[0]+'</p><p class="lab-stat-lbl">'+s[1]+'</p></div>';
  });
  html+='</div></div></div>';

  html+='<div class="cat-grid">';
  CATEGORIES.forEach(function(cat){
    var doneN=cat.lessons.filter(function(l){return state.completed[l.id];}).length;
    var tot=cat.lessons.length;
    var allDone=doneN===tot;
    var pct=tot?(doneN/tot)*100:0;
    html+='<button class="cat-card'+(allDone?' is-done':'')+'" data-action="open-cat" data-cat-id="'+cat.id+'">';
    html+='<div class="cat-stripe" style="background:'+cat.color+';"></div>';
    html+='<div class="cat-inner">';
    html+='<div class="cat-top"><div class="cat-icon-tile" style="background:'+cat.color+';">'+icon(cat.iconKey,22,'#fff')+'</div>';
    if(allDone) html+=icon('check',18,'#10b981');
    html+='</div>';
    html+='<h3>'+esc(cat.title)+'</h3>';
    html+='<p class="cat-card-blurb">'+esc(cat.blurb)+'</p>';
    html+='<div class="cat-card-foot"><span>'+doneN+'/'+tot+' lessons</span>';
    html+='<div class="cat-progress-track"><div class="cat-progress-fill" style="width:'+pct+'%;"></div></div>';
    html+='</div></div></button>';
  });
  html+='</div>';
  return html;
}

function renderCategory(cat){
  var html='';
  html+='<button class="cat-back-btn" data-action="back-home">'+icon('arrow-left',13)+' Back to module home</button>';
  html+='<div class="cat-header"><div class="cat-header-inner">';
  html+='<div class="cat-header-icon" style="background:'+cat.color+';">'+icon(cat.iconKey,28,'#fff')+'</div>';
  html+='<div><p class="cat-header-eyebrow" style="color:'+cat.color+';">Category</p>';
  html+='<h2 class="cat-header-title">'+esc(cat.title)+'</h2>';
  html+='<p class="cat-header-blurb">'+esc(cat.blurb)+'</p>';
  html+='</div></div></div>';
  html+='<div class="lesson-list">';
  cat.lessons.forEach(function(l,i){
    var isDone=!!state.completed[l.id];
    var prevDone=i===0||!!state.completed[cat.lessons[i-1].id];
    var locked=!isDone&&!prevDone;
    var current=!isDone&&prevDone;
    var tileCls=isDone?'done':current?'current':'pending';
    var typeLabel=l.type==='reading'?'Reading':'Drill';
    var typeColor=l.type==='reading'?'#71717a':'#5eead4';
    html+='<button class="lesson-row'+(isDone?' is-done':'')+(locked?' is-locked':'')+'"';
    html+=locked?' disabled':' data-action="open-lesson" data-lesson-id="'+l.id+'"';
    html+='>';
    html+='<div class="lesson-num-tile '+tileCls+'">'+(locked?icon('lock',14):isDone?icon('check',18):String(i+1))+'</div>';
    html+='<div class="lesson-row-meta"><p class="lesson-row-title">'+esc(l.title)+'</p>';
    html+='<p class="lesson-row-tag" style="color:'+typeColor+';">'+typeLabel+' &middot; ~'+l.minutes+' min</p></div>';
    if(!locked) html+=icon('arrow-right',16,'#71717a');
    html+='</button>';
  });
  html+='</div>';
  return html;
}

// ============================================================================
// RENDER: READING LESSON
// ============================================================================
function renderReading(lesson,cat){
  var c=LESSON_CONTENT[lesson.id]||{sections:[],tip:''};
  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="lesson-card">';
  html+='<div class="lesson-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';
  html+='<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p>';
  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="lesson-card-body">';
  c.sections.forEach(function(s){
    html+='<div class="lesson-section"><h3>'+esc(s.h)+'</h3><p>'+esc(s.b)+'</p></div>';
  });
  if(c.customHtml){
    html+=c.customHtml;
  }
  if(c.tip){
    html+='<div class="tip-box"><p class="tip-eyebrow">Joseph\'s tip</p><p class="tip-body">'+esc(c.tip)+'</p></div>';
  }
  html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  html+='</div></div>';
  return html;
}

// ============================================================================
// INTERACTIVE 1: VOICE REWRITE (mv-3)
// ============================================================================
function renderVoiceRewrite(lesson,cat){
  var idx=state.vrIdx;
  var s=VR_SCENARIOS[idx];
  var picked=state.vrPicked[s.id];
  var revealed=state.vrRevealed[s.id];
  var total=VR_SCENARIOS.length;
  var allDone=VR_SCENARIOS.every(function(sc){return state.vrRevealed[sc.id];});
  var correctCount=VR_SCENARIOS.filter(function(sc){return state.vrPicked[sc.id]===sc.correctIdx;}).length;

  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card">';
  html+='<div class="int-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';
  html+='<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p>';
  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body">';
  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:18px;">Six off-voice phrases. Pick the rewrite that actually sounds like Owner.</p>';

  html+='<div class="vr-stage">';
  html+='<p class="vr-tag">'+esc(s.tag)+'</p>';
  html+='<div class="vr-original"><p class="vr-original-label">Off-voice original</p><p class="vr-original-text">'+esc(s.original)+'</p></div>';
  html+='<div class="vr-options">';
  s.options.forEach(function(opt,i){
    var cls='vr-opt';
    if(revealed){
      if(i===s.correctIdx) cls+=' correct';
      else if(i===picked) cls+=' wrong';
    }
    html+='<button class="'+cls+'" data-action="vr-pick" data-opt-idx="'+i+'">'+esc(opt)+'</button>';
  });
  html+='</div>';
  if(revealed){
    var ok=picked===s.correctIdx;
    html+='<div class="vr-feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Not quite. ')+esc(s.why)+'</div>';
  }
  html+='<div class="vr-nav">';
  html+='<span class="vr-progress">Scenario '+(idx+1)+' of '+total+'</span>';
  if(revealed&&idx<total-1){
    html+='<button class="vr-next" data-action="vr-next">Next '+icon('arrow-right',14,'#fff')+'</button>';
  }
  html+='</div>';
  html+='</div>';

  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#5eead4')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';
  return html;
}

// ============================================================================
// INTERACTIVE 2: ROUTING QUIZ (er-3)
// ============================================================================
function renderRoutingQuiz(lesson,cat){
  var idx=state.erIdx;
  var s=ER_SCENARIOS[idx];
  var picked=state.erPicked[s.id];
  var revealed=state.erRevealed[s.id];
  var total=ER_SCENARIOS.length;
  var allDone=ER_SCENARIOS.every(function(sc){return state.erRevealed[sc.id];});
  var correctCount=ER_SCENARIOS.filter(function(sc){return state.erPicked[sc.id]===sc.correct;}).length;

  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card">';
  html+='<div class="int-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';
  html+='<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p>';
  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body">';
  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:18px;">Ten scenarios. Pick who should handle each one. Some are yours. Some go to one specific person. Get it right and you stop interrupting Owner for things Joseph could solve.</p>';

  html+='<div class="er-stage">';
  html+='<p class="er-tag">Scenario '+(idx+1)+' of '+total+'</p>';
  html+='<p class="er-scenario">'+esc(s.scenario)+'</p>';
  html+='<div class="er-buttons">';
  ER_OPTIONS.forEach(function(o){
    var cls='er-btn';
    if(revealed){
      if(o===s.correct) cls+=picked===o?' picked-correct':' correct-shown';
      else if(o===picked) cls+=' picked-wrong';
    }
    html+='<button class="'+cls+'" data-action="er-pick" data-opt="'+esc(o)+'">'+esc(o)+'</button>';
  });
  html+='</div>';
  if(revealed){
    var ok=picked===s.correct;
    html+='<div class="er-feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Should be '+esc(s.correct)+'. ')+esc(s.why)+'</div>';
    if(idx<total-1){
      html+='<div style="text-align:right;margin-top:12px;"><button class="vr-next" data-action="er-next">Next '+icon('arrow-right',14,'#fff')+'</button></div>';
    }
  }
  html+='</div>';

  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#22d3ee')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';
  return html;
}

// ============================================================================
// INTERACTIVE 3: PHONE SCRIPT PICKER (ps-3)
// ============================================================================
function renderScriptPicker(lesson,cat){
  var idx=state.pspIdx;
  var s=PSP_SCENARIOS[idx];
  var picked=state.pspPicked[s.id];
  var revealed=state.pspRevealed[s.id];
  var total=PSP_SCENARIOS.length;
  var allDone=PSP_SCENARIOS.every(function(sc){return state.pspRevealed[sc.id];});
  var correctCount=PSP_SCENARIOS.filter(function(sc){return state.pspPicked[sc.id]===sc.correctScript;}).length;

  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card">';
  html+='<div class="int-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';
  html+='<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p>';
  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body">';
  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:18px;">Eight calls coming in. Pick the right script for each one. The reveal shows the full script you would actually run.</p>';

  html+='<div class="psp-stage">';
  html+='<p class="psp-call-tag">'+icon('phone',10,'#60a5fa')+' Incoming call &middot; Scenario '+(idx+1)+' of '+total+'</p>';
  html+='<div class="psp-call-line">'+esc(s.call)+'</div>';
  html+='<p class="psp-pick-label">Which script?</p>';
  html+='<div class="psp-options">';
  PSP_SCRIPTS.forEach(function(sc){
    var cls='psp-opt';
    if(revealed){
      if(sc.id===s.correctScript) cls+=' correct';
      else if(sc.id===picked) cls+=' wrong';
    }
    html+='<button class="'+cls+'" data-action="psp-pick" data-script-id="'+sc.id+'">'+esc(sc.label)+'</button>';
  });
  html+='</div>';
  if(revealed){
    var correctScript=null;
    for(var i=0;i<PSP_SCRIPTS.length;i++){ if(PSP_SCRIPTS[i].id===s.correctScript){ correctScript=PSP_SCRIPTS[i]; break; } }
    html+='<div class="psp-reveal">';
    var ok=picked===s.correctScript;
    html+='<div class="vr-feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. Use this script:':'Should be '+esc(correctScript.label)+'. Use this script:')+'</div>';
    html+='<div class="psp-script-box" style="margin-top:10px;">';
    html+='<p class="psp-script-label">'+esc(correctScript.label)+'</p>';
    html+='<p class="psp-script-text">'+esc(correctScript.text)+'</p>';
    html+='<p class="psp-rule">'+icon('check',10,'#a1a1aa')+' '+esc(correctScript.rule)+'</p>';
    html+='</div></div>';
    if(idx<total-1){
      html+='<div style="text-align:right;margin-top:12px;"><button class="vr-next" data-action="psp-next">Next '+icon('arrow-right',14,'#fff')+'</button></div>';
    }
  }
  html+='</div>';

  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#60a5fa')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';
  return html;
}

// ============================================================================
// LESSON DISPATCHER
// ============================================================================
function renderLesson(lesson,cat){
  if(lesson.type==='reading') return renderReading(lesson,cat);
  if(lesson.intKey==='voiceRewrite') return renderVoiceRewrite(lesson,cat);
  if(lesson.intKey==='routingQuiz')  return renderRoutingQuiz(lesson,cat);
  if(lesson.intKey==='scriptPicker') return renderScriptPicker(lesson,cat);
  return renderReading(lesson,cat);
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render(){
  var app=document.getElementById('app');
  var html='';
  if(state.view==='home'){
    html=renderHome();
  } else if(state.view.indexOf('category:')===0){
    var cat=getCat(state.view.slice(9));
    html=cat?renderCategory(cat):renderHome();
  } else if(state.view.indexOf('lesson:')===0){
    var info=getLesson(state.view.slice(7));
    html=info?renderLesson(info.lesson,info.cat):renderHome();
  }
  app.innerHTML=html;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');

  if(action==='open-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='back-home'){ state.view='home'; render(); }
  else if(action==='back-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='open-lesson'){
    var lid=t.getAttribute('data-lesson-id');
    var info=getLesson(lid);
    if(info){
      if(info.lesson.intKey==='voiceRewrite'){ state.vrIdx=0; state.vrPicked={}; state.vrRevealed={}; }
      if(info.lesson.intKey==='routingQuiz'){  state.erIdx=0; state.erPicked={}; state.erRevealed={}; }
      if(info.lesson.intKey==='scriptPicker'){ state.pspIdx=0; state.pspPicked={}; state.pspRevealed={}; }
    }
    state.view='lesson:'+lid; render();
  }
  else if(action==='complete-lesson'){
    var lid2=t.getAttribute('data-lesson-id');
    state.completed[lid2]=true;
    var info2=getLesson(lid2);
    if(info2){
      var next=null;
      for(var i=0;i<info2.cat.lessons.length;i++){
        if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){ next=info2.cat.lessons[i+1]; break; }
      }
      state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;
      render();
    }
  }
  // Voice Rewrite
  else if(action==='vr-pick'){
    var sc=VR_SCENARIOS[state.vrIdx];
    if(state.vrRevealed[sc.id]) return;
    var idx=parseInt(t.getAttribute('data-opt-idx'),10);
    state.vrPicked[sc.id]=idx;
    state.vrRevealed[sc.id]=true;
    render();
  }
  else if(action==='vr-next'){
    if(state.vrIdx<VR_SCENARIOS.length-1){ state.vrIdx++; render(); }
  }
  // Routing Quiz
  else if(action==='er-pick'){
    var ers=ER_SCENARIOS[state.erIdx];
    if(state.erRevealed[ers.id]) return;
    var opt=t.getAttribute('data-opt');
    state.erPicked[ers.id]=opt;
    state.erRevealed[ers.id]=true;
    render();
  }
  else if(action==='er-next'){
    if(state.erIdx<ER_SCENARIOS.length-1){ state.erIdx++; render(); }
  }
  // Phone Script Picker
  else if(action==='psp-pick'){
    var psps=PSP_SCENARIOS[state.pspIdx];
    if(state.pspRevealed[psps.id]) return;
    var sid=t.getAttribute('data-script-id');
    state.pspPicked[psps.id]=sid;
    state.pspRevealed[psps.id]=true;
    render();
  }
  else if(action==='psp-next'){
    if(state.pspIdx<PSP_SCENARIOS.length-1){ state.pspIdx++; render(); }
  }
});

// ============================================================================
// INIT
// ============================================================================
document.getElementById('logo-slot').innerHTML=icon('megaphone',22,'#fff');
render();
