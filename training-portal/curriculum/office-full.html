<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Apps Full | Your Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#000;color:#e4e4e7;
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 80% 10%,rgba(24,90,189,0.10),transparent 40%),
    radial-gradient(circle at 20% 90%,rgba(16,124,65,0.07),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}

header.site{border-bottom:2px solid #27272a;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#185abd;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#52525b;}
.header-meta .big{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #27272a;text-align:center;}
footer.site p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#3f3f46;}

/* Hero */
.lab-hero{position:relative;border:2px solid #3f3f46;background:#18181b;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(24,90,189,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(24,90,189,.3) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#185abd;border-radius:50%;filter:blur(80px);opacity:.22;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#60a5fa;margin-bottom:8px;}
.lab-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#60a5fa;}
.lab-blurb{color:#a1a1aa;max-width:540px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #3f3f46;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#60a5fa;margin:0;}
.lab-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#52525b;margin:0;}

/* Category cards */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#18181b;border:2px solid #3f3f46;padding:0;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#10b981;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#a1a1aa;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#27272a;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#10b981;}

/* Category view */
.cat-back-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#71717a;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#18181b;border:2px solid #3f3f46;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#a1a1aa;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#18181b;
  border:2px solid #3f3f46;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#10b981;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;}
.lesson-num-tile.done   {background:#10b981;color:#000;}
.lesson-num-tile.current{background:#60a5fa;color:#000;}
.lesson-num-tile.pending{background:#27272a;color:#71717a;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

/* Reading card */
.lesson-card{border:2px solid #3f3f46;background:#18181b;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.8;margin:0;}
.lesson-card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#60a5fa;margin:0 0 8px;}
.lesson-section p{color:#a1a1aa;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(24,90,189,.08);border-left:4px solid #185abd;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#60a5fa;margin:0 0 6px;font-weight:700;}
.tip-body{color:#bfdbfe;font-size:13px;margin:0;line-height:1.55;font-style:italic;}
.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#185abd;color:#fff;border:2px solid #185abd;
  display:flex;align-items:center;justify-content:center;gap:10px;}

/* Interactive card */
.int-card{border:2px solid #3f3f46;background:#18181b;}
.int-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.int-card-body{padding:24px 22px;}

/* Letter Builder */
.lb-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.lb-field{display:flex;flex-direction:column;}
.lb-field.full{grid-column:1/-1;}
.lb-field label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#71717a;margin-bottom:5px;}
.lb-field input,.lb-field textarea,.lb-field select{
  background:#09090b;border:1px solid #3f3f46;color:#e4e4e7;
  padding:8px 10px;font-size:13px;outline:none;}
.lb-field input:focus,.lb-field textarea:focus,.lb-field select:focus{border-color:#185abd;}
.lb-preview-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa;margin:0 0 8px;}
.lb-letter{background:#f8f5f0;color:#1a1a1a;padding:36px 44px;
  font-family:'EB Garamond',Georgia,serif;font-size:14px;line-height:1.7;
  min-height:480px;border:1px solid #3f3f46;}
.lb-letter .lb-date{text-align:right;font-size:13px;margin-bottom:36px;}
.lb-letter .lb-recipient{margin-bottom:28px;}
.lb-letter .lb-recipient div{font-size:13px;}
.lb-letter .lb-salute{margin-bottom:18px;}
.lb-letter .lb-body{margin-bottom:22px;white-space:pre-wrap;}
.lb-letter .lb-close{margin-bottom:6px;}
.lb-letter .lb-sig{margin-top:42px;}
.lb-letter .lb-sig-line{border-bottom:1px solid #888;width:240px;margin-bottom:6px;}
.lb-letter .lb-blank{color:#a1a1aa;font-style:italic;}
.lb-feedback{margin-top:16px;padding:12px 14px;font-size:12px;line-height:1.55;}
.lb-feedback.ok   {background:rgba(16,185,129,.1);border:1px solid #10b981;color:#a7f3d0;}
.lb-feedback.warn {background:rgba(251,191,36,.08);border:1px solid #fbbf24;color:#fde68a;}
.lb-check-btn{padding:10px 20px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.2em;
  background:#185abd;color:#fff;border:2px solid #185abd;margin-top:14px;}

/* Excel Grid */
.xl-stage{background:#fff;border:1px solid #3f3f46;overflow:hidden;}
.xl-bar{background:#107c41;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#fff;}
.xl-bar-title{font-weight:600;}
.xl-tabs{background:#f4f4f4;padding:0;display:flex;border-bottom:1px solid #ddd;font-size:11px;}
.xl-tab{padding:6px 14px;color:#444;background:#f9f9f9;border-right:1px solid #ddd;}
.xl-tab.active{background:#fff;font-weight:600;color:#107c41;border-bottom:2px solid #107c41;}
.xl-grid{display:grid;grid-template-columns:30px repeat(6,1fr);background:#fff;color:#000;font-size:12px;}
.xl-cell{padding:6px 8px;border-right:1px solid #d4d4d8;border-bottom:1px solid #d4d4d8;min-height:28px;overflow:hidden;}
.xl-cell.header-cell{background:#f4f4f4;font-weight:600;color:#444;text-align:center;font-size:10px;}
.xl-cell.row-num{background:#f4f4f4;font-weight:600;color:#444;text-align:center;font-size:10px;}
.xl-cell.col-header{background:#107c41;color:#fff;font-weight:600;text-align:center;}
.xl-cell.filled{background:#fff;}
.xl-cell.empty{background:#fefefe;}
.xl-cell.target{background:#fff3cd;outline:2px solid #f59e0b;outline-offset:-2px;}
.xl-cell input{width:100%;border:none;outline:none;background:transparent;font-size:12px;padding:0;color:#000;font-family:inherit;}
.xl-prompt{background:rgba(16,124,65,.1);border:1px solid #10b981;padding:12px 14px;margin-top:16px;}
.xl-prompt-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#10b981;margin-bottom:6px;}
.xl-prompt-text{font-size:13px;color:#a7f3d0;}
.xl-formula-options{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;}
.xl-formula-opt{padding:10px 14px;background:#09090b;border:1px solid #3f3f46;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:left;color:#e4e4e7;}
.xl-formula-opt:hover{border-color:#10b981;}
.xl-formula-opt.correct{border-color:#10b981;background:rgba(16,185,129,.1);}
.xl-formula-opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08);}

/* Formula Match */
.fm-grid{display:flex;flex-direction:column;gap:12px;}
.fm-row{background:#0c0c0c;border:1px solid #3f3f46;padding:14px;}
.fm-scenario{font-size:13px;color:#e4e4e7;margin-bottom:8px;line-height:1.5;}
.fm-scenario-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa;margin-bottom:4px;}
.fm-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;}
.fm-opt{padding:8px 10px;background:#09090b;border:1px solid #3f3f46;
  font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center;color:#a1a1aa;}
.fm-opt:hover{border-color:#60a5fa;}
.fm-opt.picked{background:rgba(24,90,189,.15);border-color:#60a5fa;color:#bfdbfe;}
.fm-opt.correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}
.fm-opt.wrong  {background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.fm-why{font-size:11px;color:#71717a;margin-top:8px;font-style:italic;}
.fm-score{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.15em;
  color:#a1a1aa;margin-top:16px;padding-top:14px;border-top:1px solid #27272a;}

/* Spot the Mistake */
.spm-stage{background:#0c0c0c;border:1px solid #3f3f46;padding:18px;margin-bottom:14px;}
.spm-scenario-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#60a5fa;margin-bottom:8px;}
.spm-mock{background:#f8f5f0;color:#1a1a1a;padding:18px 22px;font-family:'EB Garamond',Georgia,serif;font-size:13px;line-height:1.7;}
.spm-mock.excel-mock{background:#fff;font-family:'IBM Plex Sans',sans-serif;padding:0;}
.spm-mock.ppt-mock{background:#1a1a2e;color:#fff;font-family:'IBM Plex Sans',sans-serif;padding:30px;text-align:center;}
.spm-options{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.spm-opt{padding:10px 14px;background:#09090b;border:1px solid #3f3f46;text-align:left;font-size:12px;color:#a1a1aa;line-height:1.45;}
.spm-opt:hover{border-color:#60a5fa;}
.spm-opt.correct{background:rgba(16,185,129,.12);border-color:#10b981;color:#a7f3d0;}
.spm-opt.wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.spm-feedback{margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.5;}
.spm-feedback.ok   {background:rgba(16,185,129,.08);border:1px solid #10b981;color:#a7f3d0;}
.spm-feedback.bad  {background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}
.spm-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.spm-progress{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#71717a;}
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <div class="logo-tile" id="logo-slot"></div>
    <div class="header-meta">
      <p class="small">Your Company &middot; Module 6</p>
      <p class="big">Office Apps Full</p>
    </div>
  </div>
</header>

<main class="container" style="padding:28px 20px 40px;">
  <div id="app"></div>
</main>

<footer class="site">
  <p>Built by Joseph &middot; Your Company Virtual Office &middot; Internal Use Only</p>
</footer>

<script>
"use strict";

// ============================================================================
// ICONS
// ============================================================================
const ICONS={
  'arrow-right':'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  'arrow-left': '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',

  'pencil':     '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',

};
function icon(name,size,color){
  size=size||16;color=color||'currentColor';
  var p=ICONS[name]||'';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">'+p+'</svg>';
}

// ============================================================================
// DATA
// ============================================================================
const CATEGORIES=[
  { id:'word', iconKey:'file-text', color:'#185abd',
    title:'Word: Business Documents',
    blurb:'Letters, memos, signed documents. The Your Company voice on paper.',
    lessons:[
      { id:'wd-1', title:'Document Fundamentals',     type:'reading',     minutes:3 },
      { id:'wd-2', title:'Anatomy of a Business Letter', type:'reading',  minutes:4 },
      { id:'wd-3', title:'Templates & Styles',        type:'reading',     minutes:3 },
      { id:'wd-4', title:'Build a Business Letter',   type:'interactive', minutes:7, intKey:'letterBuilder' }
    ] },
  { id:'excel', iconKey:'table-2', color:'#107c41',
    title:'Excel: Tracking & Logs',
    blurb:'The visitor log, the bid tracker, the timesheet. Where Your Company\'s daily numbers live.',
    lessons:[
      { id:'xl-1', title:'Cells, Rows, Columns',      type:'reading',     minutes:3 },
      { id:'xl-2', title:'Essential Formulas',        type:'reading',     minutes:4 },
      { id:'xl-3', title:'Build the Visitor Log',     type:'interactive', minutes:6, intKey:'visitorLog' },
      { id:'xl-4', title:'Match the Formula',         type:'interactive', minutes:5, intKey:'formulaMatch' }
    ] },
  { id:'ppt', iconKey:'presentation', color:'#c43e1c',
    title:'PowerPoint: When You Need It',
    blurb:'Rarely used here. When it is, do it right.',
    lessons:[
      { id:'pp-1', title:'Deck Basics for Your Company', type:'reading',     minutes:3 },
      { id:'pp-2', title:'One-Pager Design Rules',    type:'reading',     minutes:3 },
      { id:'pp-3', title:'Spot the Formatting Mistake', type:'interactive', minutes:6, intKey:'spotMistake' }
    ] }
];

const LESSON_CONTENT={
  'wd-1':{ sections:[
    { h:'A Word document is a container, not a page', b:'When you open Word, you are looking at a 1-page view of what is actually an unlimited canvas. Word will add pages as you type. You set page size, margins, and orientation once at the start — typically 8.5x11 portrait for letters, with 1-inch margins all around.' },
    { h:'Save formats matter', b:'Save as .docx for live documents you will edit again. Save as .pdf when you are sending the final version to a client, vendor, or government agency. PDF locks the formatting so it looks identical on every screen. Word documents can shift when opened on different machines.' },
    { h:'Use Save As, not Save, when finishing a document', b:'When you finish a draft and want to send it, use File → Save As, change the filename, and pick PDF. This preserves your editable .docx and creates a separate locked PDF for sending. Never email someone the .docx version of a final letter — they can edit it.' },
    { h:'Where Your Company documents live', b:'Every business letter, memo, or contract draft saves to OneDrive in the appropriate project folder. Naming convention: `ICD_Letter_Bid-Acceptance_2026-05-14.docx`. Type of doc, who it is for, what it is about, date. Never `Letter1.docx` or `Untitled.docx`.' }

// HELPERS
// ============================================================================
function esc(s){ if(s==null)return''; return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function getCat(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i]; return null; }
function getLesson(id){
  for(var i=0;i<CATEGORIES.length;i++){
    var c=CATEGORIES[i];
    for(var j=0;j<c.lessons.length;j++) if(c.lessons[j].id===id) return{lesson:c.lessons[j],cat:c,idx:j};
  }return null;
}
function totalLessons(){ return CATEGORIES.reduce(function(a,c){return a+c.lessons.length;},0); }
function completedCount(){ return Object.keys(state.completed).length; }

// ============================================================================
function renderHome(){
  var done=completedCount();
  var html='';
  html+='<div class="lab-hero"><div class="hero-grid"></div><div class="hero-glow"></div>';
  html+='<div class="lab-hero-inner">';
  html+='<p class="lab-eyebrow">Your Company &middot; Module 6</p>';
  html+='<h1 class="lab-h1">Office Apps <span class="accent">Full</span></h1>';
  html+='<p class="lab-blurb">Word for letters, Excel for tracking, PowerPoint for the rare client deck. Hands-on with the documents you will actually build at the front desk. Three categories, eleven lessons, four interactives where you build it yourself.</p>';
  html+='<div class="lab-stats">';
  [['3','Categories'],[String(totalLessons()),'Lessons'],['4','Interactives'],[String(done),'Done']].forEach(function(s){
    html+='<div class="lab-stat"><p class="lab-stat-num">'+s[0]+'</p><p class="lab-stat-lbl">'+s[1]+'</p></div>';
  });
  html+='</div></div></div>';

  html+='<div class="cat-grid">';
  CATEGORIES.forEach(function(cat){
    var doneN=cat.lessons.filter(function(l){return state.completed[l.id];}).length;
    var tot=cat.lessons.length;
    var allDone=doneN===tot;
    var pct=tot?(doneN/tot)*100:0;
    html+='<button class="cat-card'+(allDone?' is-done':'')+'" data-action="open-cat" data-cat-id="'+cat.id+'">';
    html+='<div class="cat-stripe" style="background:'+cat.color+';"></div>';
    html+='<div class="cat-inner">';
    html+='<div class="cat-top"><div class="cat-icon-tile" style="background:'+cat.color+';">'+icon(cat.iconKey,22,'#fff')+'</div>';
    if(allDone) html+=icon('check',18,'#10b981');
    html+='</div>';
    html+='<h3>'+esc(cat.title)+'</h3>';
    html+='<p class="cat-card-blurb">'+esc(cat.blurb)+'</p>';
    html+='<div class="cat-card-foot"><span>'+doneN+'/'+tot+' lessons</span>';
    html+='<div class="cat-progress-track"><div class="cat-progress-fill" style="width:'+pct+'%;"></div></div>';
    html+='</div></div></button>';
  });
  html+='</div>';
  return html;
}

function renderCategory(cat){
  var html='';
  html+='<button class="cat-back-btn" data-action="back-home">'+icon('arrow-left',13)+' Back to module home</button>';
  html+='<div class="cat-header"><div class="cat-header-inner">';
  html+='<div class="cat-header-icon" style="background:'+cat.color+';">'+icon(cat.iconKey,28,'#fff')+'</div>';
  html+='<div><p class="cat-header-eyebrow" style="color:'+cat.color+';">Category</p>';
  html+='<h2 class="cat-header-title">'+esc(cat.title)+'</h2>';
  html+='<p class="cat-header-blurb">'+esc(cat.blurb)+'</p>';
  html+='</div></div></div>';
  html+='<div class="lesson-list">';
  cat.lessons.forEach(function(l,i){
    var isDone=!!state.completed[l.id];
    var prevDone=i===0||!!state.completed[cat.lessons[i-1].id];
    var locked=!isDone&&!prevDone;
    var current=!isDone&&prevDone;
    var tileCls=isDone?'done':current?'current':'pending';
    var typeLabel=l.type==='reading'?'Reading':'Interactive';
    var typeColor=l.type==='reading'?'#71717a':'#60a5fa';
    html+='<button class="lesson-row'+(isDone?' is-done':'')+(locked?' is-locked':'')+'"';
    html+=locked?' disabled':' data-action="open-lesson" data-lesson-id="'+l.id+'"';
    html+='>';
    html+='<div class="lesson-num-tile '+tileCls+'">'+(locked?icon('lock',14):isDone?icon('check',18):String(i+1))+'</div>';
    html+='<div class="lesson-row-meta"><p class="lesson-row-title">'+esc(l.title)+'</p>';
    html+='<p class="lesson-row-tag" style="color:'+typeColor+';">'+typeLabel+' &middot; ~'+l.minutes+' min</p></div>';
    if(!locked) html+=icon('arrow-right',16,'#71717a');
    html+='</button>';
  });
  html+='</div>';
  return html;
}

  html+='<div class="lb-body">'+blank(state.lbBody,'[Letter body — three paragraphs maximum: purpose, details, next step]')+'</div>';

  html+='<div class="lb-sig"><div class="lb-sig-line"></div>'+blank(state.lbSigName,'[Signature Name]')+'<br>'+esc(state.lbSigTitle)+'<br>Your Company LLC</div>';

function checkLetterBuilder(){
  var issues=[];
  if(!state.lbDate.trim()) issues.push('Date is empty. Use the long form: May 14, 2026.');
  else if(/^\d+\/\d+\/\d+$/.test(state.lbDate.trim())) issues.push('Date format: business letters use the full month name. Write "May 14, 2026" instead of "5/14/26".');
  if(!state.lbRecipName.trim()) issues.push('Recipient name is empty. Fill in who the letter is going to.');
  if(!state.lbRecipCompany.trim()) issues.push('Recipient company is empty.');
  if(!state.lbRecipAddress.trim()) issues.push('Recipient address is empty. A business letter needs the full mailing address.');
  if(!state.lbLastName.trim()) issues.push('Last name for the salutation is empty.');
  if(!state.lbBody.trim()) issues.push('Body is empty. Write at least one paragraph stating the purpose of the letter.');
  else if(state.lbBody.trim().length<50) issues.push('Body is too short. A business letter typically needs purpose + context + next step.');
  if(!state.lbSigName.trim()) issues.push('Signature name is empty.');

  if(issues.length>0){
    state.lbFeedback={type:'warn',msg:issues[0]};
  } else {
    state.lbFeedback={type:'ok',msg:'Letter is well-formed. Date is properly formatted, recipient block is complete, salutation is correct, body has substance, and the signature block follows Your Company convention.'};
  }
  state.lbChecked=true;
  render();
}

function renderFormulaMatch(lesson,cat){

  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:20px;">Pick the right formula for each Your Company scenario. Six common situations you will hit at the front desk.</p>';

  html+='<div class="fm-grid">';
  FM_SCENARIOS.forEach(function(s){
    var picked=state.fmPicked[s.id];
    var revealed=state.fmRevealed[s.id];
    html+='<div class="fm-row">';
    html+='<p class="fm-scenario-tag">'+esc(s.tag)+'</p>';
    html+='<p class="fm-scenario">'+esc(s.scenario)+'</p>';
    html+='<div class="fm-options">';
    s.options.forEach(function(opt){
      var cls='fm-opt';
      if(revealed){
        if(opt===s.correct) cls+=' correct';
        else if(opt===picked) cls+=' wrong';
      } else if(opt===picked){
        cls+=' picked';
      }
      html+='<button class="'+cls+'" data-action="fm-pick" data-scen-id="'+s.id+'" data-opt="'+esc(opt)+'">'+esc(opt)+'</button>';
    });
    html+='</div>';
    if(revealed){
      html+='<p class="fm-why">'+esc(s.why)+'</p>';
    }
    html+='</div>';
  });
  html+='</div>';

  if(allDone){
    html+='<div class="fm-score">'+icon('check',13,'#60a5fa')+' Score: '+correctCount+'/'+FM_SCENARIOS.length+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';

    var pickedCount=Object.keys(state.fmPicked).length;
    html+='<div class="fm-score">'+pickedCount+'/'+FM_SCENARIOS.length+' answered &middot; pick all to see results</div>';
  }
  html+='</div></div>';
  return html;
}

function renderSpotMistake(lesson,cat){
  var idx=state.spmIdx;
  var s=SPM_SCENARIOS[idx];
  var picked=state.spmPicked[s.id];
  var revealed=state.spmRevealed[s.id];
  var total=SPM_SCENARIOS.length;
  var allDone=SPM_SCENARIOS.every(function(sc){return state.spmRevealed[sc.id];});
  var correctCount=SPM_SCENARIOS.filter(function(sc){return state.spmPicked[sc.id]===sc.correctIdx;}).length;

  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';

  html+='<div class="int-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';

  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body">';
  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">Each scenario has one clear formatting or convention mistake. Spot it. Six total, mix of Word, Excel, PowerPoint.</p>';

  html+='<div class="spm-stage">';
  html+='<p class="spm-scenario-tag">'+esc(s.tag)+' &middot; '+esc(s.mockTitle)+'</p>';
  var mockCls='spm-mock '+(s.type==='excel'?'excel-mock':s.type==='ppt'?'ppt-mock':'');
  html+='<div class="'+mockCls+'">'+s.mockHtml+'</div>';
  html+='<div class="spm-options">';
  s.options.forEach(function(opt,i){
    var cls='spm-opt';
    if(revealed){
      if(i===s.correctIdx) cls+=' correct';
      else if(i===picked) cls+=' wrong';
    }
    html+='<button class="'+cls+'" data-action="spm-pick" data-opt-idx="'+i+'">'+esc(opt)+'</button>';
  });
  html+='</div>';
  if(revealed){
    var ok=picked===s.correctIdx;
    html+='<div class="spm-feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Not quite. ')+esc(s.why)+'</div>';
  }
  html+='<div class="spm-nav">';
  html+='<span class="spm-progress">Scenario '+(idx+1)+' of '+total+'</span>';
  if(revealed&&idx<total-1){
    html+='<button class="lb-check-btn" style="margin-top:0;" data-action="spm-next">Next '+icon('arrow-right',14,'#fff')+'</button>';
  }
  html+='</div>';
  html+='</div>';

  if(allDone){
    html+='<div class="fm-score">'+icon('check',13,'#60a5fa')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';
  return html;
}

// ============================================================================
// LESSON DISPATCHER
// ============================================================================
function renderLesson(lesson,cat){
  if(lesson.type==='reading') return renderReading(lesson,cat);
  if(lesson.intKey==='letterBuilder') return renderLetterBuilder(lesson,cat);
  if(lesson.intKey==='visitorLog')    return renderVisitorLog(lesson,cat);
  if(lesson.intKey==='formulaMatch')  return renderFormulaMatch(lesson,cat);
  if(lesson.intKey==='spotMistake')   return renderSpotMistake(lesson,cat);
  return renderReading(lesson,cat);
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render(){
  var app=document.getElementById('app');
  var html='';
  if(state.view==='home'){
    html=renderHome();
  } else if(state.view.indexOf('category:')===0){
    var cat=getCat(state.view.slice(9));
    html=cat?renderCategory(cat):renderHome();
  } else if(state.view.indexOf('lesson:')===0){
    var info=getLesson(state.view.slice(7));
    html=info?renderLesson(info.lesson,info.cat):renderHome();
  }
  app.innerHTML=html;

  // Wire live inputs
  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey==='letterBuilder'){
      setTimeout(function(){
        var hooks=[
          ['lb-date','lbDate'],['lb-salute','lbSalute'],
          ['lb-rname','lbRecipName'],['lb-lname','lbLastName'],
          ['lb-rtitle','lbRecipTitle'],['lb-rco','lbRecipCompany'],
          ['lb-raddr','lbRecipAddress'],['lb-body','lbBody'],
          ['lb-closing','lbClosing'],['lb-sig','lbSigName']
        ];
        hooks.forEach(function(h){
          var el=document.getElementById(h[0]);
          if(!el) return;
          var ev=el.tagName==='SELECT'?'change':'input';
          el.addEventListener(ev,function(e){
            state[h[1]]=e.target.value;
            state.lbChecked=false; state.lbFeedback=null;
            clearTimeout(window._lbTimer);
            window._lbTimer=setTimeout(function(){ render(); },350);
          });
        });
      },50);
    }
    if(info2&&info2.lesson.intKey==='visitorLog'){
      setTimeout(function(){
        document.querySelectorAll('[data-vl-field]').forEach(function(inp){
          inp.addEventListener('input',function(e){
            var f=e.target.getAttribute('data-vl-field');
            state.vlEntries[0][f]=e.target.value;
          });
        });
      },50);
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');

  if(action==='open-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='back-home'){ state.view='home'; render(); }
  else if(action==='back-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='open-lesson'){
    var lid=t.getAttribute('data-lesson-id');
    var info=getLesson(lid);
    if(info){
      if(info.lesson.intKey==='letterBuilder'){
        state.lbDate='May 14, 2026'; state.lbRecipName=''; state.lbRecipTitle=''; state.lbRecipCompany=''; state.lbRecipAddress='';
        state.lbSalute='Mr.'; state.lbLastName=''; state.lbBody=''; state.lbClosing='Sincerely';
        state.lbSigName='The Owner'; state.lbSigTitle='CEO';
        state.lbChecked=false; state.lbFeedback=null;
      }
      if(info.lesson.intKey==='visitorLog'){
        state.vlEntries=[{date:'',timeIn:'',name:'',company:'',reason:'',timeOut:''}];
        state.vlStage='fill'; state.vlFormulaPicked=null;
      }
      if(info.lesson.intKey==='formulaMatch'){
        state.fmPicked={}; state.fmRevealed={};
      }
      if(info.lesson.intKey==='spotMistake'){
        state.spmIdx=0; state.spmPicked={}; state.spmRevealed={};
      }
    }
    state.view='lesson:'+lid; render();
  }
  else if(action==='complete-lesson'){
    var lid2=t.getAttribute('data-lesson-id');
    state.completed[lid2]=true;
    var info2=getLesson(lid2);
    if(info2){
      var next=null;
      for(var i=0;i<info2.cat.lessons.length;i++){
        if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){ next=info2.cat.lessons[i+1]; break; }
      }
      state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;
      render();
    }
  }
  // Letter Builder
  else if(action==='lb-check'){ checkLetterBuilder(); }
  // Visitor Log
  else if(action==='vl-confirm'){ state.vlStage='formula'; render(); }
  else if(action==='vl-formula'){
    state.vlFormulaPicked=parseInt(t.getAttribute('data-idx'),10);
    render();
  }
  else if(action==='vl-done'){ state.vlStage='done'; render(); }
  // Formula Match
  else if(action==='fm-pick'){
    var sid=t.getAttribute('data-scen-id');
    var opt=t.getAttribute('data-opt');
    if(state.fmRevealed[sid]) return; // locked once revealed
    state.fmPicked[sid]=opt;
    state.fmRevealed[sid]=true;
    render();
  }
  // Spot Mistake
  else if(action==='spm-pick'){
    var sc=SPM_SCENARIOS[state.spmIdx];
    if(state.spmRevealed[sc.id]) return;
    var idx=parseInt(t.getAttribute('data-opt-idx'),10);
    state.spmPicked[sc.id]=idx;
    state.spmRevealed[sc.id]=true;
    render();
  }
  else if(action==='spm-next'){
    if(state.spmIdx<SPM_SCENARIOS.length-1){ state.spmIdx++; render(); }
  }
});

document.getElementById('logo-slot').innerHTML=icon('file-text',22,'#fff');
