<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Productivity Lab | Your Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#000;color:#e4e4e7;
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% 5%,rgba(168,85,247,0.1),transparent 40%),
    radial-gradient(circle at 15% 95%,rgba(139,92,246,0.07),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;}
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;}

/* Header */
header.site{border-bottom:2px solid #27272a;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#a855f7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#52525b;}
.header-meta .big{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #27272a;text-align:center;}
footer.site p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#3f3f46;}

/* Lab Home Hero */
.lab-hero{position:relative;border:2px solid #3f3f46;background:#18181b;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(rgba(168,85,247,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.25) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#a855f7;border-radius:50%;filter:blur(80px);opacity:.25;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#e879f9;margin-bottom:8px;}
.lab-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#e879f9;}
.lab-blurb{color:#a1a1aa;max-width:540px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #3f3f46;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#e879f9;margin:0;}
.lab-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#52525b;margin:0;}

/* Privacy rule banner */
.privacy-banner{
  background:rgba(168,85,247,.08);border:1px solid #7e22ce;
  padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;
}
.privacy-banner-icon{flex-shrink:0;margin-top:2px;}
.privacy-banner-text{font-size:12px;color:#c4b5fd;line-height:1.55;}
.privacy-banner-text strong{color:#e879f9;}

/* Category cards */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#18181b;border:2px solid #3f3f46;padding:0;position:relative;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#10b981;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#a1a1aa;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#27272a;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#10b981;transition:width .3s;}

/* Category view */
.cat-back-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#71717a;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#18181b;border:2px solid #3f3f46;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#a1a1aa;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#18181b;
  border:2px solid #3f3f46;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#10b981;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;}
.lesson-num-tile.is-done   {background:#10b981;color:#000;}
.lesson-num-tile.is-current{background:#e879f9;color:#000;}
.lesson-num-tile.is-pending{background:#27272a;color:#71717a;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

/* Lesson reading card */
.lesson-card{border:2px solid #3f3f46;background:#18181b;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.8;margin:0;}
.lesson-card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#e879f9;margin:0 0 8px;letter-spacing:.04em;}
.lesson-section p{color:#a1a1aa;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(168,85,247,.08);border-left:4px solid #a855f7;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#c084fc;margin:0 0 6px;font-weight:700;}
.tip-body{color:#e9d5ff;font-size:13px;margin:0;line-height:1.55;font-style:italic;}
.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#e879f9;color:#000;border:2px solid #e879f9;
  display:flex;align-items:center;justify-content:center;gap:10px;}

/* Interactive card wrapper */
.int-card{border:2px solid #3f3f46;background:#18181b;}
.int-card-header{padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.int-card-body{padding:24px 22px;}

/* Sort the Tasks */
.sort-container{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
@media(max-width:600px){.sort-container{grid-template-columns:1fr;}}
.sort-col{background:#0c0c0c;border:2px dashed #3f3f46;padding:12px;min-height:160px;}
.sort-col.ai-col{border-color:#a855f7;}
.sort-col.human-col{border-color:#0ea5e9;}
.sort-col-head{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;text-align:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #27272a;}
.sort-col.ai-col .sort-col-head{color:#c084fc;}
.sort-col.human-col .sort-col-head{color:#38bdf8;}
.sort-tasks{display:flex;flex-direction:column;gap:4px;margin-bottom:20px;}
.sort-task-row{padding:10px 12px;background:#18181b;border:1px solid #3f3f46;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sort-task-text{flex:1;min-width:0;font-size:13px;color:#e4e4e7;}
.sort-btns{display:flex;gap:6px;flex-shrink:0;}
.sort-btn{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  padding:5px 10px;border:1px solid;cursor:pointer;}
.sort-btn.ai   {border-color:#7e22ce;background:transparent;color:#c084fc;}
.sort-btn.human{border-color:#0c4a6e;background:transparent;color:#38bdf8;}
.sort-btn.ai.active   {background:#7e22ce;color:#fff;}
.sort-btn.human.active{background:#0c4a6e;color:#fff;}
.sort-task-row.correct-yes .sort-task-text{color:#a7f3d0;}
.sort-task-row.correct-no  .sort-task-text{color:#fca5a5;}
.sort-why{font-size:11px;font-style:italic;color:#a1a1aa;margin-top:4px;width:100%;}
.sort-submit-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.sort-score{font-family:'JetBrains Mono',monospace;font-size:10px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.15em;}

/* Tool Selector */
.tool-grid{display:flex;flex-direction:column;gap:8px;}
.tool-row{background:#0c0c0c;border:1px solid #3f3f46;padding:12px 14px;}
.tool-row-text{font-size:13px;color:#e4e4e7;margin-bottom:10px;}
.tool-options{display:flex;gap:6px;flex-wrap:wrap;}
.tool-btn{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  padding:6px 12px;border:1px solid #3f3f46;cursor:pointer;color:#a1a1aa;}
.tool-btn.picked-Copilot{border-color:#0078d4;background:rgba(0,120,212,.15);color:#7dd3fc;}
.tool-btn.picked-Gemini {border-color:#1a73e8;background:rgba(26,115,232,.15);color:#93c5fd;}
.tool-btn.picked-Claude {border-color:#a855f7;background:rgba(168,85,247,.15);color:#e9d5ff;}
.tool-btn.picked-Any    {border-color:#10b981;background:rgba(16,185,129,.15);color:#a7f3d0;}
.tool-why{font-size:11px;color:#a1a1aa;font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid #27272a;display:none;}
.tool-why.visible{display:block;}
.tool-why-correct{color:#a7f3d0;}
.tool-why-text{color:#a1a1aa;}

/* Bad/Good Prompts */
.bg-pairs{display:flex;flex-direction:column;gap:20px;}
.bg-pair{background:#0c0c0c;border:1px solid #3f3f46;padding:14px;}
.bg-pair-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#9333ea;margin-bottom:10px;}
.bg-side-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.bg-side-row{grid-template-columns:1fr;}}
.bg-side{padding:10px;}
.bg-side-bad {background:rgba(239,68,68,.06);border:1px solid #7f1d1d;}
.bg-side-good{background:rgba(16,185,129,.06);border:1px solid #14532d;}
.bg-side-head{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin-bottom:8px;}
.bg-side-bad  .bg-side-head{color:#f87171;}
.bg-side-good .bg-side-head{color:#4ade80;}
.bg-prompt{font-size:12px;color:#d4d4d8;background:#09090b;padding:8px;border-radius:4px;font-style:italic;line-height:1.55;margin-bottom:8px;}
.bg-output-toggle{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;
  padding:6px 10px;border:1px solid #3f3f46;color:#71717a;cursor:pointer;}
.bg-output{font-size:12px;color:#a1a1aa;background:#09090b;padding:8px;border-radius:4px;
  white-space:pre-wrap;line-height:1.55;margin-top:8px;display:none;}
.bg-output.visible{display:block;}
.bg-explain{font-size:12px;color:#c4b5fd;background:rgba(139,92,246,.06);
  border:1px solid #581c87;padding:10px;margin-top:10px;line-height:1.55;}

/* Prompt Builder */
.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.pb-grid{grid-template-columns:1fr;}}
.pb-form{display:flex;flex-direction:column;gap:12px;}
.pb-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.2em;color:#a855f7;margin-bottom:4px;}
.pb-field textarea,.pb-field select,.pb-field input{
  width:100%;background:#09090b;border:1px solid #3f3f46;color:#e4e4e7;
  padding:8px 10px;font-size:13px;resize:vertical;outline:none;
}
.pb-field textarea:focus,.pb-field select:focus,.pb-field input:focus{border-color:#a855f7;}
.pb-field select option{background:#09090b;}
.pb-assembled{position:relative;}
.pb-assembled-head{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.2em;color:#a855f7;margin-bottom:8px;}
.pb-assembled-box{background:#09090b;border:1px solid #3f3f46;padding:14px;
  font-size:13px;color:#e4e4e7;line-height:1.65;min-height:160px;white-space:pre-wrap;}
.pb-copy-btn{margin-top:10px;padding:8px 16px;
  font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  border:1px solid #a855f7;background:transparent;color:#c084fc;cursor:pointer;
  display:flex;align-items:center;gap:6px;}
.pb-copy-btn.copied{border-color:#10b981;color:#34d399;}
.pb-empty-hint{color:#52525b;font-size:12px;font-style:italic;}

/* Recipes */
.recipes-grid{display:flex;flex-direction:column;gap:10px;}
.recipe-card{background:#0c0c0c;border:1px solid #3f3f46;padding:12px 14px;}
.recipe-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.recipe-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#e4e4e7;letter-spacing:.04em;}
.recipe-when{font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px;}
.recipe-prompt{font-size:12px;color:#a1a1aa;background:#09090b;padding:10px;
  font-style:italic;line-height:1.6;border-left:3px solid #7e22ce;margin-bottom:8px;}
.recipe-copy-btn{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;
  padding:5px 10px;border:1px solid #7e22ce;background:transparent;color:#c084fc;cursor:pointer;
  display:flex;align-items:center;gap:5px;flex-shrink:0;}
.recipe-copy-btn.copied{border-color:#10b981;color:#34d399;}

/* Spot the Mistake */
.sm-grid{display:flex;flex-direction:column;gap:12px;}
.sm-card{background:#0c0c0c;border:1px solid #3f3f46;padding:14px;}
.sm-num{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#9333ea;margin-bottom:6px;}
.sm-text{font-size:13px;color:#d4d4d8;line-height:1.6;margin-bottom:12px;}
.sm-options{display:flex;gap:8px;flex-wrap:wrap;}
.sm-opt-btn{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  padding:7px 14px;border:1px solid #3f3f46;cursor:pointer;color:#a1a1aa;}
.sm-opt-btn.picked-neutral{border-color:#a855f7;background:rgba(168,85,247,.1);color:#e9d5ff;}
.sm-opt-btn.picked-correct{border-color:#10b981;background:rgba(16,185,129,.1);color:#a7f3d0;}
.sm-opt-btn.picked-wrong  {border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5;}
.sm-verdict{font-size:12px;font-style:italic;margin-top:10px;padding:10px;line-height:1.55;}
.sm-verdict.correct{background:rgba(16,185,129,.06);border:1px solid #14532d;color:#a7f3d0;}
.sm-verdict.wrong  {background:rgba(239,68,68,.06);border:1px solid #7f1d1d;color:#fca5a5;}
.sm-score-row{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  color:#a1a1aa;margin-top:16px;padding-top:16px;border-top:1px solid #27272a;}
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <div class="logo-tile" id="logo-slot"></div>
    <div class="header-meta">
      <p class="small">Your Company &middot; AI Lab</p>
      <p class="big">AI Productivity Lab</p>
    </div>
  </div>
</header>

<main class="container" style="padding:28px 20px 40px;">
  <div id="app"></div>
</main>

<footer class="site">
  <p>Built by Joseph &middot; Your Company Virtual Office &middot; Internal Use Only</p>
</footer>

function escapeHtml(str){
  if(str==null)return'';
  return String(str).replace(/[&<>"']/g,function(c){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function passHtml(str){return str||'';}
function getCategory(id){for(var i=0;i<CATEGORIES.length;i++)if(CATEGORIES[i].id===id)return CATEGORIES[i];return null;}
function getLesson(id){
  for(var i=0;i<CATEGORIES.length;i++){
    var c=CATEGORIES[i];
    for(var j=0;j<c.lessons.length;j++)if(c.lessons[j].id===id)return{lesson:c.lessons[j],cat:c,idx:j};
  }return null;
}
function totalLessons(){return CATEGORIES.reduce(function(a,c){return a+c.lessons.length;},0);}
function completedCount(){return Object.keys(state.completed).length;}
function buildPrompt(){
  var lines=[];
  if(state.pbContext.trim()) lines.push('CONTEXT: '+state.pbContext.trim());

  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">Read each scenario. Decide if the assistant did the right thing or made a mistake. Tap to lock in your answer.</p>';
  html+='<div class="sm-grid">';
  for(var i=0;i<SM_SCENARIOS.length;i++){
    var sc=SM_SCENARIOS[i];
    var picked=state.smPicked[sc.id];
    var isCorrect=picked===sc.correct;
    html+='<div class="sm-card">';
    html+='<div class="sm-num">Scenario '+(i+1)+'</div>';
    html+='<div class="sm-text">'+escapeHtml(sc.text)+'</div>';
    html+='<div class="sm-options">';
    for(var j=0;j<sc.options.length;j++){
      var opt=sc.options[j];
      var btnCls='sm-opt-btn';
      if(picked===opt){
        btnCls+=picked===sc.correct?' picked-correct':' picked-wrong';
      }
      html+='<button class="'+btnCls+'" data-action="sm-pick" data-scenario-id="'+sc.id+'" data-choice="'+escapeHtml(opt)+'">'+escapeHtml(opt)+'</button>';
    }
    html+='</div>';
    if(picked){
      var verdictCls='sm-verdict '+(isCorrect?'correct':'wrong');
      html+='<div class="'+verdictCls+'">'+(isCorrect?'Correct. ':sc.correct+'. ')+escapeHtml(sc.why)+'</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  if(allAnswered){
    var correct=0;
    for(var s=0;s<SM_SCENARIOS.length;s++) if(state.smPicked[SM_SCENARIOS[s].id]===SM_SCENARIOS[s].correct) correct++;
    html+='<div class="sm-score-row">'+icon('award',14,'#e879f9')+' Score: '+correct+'/'+SM_SCENARIOS.length+'</div>';
    html+='<button class="complete-btn" style="margin-top:16px;" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#000')+'</button>';
  }
  html+='</div></div>';
  return html;
}

// ============================================================================
// LESSON DISPATCHER
// ============================================================================
function renderLesson(lesson,cat){
  if(lesson.type==='reading') return renderReadingLesson(lesson,cat);
  if(lesson.intKey==='sortTasks')     return renderSortTasks(lesson,cat);
  if(lesson.intKey==='toolSelector')  return renderToolSelector(lesson,cat);
  if(lesson.intKey==='badGood')       return renderBadGood(lesson,cat);
  if(lesson.intKey==='promptBuilder') return renderPromptBuilder(lesson,cat);
  if(lesson.intKey==='recipes')       return renderRecipes(lesson,cat);
  if(lesson.intKey==='spotMistake')   return renderSpotMistake(lesson,cat);
  return renderReadingLesson(lesson,cat);
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render(){
  var app=document.getElementById('app');
  var html='';
  if(state.view==='home'){
    html=renderLabHome();
  } else if(state.view.indexOf('category:')===0){
    var cat=getCategory(state.view.slice(9));
    html=cat?renderCategory(cat):renderLabHome();
  } else if(state.view.indexOf('lesson:')===0){
    var info=getLesson(state.view.slice(7));
    html=info?renderLesson(info.lesson,info.cat):renderLabHome();
  }
  app.innerHTML=html;

  // Wire up live Prompt Builder inputs after DOM inject
  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey==='promptBuilder'){
      setTimeout(function(){
        var ctx=document.getElementById('pb-context');
        var goal=document.getElementById('pb-goal');
        var tone=document.getElementById('pb-tone');
        var len=document.getElementById('pb-length');
        var musts=document.getElementById('pb-musts');
        function refresh(){ render(); }
        if(ctx) ctx.addEventListener('input',function(e){state.pbContext=e.target.value;render();});
        if(goal) goal.addEventListener('input',function(e){state.pbGoal=e.target.value;render();});
        if(tone) tone.addEventListener('change',function(e){state.pbTone=e.target.value;render();});
        if(len) len.addEventListener('change',function(e){state.pbLength=e.target.value;render();});
        if(musts) musts.addEventListener('input',function(e){state.pbMusts=e.target.value;render();});
      },50);
    }
  }

  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');

  // Navigation
  if(action==='open-cat'){
    state.view='category:'+t.getAttribute('data-cat-id');
    render();
  } else if(action==='back-home'){
    state.view='home'; render();
  } else if(action==='open-lesson'){
    var lid=t.getAttribute('data-lesson-id');
    var info=getLesson(lid);
    // Reset interactive state when entering fresh
    if(info&&info.lesson.intKey==='sortTasks'){state.sortPlacement={};state.sortSubmitted=false;}
    if(info&&info.lesson.intKey==='toolSelector') state.toolPicked={};
    if(info&&info.lesson.intKey==='badGood'){state.bgRevealedBad={};state.bgRevealedGood={};}
    if(info&&info.lesson.intKey==='promptBuilder'){state.pbCopied=false;}
    if(info&&info.lesson.intKey==='recipes') state.recipeCopied={};
    if(info&&info.lesson.intKey==='spotMistake') state.smPicked={};
    state.view='lesson:'+lid; render();
  } else if(action==='back-cat'){
    state.view='category:'+t.getAttribute('data-cat-id'); render();
  } else if(action==='complete-lesson'){
    var lid2=t.getAttribute('data-lesson-id');
    state.completed[lid2]=true;
    var info2=getLesson(lid2);
    if(info2){
      var next=null;
      for(var i=0;i<info2.cat.lessons.length;i++){
        if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){
          next=info2.cat.lessons[i+1]; break;
        }
      }
      if(next){ state.view='lesson:'+next.id; }
      else { state.view='category:'+info2.cat.id; }
      render();
    }
  }

  // Sort the Tasks
  else if(action==='sort-pick'){
    if(state.sortSubmitted) return;
    var tid=parseInt(t.getAttribute('data-task-id'),10);
    var choice=t.getAttribute('data-choice');
    state.sortPlacement[tid]=choice;
    render();
  } else if(action==='sort-submit'){
    state.sortSubmitted=true; render();
  } else if(action==='sort-reset'){
    state.sortPlacement={}; state.sortSubmitted=false; render();
  }

  // Tool Selector
  else if(action==='tool-pick'){
    var ttid=t.getAttribute('data-task-id');
    var tchoice=t.getAttribute('data-choice');
    state.toolPicked[ttid]=tchoice; render();
  }

  // Bad/Good Prompts
  else if(action==='bg-reveal-bad'){
    var pid=t.getAttribute('data-pair-id');
    state.bgRevealedBad[pid]=!state.bgRevealedBad[pid]; render();
  } else if(action==='bg-reveal-good'){
    var pid2=t.getAttribute('data-pair-id');
    state.bgRevealedGood[pid2]=!state.bgRevealedGood[pid2]; render();
  }

  // Prompt Builder copy
  else if(action==='pb-copy'){
    var prompt=buildPrompt();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(function(){
        state.pbCopied=true; render();
        setTimeout(function(){state.pbCopied=false;render();},2500);
      });
    } else {
      // Fallback
      var ta=document.createElement('textarea');
      ta.value=prompt; ta.style.position='fixed'; ta.style.top='-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      state.pbCopied=true; render();
      setTimeout(function(){state.pbCopied=false;render();},2500);
    }
  }

  // Recipes copy
  else if(action==='recipe-copy'){
    var rid=t.getAttribute('data-recipe-id');
    var recipe=null;
    for(var r=0;r<RECIPES.length;r++) if(RECIPES[r].id===rid) recipe=RECIPES[r];
    if(!recipe) return;
    var rtext=recipe.prompt;
    function doRecipeCopied(){
      state.recipeCopied[rid]=true; render();
      setTimeout(function(){state.recipeCopied[rid]=false;render();},2500);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(rtext).then(doRecipeCopied);
    } else {
      var ta2=document.createElement('textarea');
      ta2.value=rtext; ta2.style.position='fixed'; ta2.style.top='-9999px';
      document.body.appendChild(ta2); ta2.select();
      document.execCommand('copy'); document.body.removeChild(ta2);
      doRecipeCopied();
    }
  }

  // Spot the Mistake
  else if(action==='sm-pick'){
    var sid=t.getAttribute('data-scenario-id');
    var schoice=t.getAttribute('data-choice');
    state.smPicked[sid]=schoice; render();
  }
});

// ============================================================================
// INIT
// ============================================================================
document.getElementById('logo-slot').innerHTML=icon('sparkles',22,'#fff');
render();
</script>
