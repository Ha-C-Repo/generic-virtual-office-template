<!doctype html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Diary | Your Company</title>
<!--
  Field crew daily diary. NEW page beside the training portal. Shares
  config.js and the Supabase session with the portal. Crew register on
  index.html with the office signup code, then land back here.
  Backend: Apps Script web app (Site Diary/sandbox/appsscript in the
  Cowork project). EXEC_URL and SECRET are set in diary.js at deploy.
  Palette: MCA public kit (white panels, ink, glass teal). The training
  portal palette is not used here.
-->
<style>
:root{--panel:#ffffff;--panel-2:#f5f5f3;--seam:#d8d8d4;--ink:#0d0d0f;
--ink-2:#54585c;--ink-3:#8b9094;--accent:#2e6e66;--bad:#b3261e;}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--panel-2);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.5;max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.sub{color:var(--ink-3);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px}
.who{font-size:.75rem;color:var(--ink-2);text-align:right}
.who button{width:auto;padding:4px 10px;margin:0 0 0 8px;background:none;color:var(--accent);border:1px solid var(--seam);font-size:.7rem;letter-spacing:.08em}
.card{background:var(--panel);border:1px solid var(--seam);padding:16px;margin-bottom:14px}
label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--seam);border-radius:0;font-size:1rem;background:var(--panel);color:var(--ink);font-family:inherit}
textarea{min-height:120px}
button{width:100%;padding:15px;margin-top:16px;background:var(--ink);color:#fff;border:none;border-radius:0;font-size:1rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;cursor:pointer}
button:disabled{background:var(--ink-3);cursor:not-allowed}
button.approve{background:var(--accent)}
button.rec{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
button.rec.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.rechint{font-size:.8rem;color:var(--ink-3);margin-top:8px}
a.swap{display:inline-block;font-size:.8rem;margin-top:10px}
#uploadwrap{margin-top:4px}
.msg{margin-top:12px;font-size:.85rem;min-height:1.2em}
.msg.ok{color:var(--accent)}
.msg.bad{color:var(--bad)}
#approvebox{display:none}
#pendingtext{font-size:.92rem;margin:6px 0;white-space:pre-line}
#authgate{text-align:center;padding:40px 16px}
#authgate .note{font-size:.85rem;color:var(--ink-2);margin-top:14px}
a{color:var(--accent)}
.foot{margin:22px 0 8px;text-align:center;font-size:.7rem;color:var(--ink-3)}
</style>
</head>
<body>

<header>
  <div>
    <h1>Site Diary</h1>
    <div class="sub">Your Company - Field Reports</div>
  </div>
  <div class="who" id="who" hidden>
    <span id="useremail"></span><button id="signoutbtn" type="button">Sign out</button>
  </div>
</header>

<div id="authgate" class="card">
  <span id="gatestatus">Checking sign in...</span>
  <div class="note" id="gatenote" hidden>
    Sign in or register with the office signup code, same account as the
    training portal.<br><br>
    <a href="index.html?next=diary.html">Go to sign in</a>
  </div>
</div>

<div id="app" hidden>

  <div class="card" id="approvebox">
    <label>Yesterday's diary, pending your approval</label>
    <div id="pendingtext"></div>
    <button class="approve" id="approvebtn" type="button">Approve diary entry</button>
    <div class="msg" id="approvemsg"></div>
  </div>

  <div class="card">
    <label for="project">Project</label>
    <select id="project"></select>

    <label for="date">Date</label>
    <input type="date" id="date">

    <label for="weather">Weather</label>
    <select id="weather">
      <option>Clear</option><option>Cloudy</option><option>Rain</option>
      <option>Storm</option><option>Heat advisory</option><option>Wind hold</option>
    </select>

    <label for="body">Today's update (crew, work done, deliveries, delays, issues)</label>
    <textarea id="body" placeholder="Example: 6 guys. Set 8 of 12 columns line A. Steel load 2 of 3 came at 1pm. Lost 2 hrs to rain."></textarea>

    <label for="photos">Photos</label>
    <input type="file" id="photos" accept="image/*" multiple>

    <label>Voice note</label>
    <button type="button" class="rec" id="recbtn" hidden>Record voice note</button>
    <div class="rechint" id="rechint" hidden></div>
    <a href="#" class="swap" id="showupload" hidden>Upload a saved audio file instead</a>

    <div id="uploadwrap">
      <label for="voice">Upload a saved audio file</label>
      <input type="file" id="voice" accept="audio/*">
    </div>

    <button id="submitbtn" type="button">Submit diary entry</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<p class="foot">Your Company &middot; Internal Use Only</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="diary.js"></script>
</body>
</html>
