<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Front Desk Training | Your Company</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #000; color: #e4e4e7;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5; min-height: 100vh;
    background-image:
      radial-gradient(circle at 90% 10%, rgba(255,184,0,0.06), transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(77,208,225,0.04), transparent 40%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  p { margin: 0; }
  h1, h2, h3 { margin: 0; font-weight: normal; }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
  .mono  { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }

  /* Header */
  header.site {
    border-bottom: 2px solid #27272a;
    background: rgba(0,0,0,0.85);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .header-row { max-width: 960px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .logo-tile { width: 40px; height: 40px; background: #fbbf24; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-meta { flex: 1; min-width: 0; }
  .header-meta .small { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #52525b; }
  .header-meta .big { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-progress-wrap { width: 180px; flex-shrink: 0; }

  /* Weld-bead progress bar */
  .weld-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .weld-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: #71717a; }
  .weld-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: #fbbf24; font-weight: 700; }
  .weld-track { position: relative; height: 12px; background: #18181b; border: 1px solid #3f3f46; overflow: hidden; }
  .weld-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, #f59e0b, #fb923c, #fbbf24);
    box-shadow: inset 0 0 8px rgba(255,180,0,0.5);
    transition: width 0.6s ease;
  }

  /* Footer */
  footer.site { max-width: 960px; margin: 0 auto; padding: 28px 20px; border-top: 1px solid #27272a; text-align: center; }
  footer.site p { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #3f3f46; }

  /* Stamps (rotating tags) */
  .stamp {
    display: inline-block; background: #fbbf24; color: #000;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.15em;
    font-size: 11px; font-weight: 900; text-transform: uppercase;
    padding: 3px 10px; border: 2px solid #000;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.85);
  }

  /* Welcome hero */
  .welcome-hero {
    position: relative; border: 2px solid #3f3f46; background: #18181b;
    overflow: hidden; margin-bottom: 32px;
  }
  .welcome-grid {
    position: absolute; inset: 0; opacity: 0.18;
    background-image: linear-gradient(rgba(77,208,225,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(77,208,225,0.2) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .welcome-glow {
    position: absolute; top: -40px; right: -40px; width: 180px; height: 180px;
    background: #fbbf24; border-radius: 50%; filter: blur(60px); opacity: 0.15;
  }
  .welcome-inner { position: relative; padding: 28px 24px; }
  .welcome-stamps { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .welcome-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #fbbf24; margin-bottom: 10px; }
  .welcome-h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 10vw, 80px); color: #fff; line-height: 0.9; margin-bottom: 16px; }
  .welcome-h1 .accent { color: #fbbf24; }
  .welcome-blurb { color: #a1a1aa; max-width: 520px; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .welcome-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 380px; margin-bottom: 28px; }
  .welcome-stat { border: 1px solid #3f3f46; background: rgba(0,0,0,0.4); padding: 10px 12px; }
  .welcome-stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #fbbf24; margin: 0 0 2px; }
  .welcome-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: #52525b; }
  .start-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.2em;
    background: #fbbf24; color: #000; border: 2px solid #fbbf24;
    padding: 14px 28px; display: inline-flex; align-items: center; gap: 10px;
  }

  /* Team grid */
  .team-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .team-head h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #fff; margin: 0; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .team-card { border: 2px solid #3f3f46; background: #18181b; padding: 14px 16px; }
  .team-avatar { width: 38px; height: 38px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #000; font-weight: 900; font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing: 0.04em; }
  .team-name { color: #fff; font-weight: 700; font-size: 13px; margin: 0 0 2px; }
  .team-role { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: #fbbf24; margin: 0 0 6px; }
  .team-tag { font-size: 12px; color: #71717a; margin: 0; line-height: 1.5; }

  /* Dashboard */
  .dash-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .dash-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #fbbf24; margin-bottom: 4px; }
  .dash-h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff; margin: 0; }
  .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

  /* Module card */
  .mod-card {
    text-align: left; width: 100%;
    border: 2px solid #3f3f46; background: #18181b; padding: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .mod-card.is-locked { cursor: not-allowed; opacity: 0.45; border-color: #27272a; }
  .mod-card.is-done   { border-color: #10b981; }
  .mod-card.is-current { border-color: #fbbf24; box-shadow: 6px 6px 0 rgba(255,184,0,0.85); }
  .mod-card-inner { padding: 16px 18px; }
  .mod-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }
  .mod-card-icon-tile {
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mod-card-icon-tile.is-done    { background: #10b981; border: 2px solid #10b981; color: #000; }
  .mod-card-icon-tile.is-current { background: #fbbf24; border: 2px solid #fbbf24; color: #000; }
  .mod-card-icon-tile.is-pending { background: #27272a; border: 2px solid #3f3f46; color: #71717a; }
  .mod-card-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; color: #52525b; margin-top: 2px; }
  .mod-card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fff; margin: 0 0 4px; line-height: 1; }
  .mod-card-blurb { font-size: 12px; color: #71717a; line-height: 1.5; margin: 0 0 10px; }
  .mod-card-foot { display: flex; justify-content: space-between; align-items: center; }
  .mod-card-foot-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #3f3f46; }

  /* Module view (lesson reading) */
  .lesson-back-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #71717a; display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
  .lesson-card { border: 2px solid #3f3f46; background: #18181b; }
  .lesson-card-header {
    background: #fbbf24; color: #000; padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 2px solid #3f3f46;
  }
  .lesson-icon-tile { width: 52px; height: 52px; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lesson-card-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; opacity: 0.7; margin: 0; }
  .lesson-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin: 4px 0 0; line-height: 1; color: #000; }
  .lesson-card-body { padding: 24px 22px; }
  .lesson-section { margin-bottom: 24px; }
  .lesson-section.callout { border-left: 4px solid #ef4444; background: rgba(239,68,68,0.06); padding: 12px 16px; }
  .lesson-section h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fbbf24; margin: 0 0 8px; letter-spacing: 0.04em; display: flex; align-items: center; gap: 6px; }
  .lesson-section.callout h3 { color: #fca5a5; }
  .lesson-section p { color: #a1a1aa; line-height: 1.65; margin: 0; font-size: 14px; }

  .read-btn {
    width: 100%; background: #27272a; border: 2px solid #3f3f46; color: #d4d4d8;
    padding: 12px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.2em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* Quick check */
  .check-card { border: 2px solid #fbbf24; background: #09090b; padding: 20px; margin-top: 24px; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .check-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; color: #fbbf24; font-weight: 700; }
  .check-q { color: #fff; margin-bottom: 14px; font-weight: 600; font-size: 14px; }
  .check-options { display: flex; flex-direction: column; gap: 8px; }
  .check-option {
    text-align: left; padding: 10px 14px; border: 2px solid #3f3f46;
    background: #18181b; color: #d4d4d8; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%;
  }
  .check-option.ok-picked   { background: rgba(16,185,129,0.12); border-color: #10b981; color: #6ee7b7; }
  .check-option.bad-picked  { background: rgba(239,68,68,0.12); border-color: #ef4444; color: #fca5a5; }
  .check-fail-msg { font-size: 12px; color: #fca5a5; margin-top: 10px; font-style: italic; }

  /* Quiz view */
  .quiz-card { border: 2px solid #3f3f46; background: #18181b; }
  .quiz-card-header { background: #fbbf24; color: #000; padding: 16px 20px; border-bottom: 2px solid #3f3f46; }
  .quiz-card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; opacity: 0.7; margin: 0; }
  .quiz-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin: 4px 0 2px; line-height: 1; color: #000; }
  .quiz-card-body { padding: 24px 22px; }
  .quiz-q { margin-bottom: 24px; }
  .quiz-q-text { color: #fff; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
  .quiz-q-num { font-family: 'JetBrains Mono', monospace; color: #fbbf24; margin-right: 6px; }
  .quiz-opt-list { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    text-align: left; padding: 10px 14px; border: 2px solid #3f3f46;
    background: #09090b; color: #a1a1aa; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%;
  }
  .quiz-opt.is-picked  { background: rgba(251,191,36,0.1); border-color: #fbbf24; color: #fde68a; }
  .quiz-opt.is-correct { background: rgba(16,185,129,0.12); border-color: #10b981; color: #6ee7b7; }
  .quiz-opt.is-wrong   { background: rgba(239,68,68,0.12); border-color: #ef4444; color: #fca5a5; }
  .quiz-submit {
    width: 100%; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.2em;
    padding: 14px 0; background: #fbbf24; color: #000; border: 2px solid #fbbf24;
  }
  .quiz-submit:disabled { background: #27272a; color: #52525b; border-color: #3f3f46; cursor: not-allowed; }
  .quiz-result {
    border: 2px solid #10b981; padding: 20px; margin-top: 8px;
    background: rgba(16,185,129,0.08);
  }
  .quiz-result.fail { border-color: #ef4444; background: rgba(239,68,68,0.08); }
  .quiz-result-h { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: #6ee7b7; margin: 0 0 8px; }
  .quiz-result.fail .quiz-result-h { color: #fca5a5; }
  .quiz-result-p { color: #d4d4d8; font-size: 14px; margin-bottom: 14px; }
  .quiz-reset {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;
    background: #27272a; border: 2px solid #3f3f46; color: #fff;
    padding: 8px 16px; display: flex; align-items: center; gap: 6px;
  }

  /* Big yellow "View certificate" button */
  .cert-btn {
    width: 100%; margin-top: 24px; padding: 16px 0;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.2em;
    background: #fbbf24; color: #000; border: 2px solid #fbbf24;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  /* Certificate */
  .cert-actions { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .cert-action-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;
    padding: 10px 20px; display: flex; align-items: center; gap: 6px; font-weight: 700;
  }
  .cert-action-btn.print  { background: #fbbf24; border: 2px solid #fbbf24; color: #000; }
  .cert-action-btn.reset  { background: #18181b; border: 2px solid #3f3f46; color: #fff; }

  .cert-paper {
    position: relative;
    background: #f5f1e8; color: #000;
    border: 6px double #000;
    padding: 48px 40px;
    text-align: center;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 6px),
      radial-gradient(circle at 20% 20%, rgba(255,184,0,0.1), transparent 50%);
  }
  .cert-corner-tl { position: absolute; top: 14px; right: 14px; }
  .cert-corner-bl { position: absolute; bottom: 14px; left: 14px; }
  .cert-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.4em; color: #57534e; margin-bottom: 8px;
  }
  .cert-rule { width: 48px; height: 4px; background: #d97706; margin: 0 auto 28px; }
  .cert-h1 { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 1; margin: 0 0 20px; color: #000; }
  .cert-italic { font-style: italic; color: #57534e; margin-bottom: 20px; font-size: 15px; }
  .cert-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 52px; display: inline-block;
    border-top: 2px solid #000; border-bottom: 2px solid #000;
    padding: 10px 32px; margin: 0 0 20px; color: #000;
  }
  .cert-narration { color: #57534e; max-width: 420px; margin: 0 auto 24px; font-size: 14px; line-height: 1.7; }
  .cert-status {
    font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.1em;
    color: #92400e; margin-bottom: 36px;
  }
  .cert-signature-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
    max-width: 420px; margin: 0 auto;
    padding-top: 20px; border-top: 1px solid #a8a29e;
  }
  .cert-sig-line { border-bottom: 1px solid #000; height: 28px; margin-bottom: 6px; }
  .cert-sig-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: #78716c; }
  .cert-date { font-family: 'Bebas Neue', sans-serif; font-size: 22px; margin: 0 0 4px; color: #000; }
  .cert-foot {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.3em;
    color: #a8a29e; margin-top: 28px;
  }

  /* Print rules */
  @media print {
    body { background: #fff; }
    header.site, footer.site, .cert-actions { display: none !important; }
    .container { padding: 0; max-width: none; }
    .cert-paper { border-color: #000; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <div class="logo-tile" id="logo-slot"></div>
    <div class="header-meta">
      <p class="small">Your Company &middot; Training Bay</p>
      <p class="big">Front Desk Onboarding</p>
    </div>
    <div class="header-progress-wrap" id="header-progress-wrap"></div>
  </div>
</header>

<main class="container" style="padding: 28px 20px 40px;">
  <div id="app"></div>
</main>

<footer class="site">
  <p>Built by Joseph &middot; Your Company Virtual Office &middot; Internal Use Only</p>
</footer>

// ============================================================================
// HELPERS
// ============================================================================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
// Allow specific HTML entities (rarrs, etc.) — these are pre-encoded in source.
function passHtml(str) { return str || ''; }

function getModule(id) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i]; return null; }
function completedCount() { return Object.keys(state.completed).length; }

// ============================================================================
// WELD PROGRESS BAR (header)
// ============================================================================
function renderWeldBar() {
  if (state.view === 'welcome' || state.view === 'certificate') {
    document.getElementById('header-progress-wrap').innerHTML = '';
    return;
  }
  var done = completedCount();
  var total = MODULES.length;
  var pct = (done / total) * 100;
  var html = '<div class="weld-row">' +
    '<span class="weld-label">Weld Progress</span>' +
    '<span class="weld-count">' + done + '/' + total + ' BEADS</span>' +
    '</div>' +
    '<div class="weld-track"><div class="weld-fill" style="width:' + pct + '%;"></div></div>';
  document.getElementById('header-progress-wrap').innerHTML = html;
}

// ============================================================================
function renderDashboard() {
  var done = completedCount();
  var total = MODULES.length;
  var allDone = done === total;

  // Find current (first not-completed) module
  var currentId = null;
  for (var i = 0; i < MODULES.length; i++) {
    if (!state.completed[MODULES[i].id]) { currentId = MODULES[i].id; break; }
  }

  var headlineText = done === 0 ? 'Pick a module to start.' :
                     done === total ? 'All beads laid down.' :
                     (total - done) + ' to go.';

  var html = '';
  html += '<div class="dash-head">';
  html += '<div><p class="dash-eyebrow">Training Dashboard</p>';
  html += '<h2 class="dash-h2">' + escapeHtml(headlineText) + '</h2></div>';
  if (done > 0 && done < total) {
    html += '<span class="stamp" style="background:#34d399;transform:rotate(2deg);">' + done + '/' + total + ' Done</span>';
  }
  html += '</div>';

  // Module grid
  html += '<div class="module-grid">';
  for (var m = 0; m < MODULES.length; m++) {
    var mod = MODULES[m];
    var isDone = !!state.completed[mod.id];
    var prevDone = m === 0 || !!state.completed[MODULES[m - 1].id];
    var locked = !isDone && !prevDone;
    var current = currentId === mod.id;

    var classes = 'mod-card';
    if (locked) classes += ' is-locked';
    if (isDone) classes += ' is-done';
    if (current && !isDone) classes += ' is-current';

    html += '<button class="' + classes + '"';
    if (!locked) html += ' data-action="open-module" data-mod-id="' + mod.id + '"';
    if (locked) html += ' disabled';
    html += '>';
    html += '<div class="mod-card-inner">';
    html += '<div class="mod-card-top">';
    var iconCls = isDone ? 'is-done' : current ? 'is-current' : 'is-pending';
    var iconColor = isDone || current ? '#000' : '#71717a';
    html += '<div class="mod-card-icon-tile ' + iconCls + '">';
    if (locked)      html += icon('lock', 18, '#71717a');
    else if (isDone) html += icon('check', 20, iconColor);
    else             html += icon(mod.iconKey, 20, iconColor);
    html += '</div>';
    html += '<span class="mod-card-subtitle">' + escapeHtml(mod.subtitle) + '</span>';
    html += '</div>';
    html += '<h3>' + escapeHtml(mod.title) + '</h3>';
    html += '<p class="mod-card-blurb">' + escapeHtml(mod.blurb) + '</p>';
    html += '<div class="mod-card-foot">';
    html += '<span class="mod-card-foot-meta">~' + mod.minutes + ' MIN</span>';
    if (isDone) html += '<span class="stamp" style="background:#34d399;transform:rotate(3deg);">Done</span>';
    else if (current) html += '<span class="stamp" style="transform:rotate(-6deg);">Active</span>';
    html += '</div></div></button>';
  }
  html += '</div>';

  if (allDone) {
    html += '<button class="cert-btn" data-action="view-cert">';
    html += icon('award', 22, '#000') + ' View certificate ' + icon('arrow-right', 18, '#000');
    html += '</button>';
  }
  return html;
}

function renderModule(mod) {
  var readDone = !!state.readDone[mod.id];
  var html = '';
  html += '<button class="lesson-back-btn" data-action="back-dash">' + icon('arrow-left', 13) + ' Back to dashboard</button>';
  html += '<div class="lesson-card">';
  html += '<div class="lesson-card-header">';
  html += '<div class="lesson-icon-tile">' + icon(mod.iconKey, 26, '#fbbf24') + '</div>';
  html += '<div><p class="lesson-card-subtitle">' + escapeHtml(mod.subtitle) + ' &middot; ~' + mod.minutes + ' min</p>';
  html += '<h2 class="lesson-card-title">' + escapeHtml(mod.title) + '</h2></div>';
  html += '</div>';
  html += '<div class="lesson-card-body">';

  for (var i = 0; i < mod.sections.length; i++) {
    var s = mod.sections[i];
    html += '<div class="lesson-section' + (s.callout ? ' callout' : '') + '">';
    html += '<h3>';
    if (s.callout) html += icon('triangle-alert', 17, '#f87171');
    html += escapeHtml(s.heading) + '</h3>';
    html += '<p>' + passHtml(s.body) + '</p>';
    html += '</div>';
  }

  if (!readDone) {
    html += '<button class="read-btn" data-action="mark-read" data-mod-id="' + mod.id + '">';
    html += 'I read this section ' + icon('arrow-right', 13);
    html += '</button>';
  } else if (mod.check) {
    html += renderCheck(mod);
  }

  html += '</div></div>';
  return html;
}

function renderCheck(mod) {
  var picked = state.checkPicked[mod.id];
  var pickedIdx = picked && typeof picked.idx === 'number' ? picked.idx : null;
  var tried = picked && picked.tried;

  var html = '<div class="check-card">';
  html += '<div class="check-row">' + icon('clipboard-list', 15, '#fbbf24');
  html += '<span class="check-label">Quick Check</span></div>';
  html += '<p class="check-q">' + escapeHtml(mod.check.q) + '</p>';
  html += '<div class="check-options">';
  for (var i = 0; i < mod.check.options.length; i++) {
    var opt = mod.check.options[i];
    var isPicked = pickedIdx === i;
    var locked = pickedIdx !== null && mod.check.options[pickedIdx].ok;
    var cls = 'check-option';
    if (isPicked && tried && opt.ok) cls += ' ok-picked';
    else if (isPicked && tried && !opt.ok) cls += ' bad-picked';
    html += '<button class="' + cls + '"';
    if (!locked) html += ' data-action="check-pick" data-mod-id="' + mod.id + '" data-opt-idx="' + i + '" data-ok="' + (opt.ok ? '1' : '0') + '"';
    if (locked) html += ' disabled';
    html += '><span>' + escapeHtml(opt.t) + '</span>';
    if (isPicked && tried && opt.ok) html += icon('check', 16, '#34d399');
    if (isPicked && tried && !opt.ok) html += icon('x', 16, '#f87171');
    html += '</button>';
  }
  html += '</div>';
  if (tried && pickedIdx !== null && !mod.check.options[pickedIdx].ok) {
    html += '<p class="check-fail-msg">Not quite. Re-read the section above and try again.</p>';
  }
  html += '</div>';
  return html;
}

function renderQuizView() {
  var totalQ = QUIZ.length;
  var allAnswered = Object.keys(state.quizAnswers).length === totalQ;
  var score = 0;
  for (var i = 0; i < totalQ; i++) if (state.quizAnswers[i] === QUIZ[i].correct) score++;
  var passed = score >= 6;

  var html = '';
  html += '<button class="lesson-back-btn" data-action="back-dash">' + icon('arrow-left', 13) + ' Back to dashboard</button>';
  html += '<div class="quiz-card">';
  html += '<div class="quiz-card-header">';
  html += '<p class="quiz-card-eyebrow">Module 08</p>';
  html += '<h2 class="quiz-card-title">Final Stamp</h2>';
  html += '<p style="font-size:12px;font-weight:500;margin:0;">Pass = 6 of 7 correct.</p>';
  html += '</div>';
  html += '<div class="quiz-card-body">';

  for (var qi = 0; qi < totalQ; qi++) {
    var q = QUIZ[qi];
    html += '<div class="quiz-q">';
    html += '<p class="quiz-q-text"><span class="quiz-q-num">Q' + (qi + 1) + '.</span>' + escapeHtml(q.q) + '</p>';
    html += '<div class="quiz-opt-list">';
    for (var oi = 0; oi < q.options.length; oi++) {
      var picked = state.quizAnswers[qi] === oi;
      var isCorrect = oi === q.correct;
      var optCls = 'quiz-opt';
      if (state.quizSubmitted && isCorrect) optCls += ' is-correct';
      else if (state.quizSubmitted && picked && !isCorrect) optCls += ' is-wrong';
      else if (picked) optCls += ' is-picked';
      html += '<button class="' + optCls + '"';
      if (!state.quizSubmitted) html += ' data-action="quiz-pick" data-q-idx="' + qi + '" data-opt-idx="' + oi + '"';
      if (state.quizSubmitted) html += ' disabled';
      html += '><span>' + escapeHtml(q.options[oi]) + '</span>';
      if (state.quizSubmitted && isCorrect) html += icon('check', 16, '#34d399');
      else if (state.quizSubmitted && picked && !isCorrect) html += icon('x', 16, '#f87171');
      html += '</button>';
    }
    html += '</div></div>';
  }

  if (!state.quizSubmitted) {
    html += '<button class="quiz-submit" data-action="quiz-submit"' + (allAnswered ? '' : ' disabled') + '>';
    html += allAnswered ? 'Submit Final Stamp' : ('Answer all ' + totalQ + ' questions');
    html += '</button>';
  } else {
    html += '<div class="quiz-result' + (passed ? '' : ' fail') + '">';
    html += '<h3 class="quiz-result-h">' + (passed ? 'Stamped. Welcome aboard.' : 'Almost there.') + '</h3>';
    html += '<p class="quiz-result-p">You scored ' + score + ' of ' + totalQ + '. ';
    html += passed ? 'Loading your certificate...' : 'Need 6 to pass. Review the modules and try again. Joseph will not judge.';
    html += '</p>';
    if (!passed) {
      html += '<button class="quiz-reset" data-action="quiz-reset">' + icon('rotate-ccw', 13) + ' Reset quiz</button>';
    }
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render() {
  var app = document.getElementById('app');
  var html = '';
  if (state.view === 'welcome') {
    html = renderWelcome();
  } else if (state.view === 'dashboard') {
    html = renderDashboard();
  } else if (state.view === 'certificate') {
    html = renderCertificate();
  } else if (state.view.indexOf('module:') === 0) {
    var mid = state.view.slice(7);
    var mod = getModule(mid);
    if (mod) html = mod.isQuiz ? renderQuizView() : renderModule(mod);
  }
  app.innerHTML = html;
  renderWeldBar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================================
// EVENTS
// ============================================================================
document.body.addEventListener('click', function(ev) {
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  var action = t.getAttribute('data-action');

  if (action === 'start') {
    state.view = 'dashboard';
    render();
  } else if (action === 'back-dash') {
    state.view = 'dashboard';
    render();
  } else if (action === 'open-module') {
    state.view = 'module:' + t.getAttribute('data-mod-id');
    render();
  } else if (action === 'mark-read') {
    state.readDone[t.getAttribute('data-mod-id')] = true;
    render();
  } else if (action === 'check-pick') {
    var mid = t.getAttribute('data-mod-id');
    var optIdx = parseInt(t.getAttribute('data-opt-idx'), 10);
    var ok = t.getAttribute('data-ok') === '1';
    state.checkPicked[mid] = { idx: optIdx, tried: true };
    render();
    if (ok) {
      // Auto-advance to dashboard after 700ms (matches original animation)
      setTimeout(function() {
        state.completed[mid] = true;
        state.view = 'dashboard';
        render();
      }, 700);
    }
  } else if (action === 'quiz-pick') {
    var qIdx = parseInt(t.getAttribute('data-q-idx'), 10);
    state.quizAnswers[qIdx] = parseInt(t.getAttribute('data-opt-idx'), 10);
    render();
  } else if (action === 'quiz-submit') {
    state.quizSubmitted = true;
    render();
    var score = 0;
    for (var i = 0; i < QUIZ.length; i++) if (state.quizAnswers[i] === QUIZ[i].correct) score++;
    if (score >= 6) {
      setTimeout(function() {
        state.completed['m8'] = true;
        state.view = 'certificate';
        render();
      }, 1200);
    }
  } else if (action === 'quiz-reset') {
    state.quizAnswers = {};
    state.quizSubmitted = false;
    render();
  } else if (action === 'view-cert') {
    state.view = 'certificate';
    render();
  } else if (action === 'print-cert') {
    window.print();
  } else if (action === 'reset-all') {
    state.completed = {};
    state.readDone = {};
    state.checkPicked = {};
    state.quizAnswers = {};
    state.quizSubmitted = false;
    state.view = 'welcome';
    render();
  }
});
