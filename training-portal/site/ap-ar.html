<!DOCTYPE html>
<html lang="en">
<head>

<title>M17 &middot; AP and AR | Your Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#000;color:#e4e4e7;
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% 8%,rgba(5,150,105,0.16),transparent 40%),
    radial-gradient(circle at 15% 92%,rgba(5,150,105,0.10),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}

header.site{border-bottom:2px solid #27272a;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#52525b;}
.header-meta .big{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #27272a;text-align:center;}
footer.site p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#3f3f46;}

.lab-hero{position:relative;border:2px solid #3f3f46;background:#18181b;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(5,150,105,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.3) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#059669;border-radius:50%;filter:blur(80px);opacity:.30;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#6ee7b7;margin-bottom:8px;}
.lab-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#6ee7b7;}
.lab-blurb{color:#a1a1aa;max-width:560px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #3f3f46;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#6ee7b7;margin:0;}
.lab-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#52525b;margin:0;}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#18181b;border:2px solid #3f3f46;padding:0;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#10b981;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#a1a1aa;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#27272a;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#10b981;}

.cat-back-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#71717a;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#18181b;border:2px solid #3f3f46;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#a1a1aa;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#18181b;
  border:2px solid #3f3f46;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#10b981;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;}
.lesson-num-tile.done   {background:#10b981;color:#000;}
.lesson-num-tile.current{background:#6ee7b7;color:#000;}
.lesson-num-tile.pending{background:#27272a;color:#71717a;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

.lesson-card{border:2px solid #3f3f46;background:#18181b;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.85;margin:0;}
.lesson-card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#6ee7b7;margin:0 0 8px;}
.lesson-section p{color:#a1a1aa;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(5,150,105,.14);border-left:4px solid #059669;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#6ee7b7;margin:0 0 6px;font-weight:700;}
.tip-body{color:#bfdbfe;font-size:13px;margin:0;line-height:1.55;font-style:italic;}

.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#059669;color:#fff;border:2px solid #059669;
  display:flex;align-items:center;justify-content:center;gap:10px;}

.pile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
@media (max-width:600px){ .pile-grid{grid-template-columns:1fr 1fr;} }
.pile-tile{background:#0c0c0c;border:1px solid #3f3f46;border-top:3px solid #059669;padding:10px 10px;}
.pile-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#6ee7b7;margin:0 0 4px;line-height:1;}
.pile-body{font-size:11px;color:#a1a1aa;line-height:1.45;margin:0;}

.int-card{border:2px solid #3f3f46;background:#18181b;}
.int-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.int-card-body{padding:24px 22px;}

.mib-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:720px){ .mib-grid{grid-template-columns:1fr;} }
.mib-col h4{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#6ee7b7;margin:0 0 12px;}
.mib-field{margin-bottom:12px;}
.mib-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#71717a;margin-bottom:4px;display:block;}
.mib-input,.mib-textarea,.mib-select{
  width:100%;background:#0c0c0c;border:1px solid #3f3f46;color:#e4e4e7;
  padding:8px 10px;font-size:13px;outline:none;font-family:inherit;
}
.mib-input:focus,.mib-textarea:focus,.mib-select:focus{border-color:#059669;}
.mib-textarea{resize:vertical;min-height:60px;line-height:1.5;font-size:12px;}

.invite-preview{background:#0c0c0c;border:1px solid #3f3f46;padding:0;overflow:hidden;}
.invite-preview-head{background:#059669;color:#fff;padding:10px 14px;}
.invite-preview-head h5{font-family:'Bebas Neue',sans-serif;font-size:20px;margin:0;line-height:1.1;}
.invite-preview-head p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;opacity:.85;margin:2px 0 0;}
.invite-preview-body{padding:12px 14px;}
.invite-row{display:flex;gap:10px;font-size:12px;color:#a1a1aa;padding:5px 0;border-bottom:1px dashed #27272a;}
.invite-row:last-child{border-bottom:none;}
.invite-row-key{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#71717a;width:80px;flex-shrink:0;padding-top:1px;}
.invite-row-val{flex:1;color:#e4e4e7;line-height:1.5;white-space:pre-line;}
.invite-empty{color:#52525b;font-style:italic;}

.mib-check-btn{margin-top:16px;padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#059669;color:#fff;border:2px solid #059669;}
.mib-feedback{margin-top:14px;padding:12px 14px;font-size:12px;line-height:1.6;}
.mib-feedback.ok{background:rgba(16,185,129,.08);border:1px solid #10b981;color:#a7f3d0;}
.mib-feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}
.mib-feedback.warn{background:rgba(250,204,21,.08);border:1px solid #fbbf24;color:#fde68a;}
.mib-feedback ul{margin:6px 0 0;padding-left:18px;}
.mib-feedback li{margin-bottom:3px;}

.drill-stage{background:#0c0c0c;border:1px solid #3f3f46;padding:18px;margin-bottom:14px;}
.drill-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#6ee7b7;margin-bottom:8px;}
.drill-scenario{background:#1c1917;border-left:3px solid #059669;padding:12px 14px;margin-bottom:14px;}
.drill-from{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#6ee7b7;margin-bottom:4px;}
.drill-subject{font-size:13px;color:#e4e4e7;font-weight:600;margin-bottom:4px;}
.drill-body{font-size:12px;color:#a1a1aa;line-height:1.5;}
.drill-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;}
.drill-btn{padding:12px 8px;background:#09090b;border:1px solid #3f3f46;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.05em;color:#a1a1aa;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px;}
.drill-btn:hover{border-color:#6ee7b7;}
.drill-btn small{font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#52525b;}
.drill-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}
.drill-btn.picked-correct small{color:#6ee7b7;}
.drill-btn.picked-wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.drill-btn.correct-shown{background:rgba(16,185,129,.08);border-color:#10b981;color:#a7f3d0;}
.drill-btn.correct-shown small{color:#6ee7b7;}
.feedback{margin-top:14px;padding:10px 14px;font-size:12px;line-height:1.55;}
.feedback.ok{background:rgba(16,185,129,.08);border:1px solid #10b981;color:#a7f3d0;}
.feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}

.sim-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;}
.sim-btn{padding:12px 8px;background:#09090b;border:1px solid #3f3f46;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.05em;color:#a1a1aa;line-height:1.2;}
.sim-btn:hover{border-color:#6ee7b7;}
.sim-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}
.sim-btn.picked-wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.sim-btn.correct-shown{background:rgba(16,185,129,.08);border-color:#10b981;color:#a7f3d0;}

.next-btn{padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#059669;color:#fff;border:2px solid #059669;}
.score-line{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  color:#a1a1aa;margin-top:16px;padding-top:14px;border-top:1px solid #27272a;}

.compose{background:#0c0c0c;border:1px solid #3f3f46;overflow:hidden;}
.compose-bar{background:#059669;color:#fff;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.compose-row{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid #27272a;font-size:12px;}
.compose-key{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#71717a;width:54px;flex-shrink:0;padding-top:2px;}
.compose-val{flex:1;color:#e4e4e7;line-height:1.4;}
.compose-body{padding:12px;font-size:12px;color:#e4e4e7;line-height:1.6;white-space:pre-line;min-height:84px;}
.compose-sig{padding:10px 12px 12px;border-top:1px dashed #27272a;font-size:11px;color:#a1a1aa;line-height:1.5;}
.compose-empty{color:#52525b;font-style:italic;}
.sigcard{background:#0c0c0c;border:1px solid #3f3f46;border-left:3px solid #059669;padding:12px 14px;margin-top:6px;font-size:12px;color:#e4e4e7;line-height:1.6;}
.sigcard b{color:#6ee7b7;}
.annot{background:#0c0c0c;border:1px solid #3f3f46;padding:0;margin-top:6px;overflow:hidden;}
.annot-row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #27272a;}
.annot-row:last-child{border-bottom:none;}
.annot-tag{font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#6ee7b7;width:64px;flex-shrink:0;padding-top:2px;}
.annot-txt{flex:1;font-size:12px;color:#e4e4e7;line-height:1.5;}
.mini-tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px;}
.mini-tbl th{font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#6ee7b7;text-align:left;padding:6px 8px;border-bottom:1px solid #3f3f46;background:#0c0c0c;}
.mini-tbl td{padding:6px 8px;border-bottom:1px solid #27272a;color:#e4e4e7;}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
@media(max-width:600px){.split2{grid-template-columns:1fr;}}
.split2 .col{background:#0c0c0c;border:1px solid #3f3f46;padding:10px 12px;}
.split2 .col h5{font-family:'Bebas Neue',sans-serif;font-size:16px;margin:0 0 6px;color:#6ee7b7;}
.split2 .col p{font-size:11px;color:#a1a1aa;line-height:1.5;margin:0;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;}
@media(max-width:600px){.week-grid{grid-template-columns:1fr 1fr;}}
.week-day{background:#0c0c0c;border:1px solid #3f3f46;padding:10px 8px;}
.week-day-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#6ee7b7;margin:0 0 6px;}
.week-day-tag{font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#71717a;margin:0 0 6px;}
.week-day-body{font-size:11px;color:#a1a1aa;line-height:1.4;margin:0;}
</style>

  w.rows.forEach(function(r){
    var v=g(r.key);
    html+='<div class="invite-row"><div class="invite-row-key">'+esc(r.label)+'</div><div class="invite-row-val">'+(v?esc(v):emptySpan(r.empty||('Add '+r.label)))+'</div></div>';
  });
  html+='</div>';
  if(w.table)html+=w.table(g);
  html+='</div>';
  return html;
}
function composePV(w,g){
  var from=w.from,sig=w.sig;
  if(w.brand){var b=w.brand(g('Company'));from=b.from;sig=b.sig;}
  var body=g('Body'),subj=g('Subject'),to=g('To');
  var html='<div class="compose"><div class="compose-bar">New Message</div>';
  html+='<div class="compose-row"><div class="compose-key">From</div><div class="compose-val">'+esc(from)+'</div></div>';
  html+='<div class="compose-row"><div class="compose-key">To</div><div class="compose-val">'+(to?esc(to):'<span class="compose-empty">recipient</span>')+'</div></div>';
  html+='<div class="compose-row"><div class="compose-key">Subject</div><div class="compose-val">'+(subj?esc(subj):'<span class="compose-empty">(no subject)</span>')+'</div></div>';
  html+='<div class="compose-body">'+(body?esc(body):'<span class="compose-empty">Write the message.</span>')+'</div>';
  html+='<div class="compose-sig">'+sig+'</div></div>';
  return html;
}
function weekPV(w,g){
  var html='<div class="week-grid">';
  w.days.forEach(function(d){
    var v=g(d.key);
    html+='<div class="week-day"><p class="week-day-name">'+esc(d.name)+'</p><p class="week-day-tag">Open hours</p><p class="week-day-body">'+(v?esc(v):'<span class="invite-empty">unassigned</span>')+'</p></div>';
  });
  html+='</div>';
  return html;
}
function gridHtml(cells){
  var html='<div class="week-grid">';
  cells.forEach(function(c){
    html+='<div class="week-day"><p class="week-day-name">'+esc(c.d)+'</p><p class="week-day-tag">'+esc(c.t||'')+'</p><p class="week-day-body">'+esc(c.b||'')+'</p></div>';
  });
  html+='</div>';
  return html;
}
function renderQuiz(key,lesson,cat){
  var w=WIDGETS[key];var p=w.prefix;var idx=state[p+'Idx'];var list=w.scenarios;var s=list[idx];
  var picked=state[p+'Picked'][s.id];var revealed=state[p+'Revealed'][s.id];
  var total=list.length;var allDone=list.every(function(x){return state[p+'Revealed'][x.id];});
  var correctCount=list.filter(function(x){return state[p+'Picked'][x.id]===x.correct;}).length;
  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card"><div class="int-card-header" style="background:'+cat.color+';">'+
    '<div class="lesson-icon-tile">'+icon(w.icon,26,'#fff')+'</div>'+
    '<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p><h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body"><p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">'+esc(w.intro)+'</p>';
  html+='<div class="drill-stage"><p class="drill-tag">'+esc(w.unit||'Item')+' '+(idx+1)+' of '+total+'</p>';
  if(s.grid)html+=gridHtml(s.grid);
  html+='<div class="drill-scenario">';
  if(s.card){html+=s.card;}
  else{
    if(s.from)html+='<div class="drill-from">'+esc((s.fromLabel||'From')+': '+s.from)+'</div>';
    if(s.subject)html+='<div class="drill-subject">'+esc(s.subject)+'</div>';
    html+='<div class="drill-body">'+esc(s.body)+'</div>';
  }
  html+='</div>';
  if(w.btn==='drill'){
    html+='<div class="drill-btns">';
    w.actions.forEach(function(a){
      var cls='drill-btn';
      if(revealed){if(a.id===s.correct)cls+=picked===a.id?' picked-correct':' correct-shown';else if(a.id===picked)cls+=' picked-wrong';}
      html+='<button class="'+cls+'" data-action="q-pick" data-key="'+key+'" data-act="'+esc(a.id)+'"><span>'+esc(a.name)+'</span><small>'+esc(a.sub)+'</small></button>';
    });
    html+='</div>';
  } else {
    var acts=s.opts||w.actions;
    html+='<div class="sim-buttons">';
    acts.forEach(function(a){
      var cls='sim-btn';
      if(revealed){if(a===s.correct)cls+=picked===a?' picked-correct':' correct-shown';else if(a===picked)cls+=' picked-wrong';}
      html+='<button class="'+cls+'" data-action="q-pick" data-key="'+key+'" data-act="'+esc(a)+'">'+esc(a)+'</button>';
    });
    html+='</div>';
  }
  if(revealed){
    var ok=picked===s.correct;var label;
    if(w.btn==='drill'){var ca=w.actions.filter(function(a){return a.id===s.correct;})[0];label=ca?ca.name:s.correct;}
    else label=s.correct;
    html+='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Answer: '+esc(label)+'. ')+esc(s.why)+'</div>';
    if(idx<total-1)html+='<div style="text-align:right;margin-top:12px;"><button class="next-btn" data-action="q-next" data-key="'+key+'">Next '+icon('arrow-right',14,'#fff')+'</button></div>';
  }
  html+='</div>';
  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#6ee7b7')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';return html;
}
function renderLesson(lesson,cat){
  if(lesson.type==='reading')return renderReading(lesson,cat);
  var w=WIDGETS[lesson.intKey];
  if(w&&w.family==='builder')return renderBuilder(lesson.intKey,lesson,cat);
  if(w)return renderQuiz(lesson.intKey,lesson,cat);
  return renderReading(lesson,cat);
}
function initWidget(key){
  var w=WIDGETS[key];if(!w)return;
  if(w.family==='builder'){
    state[w.prefix+'Checked']=false;state[w.prefix+'Feedback']=null;
    w.fields.forEach(function(f){state[w.prefix+f.key]=(f.def!=null?f.def:'');});
  } else {
    state[w.prefix+'Idx']=0;state[w.prefix+'Picked']={};state[w.prefix+'Revealed']={};
  }
}
Object.keys(WIDGETS).forEach(initWidget);
function render(){
  var app=document.getElementById('app');var html='';
  if(state.view==='home'){html=renderHome();}
  else if(state.view.indexOf('category:')===0){var cat=getCat(state.view.slice(9));html=cat?renderCategory(cat):renderHome();}
  else if(state.view.indexOf('lesson:')===0){var info=getLesson(state.view.slice(7));html=info?renderLesson(info.lesson,info.cat):renderHome();}
  app.innerHTML=html;
  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey){
      var w=WIDGETS[info2.lesson.intKey];
      if(w&&w.family==='builder'){
        var key=info2.lesson.intKey;
        setTimeout(function(){
          document.querySelectorAll('[data-w]').forEach(function(el){
            el.addEventListener('input',function(e){
              var pre=e.target.getAttribute('data-w');var fld=e.target.getAttribute('data-f');
              state[pre+fld]=e.target.value;state[pre+'Checked']=false;state[pre+'Feedback']=null;
              var pv=document.getElementById('mib-preview');if(pv)pv.innerHTML=buildPreviewInner(key);
            });
          });
        },50);
      }
    }
  }
}
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');if(!t)return;
  var action=t.getAttribute('data-action');
  if(action==='open-cat'){state.view='category:'+t.getAttribute('data-cat-id');render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='back-home'){state.view='home';render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='back-cat'){state.view='category:'+t.getAttribute('data-cat-id');render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='open-lesson'){var lid=t.getAttribute('data-lesson-id');var info=getLesson(lid);if(info&&info.lesson.intKey){initWidget(info.lesson.intKey);}state.view='lesson:'+lid;render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='complete-lesson'){var lid2=t.getAttribute('data-lesson-id');state.completed[lid2]=true;var info2=getLesson(lid2);if(info2){var next=null;for(var i=0;i<info2.cat.lessons.length;i++){if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){next=info2.cat.lessons[i+1];break;}}state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;render();window.scrollTo({top:0,behavior:'smooth'});}}
  else if(action==='w-check'){var k1=t.getAttribute('data-key');var w1=WIDGETS[k1];state[w1.prefix+'Feedback']=w1.validate();state[w1.prefix+'Checked']=true;render();}
  else if(action==='q-pick'){var k2=t.getAttribute('data-key');var w2=WIDGETS[k2];var sc=w2.scenarios[state[w2.prefix+'Idx']];if(state[w2.prefix+'Revealed'][sc.id])return;state[w2.prefix+'Picked'][sc.id]=t.getAttribute('data-act');state[w2.prefix+'Revealed'][sc.id]=true;render();}
  else if(action==='q-next'){var k3=t.getAttribute('data-key');var w3=WIDGETS[k3];if(state[w3.prefix+'Idx']<w3.scenarios.length-1){state[w3.prefix+'Idx']++;render();}}
});

document.getElementById('logo-slot').innerHTML=icon('file',22,'#fff');
render();
</script>
