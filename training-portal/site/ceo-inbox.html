.feedback{margin-top:14px;padding:10px 14px;font-size:12px;line-height:1.55;}

.sim-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#10b981;color:#a7f3d0;}

.next-btn{padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;

    { h:'What does this person need', b:'Under the words there is a request. A date. A decision. A document. A dollar amount. Find it. The real ask is what tells you the pile and the urgency.' },

function checkRoute(){
  var issues=[];var warnings=[];
  var subject=state.rbSubject.trim();
  var summary=state.rbSummary.trim();
  var ask=state.rbAsk.trim();
  if(!subject){ issues.push('Subject is empty. One specific line saying what this is.'); }
  else if(subject.split(/\s+/).length<3){ issues.push('Subject is too vague. Be specific so the owner knows the topic at a glance.'); }
  if(!summary){ issues.push('Summary is empty. One or two sentences on what this is and where it came from.'); }
  else if(summary.split(/\s+/).length<5){ issues.push('Summary is too short. Give enough that the owner does not have to open the original email.'); }
  if(!ask){ issues.push('The ask is empty. Name the decision or action you need from this person.'); }

  var amt=state.rbAmount.replace(/[, ]/g,'');
  var num=0; var mn=amt.match(/(\d{3,})/); if(mn) num=parseInt(mn[1],10);
  if(num>=50000 && state.rbTo!=='Owner + Amber'){
    warnings.push('This amount is 50,000 or more. That needs Owner and Amber together. Route it to both.');
  } else if(num>=5000 && state.rbTo.indexOf('Owner')<0){
    warnings.push('This amount is 5,000 or more. That needs Owner. Route it to him, not only to an owner.');
  }

  if(issues.length>0){
    state.rbFeedback={kind:'fail',headline:'Note needs work before it goes:',items:issues};
  } else if(warnings.length>0){
    state.rbFeedback={kind:'warn',headline:'Note is clear but the routing is off:',items:warnings};
  } else {
    state.rbFeedback={kind:'pass',headline:'Note is ready. Right owner, clear summary, stated ask, number surfaced.',items:[]};
  }
  state.rbChecked=true;
}

function renderApprovalDrill(lesson,cat){
  var idx=state.apIdx;var s=APPROVAL_SCENARIOS[idx];var picked=state.apPicked[s.id];var revealed=state.apRevealed[s.id];
  var total=APPROVAL_SCENARIOS.length;var allDone=APPROVAL_SCENARIOS.every(function(sc){return state.apRevealed[sc.id];});
  var correctCount=APPROVAL_SCENARIOS.filter(function(sc){return state.apPicked[sc.id]===sc.correct;}).length;
  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card"><div class="int-card-header" style="background:'+cat.color+';">'+
    '<div class="lesson-icon-tile">'+icon('shield',26,'#fff')+'</div>'+
    '<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p><h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body"><p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">Six money and judgment calls. Remember the gate: 5,000 needs Owner, 50,000 needs Owner and Amber, and you never approve spend yourself.</p>';
  html+='<div class="drill-stage"><p class="drill-tag">Scenario '+(idx+1)+' of '+total+'</p>';
  html+='<div class="drill-scenario"><div class="drill-from">From: '+esc(s.from)+'</div><div class="drill-body">'+esc(s.body)+'</div></div>';
  html+='<div class="sim-buttons">';
  APPROVAL_ACTIONS.forEach(function(a){
    var cls='sim-btn';
    if(revealed){if(a===s.correct)cls+=picked===a?' picked-correct':' correct-shown';else if(a===picked)cls+=' picked-wrong';}
    html+='<button class="'+cls+'" data-action="ap-pick" data-act="'+esc(a)+'">'+esc(a)+'</button>';
  });
  html+='</div>';
  if(revealed){
    var ok=picked===s.correct;
    html+='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Should be: '+esc(s.correct)+'. ')+esc(s.why)+'</div>';
    if(idx<total-1)html+='<div style="text-align:right;margin-top:12px;"><button class="next-btn" data-action="ap-next">Next '+icon('arrow-right',14,'#fff')+'</button></div>';
  }
  html+='</div>';
  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#93c5fd')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';return html;
}

function renderLesson(lesson,cat){
  if(lesson.type==='reading') return renderReading(lesson,cat);
  if(lesson.intKey==='inboxTriage')  return renderInboxTriage(lesson,cat);
  if(lesson.intKey==='routeBuilder') return renderRouteBuilder(lesson,cat);
  if(lesson.intKey==='approvalDrill')return renderApprovalDrill(lesson,cat);
  return renderReading(lesson,cat);
}

function render(){
  var app=document.getElementById('app');
  var html='';
  if(state.view==='home'){
    html=renderHome();
  } else if(state.view.indexOf('category:')===0){
    var cat=getCat(state.view.slice(9));
    html=cat?renderCategory(cat):renderHome();
  } else if(state.view.indexOf('lesson:')===0){
    var info=getLesson(state.view.slice(7));
    html=info?renderLesson(info.lesson,info.cat):renderHome();
  }
  app.innerHTML=html;

  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey==='routeBuilder'){
      setTimeout(function(){
        document.querySelectorAll('[data-rb]').forEach(function(el){
          el.addEventListener('input',function(e){
            var field=e.target.getAttribute('data-rb');
            state['rb'+field]=e.target.value;
            state.rbChecked=false; state.rbFeedback=null;
            updateRoutePreview();
          });
        });
      },50);
    }
  }
}

function updateRoutePreview(){
  var head=document.querySelector('.invite-preview-head h5');
  if(!head) return;
  head.innerHTML=state.rbSubject?esc(state.rbSubject):'<span style="opacity:.5;">(No subject)</span>';
  var sub=document.querySelector('.invite-preview-head p');
  if(sub) sub.innerHTML='Routing note &middot; To: '+esc(state.rbTo)+' &middot; '+esc(state.rbUrgency);
  var rows=document.querySelectorAll('.invite-row');
  if(rows.length<4) return;
  rows[0].querySelector('.invite-row-val').innerHTML=state.rbSummary?esc(state.rbSummary):'<span class="invite-empty">Add a one or two sentence summary</span>';
  rows[1].querySelector('.invite-row-val').innerHTML=state.rbAsk?esc(state.rbAsk):'<span class="invite-empty">State the decision needed</span>';
  rows[2].querySelector('.invite-row-val').innerHTML=state.rbAmount?esc(state.rbAmount):'<span class="invite-empty">Surface any number or deadline</span>';
  rows[3].querySelector('.invite-row-val').innerHTML=state.rbRec?esc(state.rbRec):'<span class="invite-empty">Optional</span>';
}

document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');

  if(action==='open-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(action==='back-home'){ state.view='home'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(action==='back-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(action==='open-lesson'){
    var lid=t.getAttribute('data-lesson-id');
    var info=getLesson(lid);
    if(info){
      if(info.lesson.intKey==='routeBuilder'){
        state.rbTo='Owner'; state.rbSubject=''; state.rbSummary=''; state.rbAsk='';
        state.rbAmount=''; state.rbRec=''; state.rbUrgency='Today';
        state.rbChecked=false; state.rbFeedback=null;
      }
      if(info.lesson.intKey==='inboxTriage'){  state.trIdx=0; state.trPicked={}; state.trRevealed={}; }
      if(info.lesson.intKey==='approvalDrill'){ state.apIdx=0; state.apPicked={}; state.apRevealed={}; }
    }
    state.view='lesson:'+lid; render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(action==='complete-lesson'){
    var lid2=t.getAttribute('data-lesson-id');
    state.completed[lid2]=true;
    var info2=getLesson(lid2);
    if(info2){
      var next=null;
      for(var i=0;i<info2.cat.lessons.length;i++){
        if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){ next=info2.cat.lessons[i+1]; break; }
      }
      state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;
      render(); window.scrollTo({top:0,behavior:'smooth'});
    }
  }
  else if(action==='rb-check'){ checkRoute(); render(); }
  else if(action==='tr-pick'){
    var em=TRIAGE_EMAILS[state.trIdx];
    if(state.trRevealed[em.id]) return;
    state.trPicked[em.id]=t.getAttribute('data-act');
    state.trRevealed[em.id]=true;
    render();
  }
  else if(action==='tr-next'){ if(state.trIdx<TRIAGE_EMAILS.length-1){ state.trIdx++; render(); } }
  else if(action==='ap-pick'){
    var sc=APPROVAL_SCENARIOS[state.apIdx];
    if(state.apRevealed[sc.id]) return;
    state.apPicked[sc.id]=t.getAttribute('data-act');
    state.apRevealed[sc.id]=true;
    render();
  }
  else if(action==='ap-next'){ if(state.apIdx<APPROVAL_SCENARIOS.length-1){ state.apIdx++; render(); } }
});

document.getElementById('logo-slot').innerHTML=icon('inbox',22,'#fff');
render();
</script>
