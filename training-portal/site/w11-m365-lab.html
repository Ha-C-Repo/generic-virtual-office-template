<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Win 11 + M365 Lab | Your Company</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #000; color: #e4e4e7;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5; min-height: 100vh;
    background-image:
      radial-gradient(circle at 90% 10%, rgba(0,103,192,0.08), transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(0,120,212,0.05), transparent 40%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input { font-family: inherit; }
  p { margin: 0; }
  h1, h2, h3, h4 { margin: 0; font-weight: normal; }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
  .mono  { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .segoe { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'IBM Plex Sans', sans-serif; }

  /* Header */
  header.site {
    border-bottom: 2px solid #27272a;
    background: rgba(0,0,0,0.85);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .header-row { max-width: 960px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .logo-tile { width: 40px; height: 40px; background: #0067c0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-meta { flex: 1; min-width: 0; }
  .header-meta .small { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #52525b; }
  .header-meta .big { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer.site { max-width: 960px; margin: 0 auto; padding: 28px 20px; border-top: 1px solid #27272a; text-align: center; }
  footer.site p { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #3f3f46; }

  /* Lab home (hero + categories) */
  .lab-hero {
    position: relative; border: 2px solid #3f3f46; background: #18181b;
    overflow: hidden; margin-bottom: 28px;
  }
  .hero-grid {
    position: absolute; inset: 0; opacity: 0.15;
    background-image: linear-gradient(rgba(77,208,225,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(77,208,225,0.2) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .hero-glow {
    position: absolute; top: -40px; right: -40px; width: 200px; height: 200px;
    background: #0078d4; border-radius: 50%; filter: blur(80px); opacity: 0.3;
  }
  .lab-hero-inner { position: relative; padding: 28px 24px; }
  .lab-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #fbbf24; margin-bottom: 8px; }
  .lab-h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px, 9vw, 72px); color: #fff; line-height: 0.9; margin-bottom: 14px; }
  .lab-h1 .accent { color: #fbbf24; }
  .lab-blurb { color: #a1a1aa; max-width: 540px; font-size: 14px; line-height: 1.7; margin-bottom: 22px; }
  .lab-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 460px; }
  .lab-stat { border: 1px solid #3f3f46; background: rgba(0,0,0,0.4); padding: 8px 10px; }
  .lab-stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fbbf24; margin: 0; }
  .lab-stat-lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: #52525b; margin: 0; }

  /* Category cards */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .cat-card { text-align: left; background: #18181b; border: 2px solid #3f3f46; padding: 0; position: relative; overflow: hidden; width: 100%; }
  .cat-card.is-done { border-color: #10b981; }
  .cat-stripe { height: 6px; }
  .cat-inner { padding: 18px; }
  .cat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .cat-icon-tile { width: 44px; height: 44px; color: #fff; display: flex; align-items: center; justify-content: center; }
  .cat-preview-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; border: 1px solid #3f3f46; padding: 3px 6px; }
  .cat-card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; margin: 0 0 6px; line-height: 1.05; }
  .cat-card-blurb { font-size: 12px; color: #a1a1aa; margin: 0 0 14px; line-height: 1.5; }
  .cat-card-foot { display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.2em; }
  .cat-progress-track { height: 4px; background: #27272a; flex: 1; margin-left: 12px; max-width: 80px; }
  .cat-progress-fill { height: 100%; background: #10b981; transition: width 0.3s ease; }

  /* Category view (lesson list) */
  .cat-back-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #71717a; display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
  .cat-header { background: #18181b; border: 2px solid #3f3f46; padding: 20px; margin-bottom: 16px; }
  .cat-header-inner { display: flex; gap: 16px; align-items: flex-start; }
  .cat-header-icon { width: 56px; height: 56px; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cat-header-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; margin: 0; }
  .cat-header-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #fff; margin: 4px 0; line-height: 1; }
  .cat-header-blurb { color: #a1a1aa; font-size: 13px; margin: 0; line-height: 1.5; }

  .lesson-list { display: flex; flex-direction: column; gap: 8px; }
  .lesson-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #18181b; border: 2px solid #3f3f46; cursor: pointer; width: 100%; text-align: left; }
  .lesson-row.is-done { border-color: #10b981; }
  .lesson-row.is-locked { opacity: 0.45; cursor: not-allowed; }
  .lesson-num-tile { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 16px; }
  .lesson-num-tile.is-done    { background: #10b981; color: #000; }
  .lesson-num-tile.is-current { background: #fbbf24; color: #000; }
  .lesson-num-tile.is-pending { background: #27272a; color: #71717a; }
  .lesson-row-meta { flex: 1; min-width: 0; }
  .lesson-row-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; margin: 0; line-height: 1.1; }
  .lesson-row-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; margin: 4px 0 0; }

  /* Lesson reading view */
  .lesson-card { border: 2px solid #3f3f46; background: #18181b; }
  .lesson-card-header { background: #0067c0; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #3f3f46; }
  .lesson-card-header.outlook { background: #0078d4; }
  .lesson-card-header.onedrive { background: #0078d4; }
  .lesson-card-header.teams { background: #5b5fc7; }
  .lesson-card-header.office { background: #185abd; }
  .lesson-card-header.security { background: #107c10; }
  .lesson-icon-tile { width: 52px; height: 52px; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lesson-card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; opacity: 0.8; margin: 0; }
  .lesson-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; margin: 4px 0 0; line-height: 1; color: #fff; }
  .lesson-card-body { padding: 24px 22px; }
  .lesson-section { margin-bottom: 22px; }
  .lesson-section h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fbbf24; margin: 0 0 8px; letter-spacing: 0.04em; }
  .lesson-section p { color: #a1a1aa; line-height: 1.65; margin: 0; font-size: 14px; }
  .tip-box { background: rgba(0,103,192,0.08); border-left: 4px solid #0067c0; padding: 12px 16px; margin-top: 20px; }
  .tip-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; color: #60a5fa; margin: 0 0 6px; font-weight: 700; }
  .tip-body { color: #cbd5e1; font-size: 13px; margin: 0; line-height: 1.55; font-style: italic; }

  .complete-btn {
    width: 100%; margin-top: 24px; padding: 14px 0;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.2em;
    background: #fbbf24; color: #000; border: 2px solid #fbbf24;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  /* SimChrome */
  .sim-bar { background: #18181b; border: 2px solid #3f3f46; padding: 12px 16px; margin-bottom: 16px; }
  .sim-bar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .sim-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; color: #fbbf24; margin: 0; }
  .sim-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; margin: 2px 0 0; }
  .sim-reset-btn { padding: 6px 10px; background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; display: flex; align-items: center; gap: 4px; }
  .sim-goal { background: #09090b; border: 1px solid #fbbf24; padding: 10px 14px; margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  .sim-goal-text { color: #fde68a; font-size: 13px; font-weight: 500; }
  .sim-feedback { margin-top: 8px; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .sim-feedback.ok    { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #6ee7b7; }
  .sim-feedback.error { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; }
  .sim-viewport { background: #27272a; padding: 24px; border: 2px solid #3f3f46; min-height: 380px; }
  .sim-done-banner { background: rgba(16,185,129,0.1); border: 2px solid #10b981; padding: 18px; margin-top: 16px; }
  .sim-done-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .sim-done-h { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #6ee7b7; margin: 0; }
  .sim-done-msg { color: #d4d4d8; font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
  .sim-done-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .sim-mark-complete-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.2em;
    background: #fbbf24; color: #000; padding: 10px 22px; border: 2px solid #fbbf24;
    display: flex; align-items: center; gap: 8px;
  }
  .sim-run-again-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    background: #27272a; color: #a1a1aa; padding: 10px 16px; border: 2px solid #3f3f46;
    display: flex; align-items: center; gap: 6px;
  }

  /* File Explorer Sim */
  .fx-window { background: #fff; box-shadow: 0 12px 32px rgba(0,0,0,0.4); width: 100%; max-width: 760px; margin: 0 auto; border-radius: 8px; overflow: hidden; border: 1px solid #d1d5db; font-family: 'Segoe UI', sans-serif; }
  .fx-titlebar { background: #f3f3f3; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; font-size: 13px; color: #000; }
  .fx-toolbar { background: #fafafa; padding: 6px 12px; display: flex; gap: 16px; font-size: 12px; color: #333; border-bottom: 1px solid #eee; }
  .fx-addressbar { background: #fff; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; }
  .fx-addr-text { font-size: 12px; color: #000; background: #f3f3f3; padding: 4px 10px; flex: 1; border-radius: 3px; }
  .fx-body-row { display: flex; min-height: 280px; }
  .fx-sidebar { width: 160px; background: #fafafa; padding: 12px 6px; border-right: 1px solid #eee; font-size: 12px; }
  .fx-sidebar-head { padding: 4px 8px; color: #666; font-weight: 600; font-size: 10px; margin-bottom: 4px; }
  .fx-sidebar-item { padding: 5px 10px; display: flex; gap: 8px; align-items: center; color: #000; border-radius: 3px; margin-bottom: 2px; }
  .fx-sidebar-item.active { background: #e5f1fb; }
  .fx-main { flex: 1; padding: 16px; position: relative; background: #fff; min-height: 280px; }
  .fx-files { display: flex; flex-wrap: wrap; gap: 18px; }
  .fx-file { width: 78px; text-align: center; padding: 6px; border-radius: 4px; cursor: pointer; }
  .fx-file-emoji { font-size: 36px; line-height: 1; }
  .fx-file-name { font-size: 11px; color: #000; margin-top: 4px; word-break: break-word; }
  .fx-hint {
    position: absolute; bottom: 16px; right: 16px;
    background: #000; color: #fbbf24; font-size: 10px;
    padding: 4px 10px; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .fx-context-menu {
    position: absolute; top: 60px; left: 60px; background: #fff;
    border: 1px solid #ccc; box-shadow: 4px 4px 16px rgba(0,0,0,0.2);
    min-width: 180px; padding: 4px 0; font-size: 12px; z-index: 5;
  }
  .fx-ctx-item { padding: 6px 14px; color: #000; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fx-ctx-item.disabled { color: #bbb; cursor: default; }
  .fx-ctx-item:hover:not(.disabled) { background: #f3f4f6; }
  .fx-ctx-item.pulse { background: #fef3c7 !important; animation: pulse-yellow 1.4s ease-in-out infinite; }
  .fx-ctx-divider { border-top: 1px solid #eee; margin: 4px 0; }
  .fx-submenu {
    position: absolute; left: 100%; top: 80px; background: #fff;
    border: 1px solid #ccc; box-shadow: 4px 4px 16px rgba(0,0,0,0.2);
    min-width: 180px; padding: 4px 0; font-size: 12px;
  }
  .fx-folder-name-input {
    width: 100%; font-size: 11px; margin-top: 4px; padding: 2px 4px;
    border: 1px solid #0067c0; outline: none; text-align: center;
    font-family: 'Segoe UI', sans-serif;
  }
  @keyframes pulse-yellow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
    50%      { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); }
  }
  @keyframes shake-x {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .shake { animation: shake-x 0.35s ease-in-out; }

  /* Phishing sim */
  .phish-window { font-family: 'Segoe UI', sans-serif; background: #fff; max-width: 760px; margin: 0 auto; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
  .phish-header { background: #0078d4; color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; font-size: 13px; }
  .phish-row { display: flex; min-height: 380px; }
  .phish-list { width: 45%; border-right: 1px solid #eee; overflow-y: auto; max-height: 380px; }
  .phish-list-item { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; border-left: 3px solid transparent; }
  .phish-list-item.is-open { background: #e5f1fb; }
  .phish-list-item.is-marked { background: #fef2f2; border-left-color: #ef4444; }
  .phish-from-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .phish-from { font-size: 12px; font-weight: 600; color: #000; }
  .phish-subject { font-size: 12px; color: #000; margin-bottom: 2px; font-weight: 500; }
  .phish-preview { font-size: 11px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phish-body { flex: 1; padding: 16px; font-size: 13px; color: #000; overflow-y: auto; max-height: 380px; }
  .phish-empty { color: #999; text-align: center; margin-top: 80px; font-size: 12px; }
  .phish-subj { font-size: 16px; font-weight: 600; color: #000; margin-bottom: 8px; }
  .phish-sender-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .phish-avatar { width: 32px; height: 32px; background: #0078d4; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .phish-sender-name { font-size: 13px; font-weight: 600; color: #000; }
  .phish-reveal { font-size: 11px; color: #0078d4; cursor: help; text-decoration: underline dotted; }
  .phish-reveal.is-shown { color: #dc2626; font-weight: 600; text-decoration: none; }
  .phish-mark-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
    padding: 6px 12px; border: 2px solid #999; background: #fff; color: #000;
    display: flex; align-items: center; gap: 6px;
  }
  .phish-mark-btn.is-marked { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
  .phish-content { border-top: 1px solid #eee; margin: 12px 0; padding-top: 12px; color: #000; white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
  .phish-explain { margin-top: 16px; padding: 12px; font-size: 12px; color: #000; }
  .phish-explain.is-phish { background: #fee2e2; border: 1px solid #ef4444; }
  .phish-explain.is-legit { background: #dcfce7; border: 1px solid #10b981; }
  .phish-submit-bar { background: #f9fafb; padding: 12px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .phish-submit-bar-left { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.15em; }
  .phish-submit-btn { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.15em; background: #fbbf24; color: #000; padding: 8px 18px; border: 2px solid #fbbf24; }
  .phish-try-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; background: #27272a; color: #fff; padding: 8px 14px; border: 2px solid #3f3f46; display: flex; align-items: center; gap: 6px; }
  .phish-tip { font-size: 12px; color: #a1a1aa; text-align: center; margin-top: 16px; font-style: italic; }

  /* Taskbar Tour */
  .taskbar-stage {
    background: linear-gradient(180deg, #4a90e2, #2c5aa0); padding: 40px 20px 20px;
    border-radius: 8px; position: relative; min-height: 200px;
  }
  .taskbar-help-text {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #fff;
    text-align: center; text-transform: uppercase; letter-spacing: 0.25em;
    opacity: 0.7; margin-bottom: 20px;
  }
  .taskbar-bar {
    background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 8px;
    display: flex; gap: 8px; justify-content: center; max-width: 480px; margin: 0 auto;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .taskbar-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-size: 22px; transition: background 0.15s; }
  .taskbar-icon:hover, .taskbar-icon.is-hovered { background: rgba(255,255,255,0.25); }
  .taskbar-tooltip-area { min-height: 60px; margin-top: 20px; text-align: center; }
  .taskbar-tooltip { background: #000; display: inline-block; padding: 10px 18px; border: 1px solid #fbbf24; }
  .taskbar-tooltip-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fbbf24; margin: 0; }
  .taskbar-tooltip-desc { font-size: 12px; color: #fff; margin: 2px 0 0; }
  .taskbar-tooltip-empty {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #fff;
    opacity: 0.6; text-transform: uppercase; letter-spacing: 0.2em;
  }

  /* Inbox Anatomy */
  .inbox-shell { font-family: 'Segoe UI', sans-serif; background: #fff; border: 2px solid #3f3f46; border-radius: 6px; overflow: hidden; }
  .inbox-help-text {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #fbbf24;

// ============================================================================
// HELPERS
// ============================================================================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function passHtml(str) { return str || ''; } // for content pre-encoded with &rarr; etc.
function getCategory(id) { for (var i=0;i<CATEGORIES.length;i++) if (CATEGORIES[i].id===id) return CATEGORIES[i]; return null; }
function getLesson(id) {
  for (var i=0;i<CATEGORIES.length;i++) {
    var c = CATEGORIES[i];
    for (var j=0;j<c.lessons.length;j++) if (c.lessons[j].id===id) return { lesson:c.lessons[j], cat:c, idx:j };
  }
  return null;
}
function totalLessons() { return CATEGORIES.reduce(function(a,c){ return a + c.lessons.length; }, 0); }
function completedCount() { return Object.keys(state.completed).length; }

function renderLesson(lesson, cat, idx) {
  // Sim or interactive — delegate
  if (lesson.type === 'sim') {
    if (lesson.simKey === 'fileExplorer') return renderFileExplorerSim(lesson, cat);
    if (lesson.simKey === 'phishing')     return renderPhishingSim(lesson, cat);

  if (lesson.type === 'interactive') {
    if (lesson.simKey === 'taskbar') return renderTaskbarLesson(lesson, cat);

}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render() {
  var app = document.getElementById('app');
  var html = '';
  if (state.view === 'home') {
    html = renderLabHome();
  } else if (state.view.indexOf('category:') === 0) {
    var cat = getCategory(state.view.slice(9));
    if (cat) html = renderCategory(cat);
    else html = renderLabHome();
  } else if (state.view.indexOf('lesson:') === 0) {
    var info = getLesson(state.view.slice(7));
    if (info) html = renderLesson(info.lesson, info.cat, info.idx);
    else html = renderLabHome();
  }
  app.innerHTML = html;

  if (state.fxEditing) {
    setTimeout(function() {
      var inp = document.getElementById('fx-name-input');
      if (inp) {
        inp.focus();
        inp.oninput = function(e) { state.fxFolderName = e.target.value; };
        inp.onkeydown = function(e) { if (e.key === 'Enter') handleFxNameSubmit(); };
      }
    }, 50);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================================
// FILE EXPLORER SIM HANDLERS
// ============================================================================
function fxWrong(msg) {
  state.fxFeedback = { type: 'error', msg: msg };
  state.fxShake = true;
  render();
  setTimeout(function() { state.fxShake = false; render(); }, 350);
}
function fxAdvance(msg) {
  state.fxFeedback = { type: 'ok', msg: msg };
  state.fxStep++;
  render();
  setTimeout(function() {
    if (state.fxFeedback && state.fxFeedback.msg === msg) {
      state.fxFeedback = null;
      render();
    }
  }, 1200);
}
function handleFxNameSubmit() {
  if (state.fxFolderName.trim().toLowerCase() !== 'visitors') {
    fxWrong('The folder must be named exactly "Visitors". Backspace and try again.');
    return;
  }
  state.fxEditing = false;
  state.fxStep = 4;
  state.fxFeedback = { type: 'ok', msg: 'Folder created. Job done.' };
  render();
}
function resetFx() {
  state.fxStep = 0; state.fxCtxOpen = false; state.fxSubOpen = false;
  state.fxFolderCreated = false; state.fxFolderName = '';
  state.fxEditing = false; state.fxFeedback = null; state.fxShake = false;
  render();
}
function resetPhish() {
  state.phishOpenId = null; state.phishShowSender = {};
  state.phishMarked = {}; state.phishSubmitted = false;
  render();
}
function resetShare() { state.shareStep = 0; render(); }

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.body.addEventListener('contextmenu', function(ev) {
  var t = ev.target.closest('[data-action="fx-empty-area"]');
  if (t) {
    ev.preventDefault();
    if (state.fxStep !== 0) {
      fxWrong('You are past this step. Follow the goal at the top.');
      return;
    }
    state.fxCtxOpen = true;
    fxAdvance('Right click. Moving on.');
  }
});

document.body.addEventListener('click', function(ev) {
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  var action = t.getAttribute('data-action');

  // Lab navigation
  if (action === 'open-cat') {
    state.view = 'category:' + t.getAttribute('data-cat-id');
    render();
  } else if (action === 'back-home') {
    state.view = 'home';
    render();
  } else if (action === 'open-lesson') {
    var lessonId = t.getAttribute('data-lesson-id');
    // Reset sim states when entering
    var info = getLesson(lessonId);
    if (info && info.lesson.simKey === 'fileExplorer') resetFx();
    if (info && info.lesson.simKey === 'phishing') resetPhish();
    if (info && info.lesson.simKey === 'share') resetShare();
    if (info && info.lesson.simKey === 'taskbar') state.taskbarHovered = null;
    if (info && info.lesson.simKey === 'inbox') state.inboxHot = null;
    state.view = 'lesson:' + lessonId;
    render();
  } else if (action === 'back-cat') {
    state.view = 'category:' + t.getAttribute('data-cat-id');
    render();
  } else if (action === 'complete-lesson') {
    var lid = t.getAttribute('data-lesson-id');
    state.completed[lid] = true;
    // Auto-advance to next lesson in category, or back to category if last
    var info2 = getLesson(lid);
    if (info2) {
      var nextLesson = null;
      for (var i=0;i<info2.cat.lessons.length;i++) {
        if (info2.cat.lessons[i].id === lid && i + 1 < info2.cat.lessons.length) {
          nextLesson = info2.cat.lessons[i+1];
          break;
        }
      }
      if (nextLesson) {
        // Reset sim states for next
        if (nextLesson.simKey === 'fileExplorer') resetFx();
        if (nextLesson.simKey === 'phishing') resetPhish();
        if (nextLesson.simKey === 'share') resetShare();
        if (nextLesson.simKey === 'taskbar') state.taskbarHovered = null;
        if (nextLesson.simKey === 'inbox') state.inboxHot = null;
        state.view = 'lesson:' + nextLesson.id;
      } else {
        state.view = 'category:' + info2.cat.id;
      }
      render();
    }
  }

  // File Explorer Sim
  else if (action === 'fx-empty-area') {
    // Left-click on empty area (right-click handled via contextmenu listener above)
    if (state.fxCtxOpen) {
      state.fxCtxOpen = false;
      state.fxSubOpen = false;
      render();
      return;
    }
    if (state.fxStep === 0) {
      fxWrong('Right-click on the empty area, not left-click. Try again.');
    }
  } else if (action === 'fx-file-click') {
    ev.stopPropagation();
    if (state.fxStep === 0) {
      fxWrong('That\'s a file, not the empty area. Right-click empty space.');
    } else {
      fxWrong('Stay on task. Read the goal at the top of the screen.');
    }
  } else if (action === 'fx-new-click') {
    ev.stopPropagation();
    if (state.fxStep !== 1) {
      fxWrong('You need to be on the "click New" step.');
      return;
    }
    state.fxSubOpen = true;
    fxAdvance('New menu opened. Pick Folder.');
  } else if (action === 'fx-folder-click') {
    ev.stopPropagation();
    if (state.fxStep !== 2) {
      fxWrong('You need the "Folder" submenu step.');
      return;
    }
    state.fxCtxOpen = false;
    state.fxSubOpen = false;
    state.fxFolderCreated = true;
    state.fxEditing = true;
    state.fxFolderName = '';
    fxAdvance('Folder created. Type its name.');
  } else if (action === 'sim-reset') {
    var simKey = t.getAttribute('data-sim-key');
    if (simKey === 'fileExplorer') resetFx();
    else if (simKey === 'phishing') resetPhish();
  }

  // Phishing Sim
  else if (action === 'phish-open') {
    state.phishOpenId = t.getAttribute('data-email-id');
    render();
  } else if (action === 'phish-reveal-toggle') {
    var eid = t.getAttribute('data-email-id');
    state.phishShowSender[eid] = !state.phishShowSender[eid];
    render();
  } else if (action === 'phish-mark') {
    if (state.phishSubmitted) return;
    var eid2 = t.getAttribute('data-email-id');
    state.phishMarked[eid2] = !state.phishMarked[eid2];
    render();
  } else if (action === 'phish-submit') {
    state.phishSubmitted = true;
    render();
  } else if (action === 'phish-reset') {
    resetPhish();
  }

  // Taskbar Tour
  else if (action === 'taskbar-pick') {
    state.taskbarHovered = t.getAttribute('data-tb-id');
    render();
  }

  // Inbox Anatomy
  else if (action === 'inbox-pick') {
    ev.stopPropagation();
    state.inboxHot = t.getAttribute('data-hot-id');
    render();
  }

  // Share Walkthrough
  else if (action === 'share-next') {
    state.shareStep++;
    render();
  } else if (action === 'share-back') {
    if (state.shareStep > 0) state.shareStep--;
    render();
  }
});
