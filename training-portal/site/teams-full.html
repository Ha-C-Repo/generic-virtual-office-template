<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Microsoft Teams Full | Your Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#000;color:#e4e4e7;
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% 5%,rgba(91,95,199,0.12),transparent 40%),
    radial-gradient(circle at 15% 95%,rgba(91,95,199,0.07),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}

/* Header */
header.site{border-bottom:2px solid #27272a;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#5b5fc7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#52525b;}
.header-meta .big{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #27272a;text-align:center;}
footer.site p{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#3f3f46;}

/* Hero */
.lab-hero{position:relative;border:2px solid #3f3f46;background:#18181b;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(91,95,199,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(91,95,199,.3) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#5b5fc7;border-radius:50%;filter:blur(80px);opacity:.22;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#818cf8;margin-bottom:8px;}
.lab-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#818cf8;}
.lab-blurb{color:#a1a1aa;max-width:540px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #3f3f46;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#818cf8;margin:0;}
.lab-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#52525b;margin:0;}

/* Category cards */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#18181b;border:2px solid #3f3f46;padding:0;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#10b981;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#a1a1aa;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#27272a;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#10b981;}

/* Category view */
.cat-back-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#71717a;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#18181b;border:2px solid #3f3f46;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#a1a1aa;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#18181b;
  border:2px solid #3f3f46;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#10b981;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;}
.lesson-num-tile.done   {background:#10b981;color:#000;}
.lesson-num-tile.current{background:#818cf8;color:#000;}
.lesson-num-tile.pending{background:#27272a;color:#71717a;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

/* Reading card */
.lesson-card{border:2px solid #3f3f46;background:#18181b;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.8;margin:0;}
.lesson-card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#818cf8;margin:0 0 8px;}
.lesson-section p{color:#a1a1aa;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(91,95,199,.08);border-left:4px solid #5b5fc7;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#818cf8;margin:0 0 6px;font-weight:700;}
.tip-body{color:#c7d2fe;font-size:13px;margin:0;line-height:1.55;font-style:italic;}
.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#5b5fc7;color:#fff;border:2px solid #5b5fc7;
  display:flex;align-items:center;justify-content:center;gap:10px;}

/* Interactive card */
.int-card{border:2px solid #3f3f46;background:#18181b;}
.int-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #3f3f46;}
.int-card-body{padding:24px 22px;}

/* Teams Message Builder */
.tmb-stage{background:#18181b;border:1px solid #3f3f46;overflow:hidden;}
.tmb-bar{background:#4a4b9c;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.tmb-bar-title{font-weight:600;color:#fff;}
.tmb-composer{padding:14px;}
.tmb-composer-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#818cf8;margin-bottom:8px;}
.tmb-field{margin-bottom:14px;}
.tmb-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#71717a;margin-bottom:5px;}
.tmb-field select,.tmb-field textarea,.tmb-field input{
  width:100%;background:#09090b;border:1px solid #3f3f46;color:#e4e4e7;
  padding:8px 10px;font-size:13px;outline:none;}
.tmb-field select:focus,.tmb-field textarea:focus,.tmb-field input:focus{border-color:#5b5fc7;}
.tmb-field select option{background:#09090b;}
.tmb-preview-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#818cf8;margin:16px 0 8px;}
.tmb-preview{background:#2d2d3b;border:1px solid #4a4b9c;padding:14px;border-radius:4px;}
.tmb-preview-channel{font-family:'JetBrains Mono',monospace;font-size:9px;color:#818cf8;text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px;}
.tmb-preview-from{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.tmb-avatar{width:32px;height:32px;background:#5b5fc7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;}
.tmb-preview-name{font-weight:600;font-size:13px;color:#fff;}
.tmb-preview-time{font-size:10px;color:#71717a;margin-left:4px;}
.tmb-preview-body{font-size:13px;color:#d4d4d8;line-height:1.6;white-space:pre-wrap;margin-left:42px;}
.tmb-mention{color:#818cf8;font-weight:600;}
.tmb-feedback{margin-top:16px;padding:12px 14px;font-size:12px;line-height:1.55;}
.tmb-feedback.ok   {background:rgba(16,185,129,.1);border:1px solid #10b981;color:#a7f3d0;}
.tmb-feedback.warn {background:rgba(251,191,36,.08);border:1px solid #fbbf24;color:#fde68a;}
.tmb-check-btn{padding:10px 20px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.2em;
  background:#5b5fc7;color:#fff;border:2px solid #5b5fc7;margin-top:14px;}

/* Meeting Host Sim */
.meeting-shell{background:#1c1c30;border:1px solid #4a4b9c;overflow:hidden;}
.meeting-header{background:#323264;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.meeting-title-text{font-weight:600;font-size:13px;color:#fff;}
.meeting-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.12em;}
.meeting-badge.live{background:#ef4444;color:#fff;}
.meeting-badge.prep{background:#4a4b9c;color:#c7d2fe;}
.meeting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px;min-height:160px;}
.participant-tile{background:#2d2d4a;border-radius:6px;padding:14px;text-align:center;position:relative;}
.participant-tile.host-tile{border:2px solid #818cf8;}
.participant-name{font-size:11px;font-weight:600;color:#e4e4e7;margin-top:8px;}
.participant-status{font-size:9px;color:#71717a;margin-top:2px;}
.mute-icon{font-size:14px;}
.meeting-controls{display:flex;justify-content:center;gap:8px;padding:12px 16px;background:#0c0c1a;flex-wrap:wrap;}
.ctrl-btn{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  padding:8px 14px;border:1px solid #3f3f46;color:#a1a1aa;display:flex;align-items:center;gap:5px;}
.ctrl-btn.active{border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5;}
.ctrl-btn.highlight{border-color:#818cf8;background:rgba(129,140,248,.1);color:#c7d2fe;}
.meeting-steps{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.meet-step{padding:10px 12px;background:#09090b;border:1px solid #3f3f46;display:flex;gap:10px;align-items:flex-start;}
.meet-step.done-step{border-color:#10b981;background:rgba(16,185,129,.05);}
.meet-step.active-step{border-color:#818cf8;background:rgba(91,95,199,.08);}
.meet-step-num{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:14px;border:1px solid #3f3f46;}
.meet-step.done-step .meet-step-num{background:#10b981;border-color:#10b981;color:#000;}
.meet-step.active-step .meet-step-num{background:#5b5fc7;border-color:#5b5fc7;color:#fff;}
.meet-step-text{flex:1;font-size:12px;color:#a1a1aa;line-height:1.5;}
.meet-step.active-step .meet-step-text{color:#e4e4e7;}
.meet-action-btn{padding:8px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#5b5fc7;color:#fff;border:2px solid #5b5fc7;margin-top:12px;}
.meet-reset-btn{padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;
  letter-spacing:.15em;background:#27272a;color:#a1a1aa;border:1px solid #3f3f46;margin-top:12px;margin-left:8px;}

/* Notification Tuner */
.notif-grid{display:flex;flex-direction:column;gap:8px;}
.notif-row{background:#0c0c0c;border:1px solid #3f3f46;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.notif-label{flex:1;min-width:180px;}
.notif-label-title{font-size:13px;color:#e4e4e7;font-weight:500;}
.notif-label-sub{font-size:11px;color:#71717a;margin-top:2px;}
.notif-select{background:#09090b;border:1px solid #3f3f46;color:#e4e4e7;padding:6px 10px;font-size:12px;outline:none;min-width:140px;}
.notif-select:focus{border-color:#5b5fc7;}
.notif-verdict{font-size:11px;font-style:italic;margin-top:6px;width:100%;}
.notif-verdict.good{color:#a7f3d0;}
.notif-verdict.bad {color:#fca5a5;}
.notif-score{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  color:#a1a1aa;margin-top:16px;padding-top:16px;border-top:1px solid #27272a;}
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <div class="logo-tile" id="logo-slot"></div>
    <div class="header-meta">
      <p class="small">Your Company &middot; Module 5</p>
      <p class="big">Microsoft Teams Full</p>
    </div>
  </div>
</header>

<main class="container" style="padding:28px 20px 40px;">
  <div id="app"></div>
</main>

<footer class="site">
  <p>Built by Joseph &middot; Your Company Virtual Office &middot; Internal Use Only</p>
</footer>

<script>
"use strict";

// ============================================================================
// ICONS
// ============================================================================
const ICONS={
  'arrow-right':    '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  'arrow-left':     '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',

  'hash':           '<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',

  'bell':           '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  'at-sign':        '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
  'message-circle': '<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>',
  'users':          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
  'settings':       '<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>'
};
function icon(name,size,color){
  size=size||16;color=color||'currentColor';
  var p=ICONS[name]||'';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">'+p+'</svg>';
}

// ============================================================================
// DATA
// ============================================================================
const CATEGORIES=[
  { id:'channels', iconKey:'hash', color:'#5b5fc7',
    title:'Channels in Depth',
    blurb:'Standard vs. private, tabs, pinning, and @mentions that actually get noticed.',
    lessons:[
      { id:'ch-1', title:'Channel Anatomy',            type:'reading',     minutes:3 },
      { id:'ch-2', title:'@Mentions Done Right',       type:'reading',     minutes:3 },
      { id:'ch-3', title:'Build a Channel Message',    type:'interactive', minutes:5, intKey:'msgBuilder' }
    ] },
  { id:'meetings', iconKey:'video', color:'#4f46e5',
    title:'Hosting Meetings',
    blurb:'Schedule, launch, manage participants, record, and wrap a meeting without panic.',
    lessons:[
      { id:'mt-1', title:'Before the Call: Setup Right',     type:'reading',     minutes:3 },
      { id:'mt-2', title:'Running the Room (as Host)',       type:'reading',     minutes:4 },
      { id:'mt-3', title:'Meeting Host Walkthrough',         type:'interactive', minutes:6, intKey:'meetHost' }
    ] },
  { id:'files', iconKey:'message-circle', color:'#6366f1',
    title:'Files in Teams',
    blurb:'The right way to share files. When Teams, when OneDrive link, when never.',
    lessons:[
      { id:'fi-1', title:'The Files Tab',                   type:'reading', minutes:3 },
      { id:'fi-2', title:'Teams Link vs. OneDrive Link',    type:'reading', minutes:3 },
      { id:'fi-3', title:'Co-authoring from Teams',         type:'reading', minutes:2 }
    ] },
  { id:'notifications', iconKey:'bell', color:'#7c3aed',
    title:'Notifications & Focus',
    blurb:'Tune out the noise without missing what matters. One wrong setting drowns you.',
    lessons:[
      { id:'nt-1', title:'Activity Feed vs. Notifications', type:'reading',     minutes:2 },
      { id:'nt-2', title:'Do Not Disturb & Quiet Hours',    type:'reading',     minutes:2 },
      { id:'nt-3', title:'Tune Your Notifications',         type:'interactive', minutes:5, intKey:'notifTuner' }
    ] }
];

const LESSON_CONTENT={
  'ch-1':{ sections:[
    { h:'Standard channels are public to the team', b:'Everyone on the Your Company team can see every standard channel. Use standard channels for project threads (ICD Church, Marathon prep, Elite Crossing) so the whole team can follow along. Nothing confidential lives here.' },
    { h:'Private channels are invitation-only', b:'If you create a private channel, only the people you invite can see it or even know it exists. Use private channels for conversations that should not be visible to the whole team — vendor pricing discussions, HR topics, or anything Owner wants contained.' },
    { h:'Tabs keep everything in one place', b:'Every channel has a tabs bar at the top (Files, Posts, sometimes a OneNote or a website). Whoever sets up a channel can pin a SharePoint folder, a document, or even the Your Company bid tracker as a tab. Ask Joseph to pin what you use daily.' },
    { h:'Pin and unpin channels', b:'Right-click any channel and choose Pin. Pinned channels float to the top of your sidebar. Unpin anything you do not use weekly. A sidebar with 20 unpinned channels means you miss things.' }
  ], tip:'New channel names at Your Company should follow the pattern: Project-Name or Topic-Name. No spaces. Example: ICD-Church, Marathon-Prep, Admin-Ops.' },
  'ch-2':{ sections:[
    { h:'@name pings one person', b:'Type @Mario and Teams sends Mario a notification even if he has the app in the background. Use this when the message is specifically for one person but the conversation belongs in the channel so others can see it.' },

// ============================================================================
// HELPERS
// ============================================================================
function esc(s){ if(s==null)return''; return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function pass(s){ return s||''; }
function getCat(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i]; return null; }
function getLesson(id){
  for(var i=0;i<CATEGORIES.length;i++){
    var c=CATEGORIES[i];
    for(var j=0;j<c.lessons.length;j++) if(c.lessons[j].id===id) return{lesson:c.lessons[j],cat:c,idx:j};
  }return null;
}
function totalLessons(){ return CATEGORIES.reduce(function(a,c){return a+c.lessons.length;},0); }
function completedCount(){ return Object.keys(state.completed).length; }

function renderHome(){

  html+='<h1 class="lab-h1">Microsoft <span class="accent">Teams</span> Full</h1>';
  html+='<p class="lab-blurb">You joined meetings in Module 2. This module teaches you to run them. Four categories covering channels, hosting, file sharing, and notification control. By the end you are the person who sets up the call, not the one who asks how to join it.</p>';
  html+='<div class="lab-stats">';
  [['4','Categories'],[String(totalLessons()),'Lessons'],['3','Interactives'],[String(done),'Done']].forEach(function(s){
    html+='<div class="lab-stat"><p class="lab-stat-num">'+s[0]+'</p><p class="lab-stat-lbl">'+s[1]+'</p></div>';
  });
  html+='</div></div></div>';

  html+='<div class="cat-grid">';
  CATEGORIES.forEach(function(cat){
    var doneN=cat.lessons.filter(function(l){return state.completed[l.id];}).length;

function renderCategory(cat){

  html+='<button class="cat-back-btn" data-action="back-home">'+icon('arrow-left',13)+' Back to module home</button>';
  html+='<div class="cat-header"><div class="cat-header-inner">';

  html+='<div><p class="cat-header-eyebrow" style="color:'+cat.color+';">Category</p>';
  html+='<h2 class="cat-header-title">'+esc(cat.title)+'</h2>';
  html+='<p class="cat-header-blurb">'+esc(cat.blurb)+'</p>';
  html+='</div></div></div>';
  html+='<div class="lesson-list">';
  cat.lessons.forEach(function(l,i){
    var isDone=!!state.completed[l.id];
    var prevDone=i===0||!!state.completed[cat.lessons[i-1].id];
    var locked=!isDone&&!prevDone;
    var current=!isDone&&prevDone;
    var tileCls=isDone?'done':current?'current':'pending';
    var typeLabel=l.type==='reading'?'Reading':'Interactive';
    var typeColor=l.type==='reading'?'#71717a':'#818cf8';
    html+='<button class="lesson-row'+(isDone?' is-done':'')+(locked?' is-locked':'')+'"';
    html+=locked?' disabled':' data-action="open-lesson" data-lesson-id="'+l.id+'"';
    html+='>';
    html+='<div class="lesson-num-tile '+tileCls+'">'+(locked?icon('lock',14):isDone?icon('check',18):String(i+1))+'</div>';
    html+='<div class="lesson-row-meta"><p class="lesson-row-title">'+esc(l.title)+'</p>';
    html+='<p class="lesson-row-tag" style="color:'+typeColor+';">'+typeLabel+' &middot; ~'+l.minutes+' min</p></div>';
    if(!locked) html+=icon('arrow-right',16,'#71717a');
    html+='</button>';
  });
  html+='</div>';
  return html;
}

function checkMsgBuilder(){
  var ch=state.mbChannel;
  var mention=state.mbMention.trim();
  var body=state.mbBody.trim();
  var issues=[];
  if(!body) issues.push('Write a message body first.');
  if(body.length < 20) issues.push('Message is too short to be useful. Add context: what do you need and by when?');
  if(ch==='#Shop-Floor'&&mention.toLowerCase().indexOf('@channel')>-1) issues.push('Do not @Channel the shop floor — that pings everyone including people off-shift. Use @Mario or @Paul specifically.');
  if(!mention&&body.toLowerCase().indexOf('please')>-1) issues.push('You said "please" which implies you want someone to act — add an @mention so they get notified.');
  if(body.length>400) issues.push('Message is getting long. If it needs this much text, consider a Teams call instead.');

  if(issues.length>0){
    state.mbFeedback={type:'warn',msg:issues[0]};
    state.mbChecked=true;
  } else {
    state.mbFeedback={type:'ok',msg:'Good message. Channel is appropriate, @mention is specific, body is clear. Ready to send.'};
    state.mbChecked=true;
  }
  render();
}

  });
  html+='</div>';

  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
  if(!done){
    html+='<button class="meet-action-btn" data-action="meet-next">'+(step<MEET_STEPS.length-1?'Next Step':'Finish Walkthrough')+' '+icon('arrow-right',14,'#fff')+'</button>';
  }
  if(step>0){
    html+='<button class="meet-reset-btn" data-action="meet-reset">Reset</button>';
  }
  if(done){
    html+='<button class="complete-btn" style="width:auto;margin-top:0;padding:10px 22px;" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div>';
  html+='</div></div>';
  return html;
}

// ============================================================================
// INTERACTIVE 3: NOTIFICATION TUNER (nt-3)
// ============================================================================
function renderNotifTuner(lesson,cat){
  var allPicked=NOTIF_ROWS.every(function(r){return!!state.notifPicked[r.id];});

  var correctCount=0;
  if(state.notifChecked){
    NOTIF_ROWS.forEach(function(r){ if(state.notifPicked[r.id]===r.correct) correctCount++; });
  }

  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card">';
  html+='<div class="int-card-header" style="background:'+cat.color+';">';
  html+='<div class="lesson-icon-tile">'+icon(cat.iconKey,26,'#fff')+'</div>';
  html+='<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p>';
  html+='<h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body">';
  html+='<p style="font-size:13px;color:#a1a1aa;margin-bottom:20px;">Set the right notification level for each source at Your Company. Wrong settings mean you either miss critical messages or drown in noise.</p>';

  html+='<div class="notif-grid">';
  NOTIF_ROWS.forEach(function(r){
    var picked=state.notifPicked[r.id]||'';
    var verdict='';
    if(state.notifChecked&&picked){
      verdict=picked===r.correct?'Correct. '+getNotifWhy(r,true):r.correct+' is right. '+getNotifWhy(r,false);
    }
    html+='<div class="notif-row">';
    html+='<div class="notif-label"><div class="notif-label-title">'+esc(r.title)+'</div>';
    html+='<div class="notif-label-sub">'+esc(r.sub)+'</div></div>';
    html+='<select class="notif-select" data-action="notif-pick" data-row-id="'+r.id+'">';
    html+='<option value="">Select...</option>';
    r.options.forEach(function(o){
      html+='<option value="'+esc(o)+'"'+(picked===o?' selected':'')+'>'+esc(o)+'</option>';
    });
    html+='</select>';
    if(verdict){
      var vCls=picked===r.correct?'good':'bad';
      html+='<div class="notif-verdict '+vCls+'">'+esc(verdict)+'</div>';
    }
    html+='</div>';
  });
  html+='</div>';

  if(state.notifChecked){
    html+='<div class="notif-score">'+icon('check',13,'#818cf8')+' Score: '+correctCount+'/'+NOTIF_ROWS.length+'</div>';
  }

  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">';
  if(!state.notifChecked){
    var disabled=!allPicked;
    html+='<button class="complete-btn" style="width:auto;margin-top:0;padding:10px 22px;"'+(disabled?' disabled style="opacity:.4;"':'')+' data-action="notif-check">Check answers</button>';
    if(disabled) html+='<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#52525b;text-transform:uppercase;letter-spacing:.15em;align-self:center;">Set all 6 to unlock</span>';
  } else {
    html+='<button class="complete-btn" style="width:auto;margin-top:0;padding:10px 22px;" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
    html+='<button style="font-family:\'JetBrains Mono\',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;padding:10px 16px;background:#27272a;color:#a1a1aa;border:1px solid #3f3f46;" data-action="notif-reset">Try again</button>';
  }
  html+='</div>';
  html+='</div></div>';
  return html;
}

function getNotifWhy(r,correct){
  var whys={
    'n1':{ good:'The shop floor is high-volume low-urgency. @Mentions only means you only hear it when someone actually needs you.', bad:'All activity from the shop floor will bury you in weld photos and crew check-ins all day.' },
    'n2':{ good:'Marathon is active and critical. You need to see every update as it comes in.', bad:'Marathon prep items can be time-sensitive. Mentions-only risks missing updates that do not tag you.' },
    'n3':{ good:'Direct messages to you always need your attention. These are personal, not channel noise.', bad:'A DM from Owner is not optional. You need all activity on direct messages.' },
    'n4':{ good:'You run Admin-Ops. Every post there is yours to act on.', bad:'If you run the channel, you need to see everything posted there, not just items that @mention you.' },
    'n5':{ good:'A phone call is the highest-urgency contact method. You cannot miss calls.', bad:'A Teams call going to voicemail because notifications were off is a problem.' },
    'n6':{ good:'Reactions are social noise. A thumbs-up does not need to interrupt your day.', bad:'Getting notified every time someone reacts to your message is pure distraction.' }
  };
  var w=whys[r.id];
  return w?(correct?w.good:w.bad):'';
}

// ============================================================================
// LESSON DISPATCHER
// ============================================================================
function renderLesson(lesson,cat){
  if(lesson.type==='reading') return renderReading(lesson,cat);
  if(lesson.intKey==='msgBuilder') return renderMsgBuilder(lesson,cat);
  if(lesson.intKey==='meetHost')   return renderMeetHost(lesson,cat);
  if(lesson.intKey==='notifTuner') return renderNotifTuner(lesson,cat);
  return renderReading(lesson,cat);
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
function render(){
  var app=document.getElementById('app');
  var html='';
  if(state.view==='home'){
    html=renderHome();
  } else if(state.view.indexOf('category:')===0){
    var cat=getCat(state.view.slice(9));
    html=cat?renderCategory(cat):renderHome();
  } else if(state.view.indexOf('lesson:')===0){
    var info=getLesson(state.view.slice(7));
    html=info?renderLesson(info.lesson,info.cat):renderHome();
  }
  app.innerHTML=html;

  // Wire live inputs for Message Builder
  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey==='msgBuilder'){
      setTimeout(function(){
        var ch=document.getElementById('mb-channel');
        var mn=document.getElementById('mb-mention');
        var bd=document.getElementById('mb-body');
        if(ch) ch.addEventListener('change',function(e){ state.mbChannel=e.target.value; state.mbFeedback=null; state.mbChecked=false; render(); });
        if(mn) mn.addEventListener('input',function(e){ state.mbMention=e.target.value; state.mbFeedback=null; state.mbChecked=false; });
        if(bd) bd.addEventListener('input',function(e){ state.mbBody=e.target.value; state.mbFeedback=null; state.mbChecked=false; });
        // Debounced preview
        if(mn||bd){
          clearTimeout(window._mbTimer);
          window._mbTimer=setTimeout(function(){ render(); },400);
        }
      },50);
    }
    if(info2&&info2.lesson.intKey==='notifTuner'){
      setTimeout(function(){
        document.querySelectorAll('.notif-select').forEach(function(sel){
          sel.addEventListener('change',function(e){
            var rid=e.target.getAttribute('data-row-id');
            state.notifPicked[rid]=e.target.value;
            render();
          });
        });
      },50);
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');

  if(action==='open-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='back-home'){ state.view='home'; render(); }
  else if(action==='back-cat'){ state.view='category:'+t.getAttribute('data-cat-id'); render(); }
  else if(action==='open-lesson'){
    var lid=t.getAttribute('data-lesson-id');
    var info=getLesson(lid);
    if(info){
      if(info.lesson.intKey==='msgBuilder'){ state.mbChannel='#ICD-Church'; state.mbMention=''; state.mbBody=''; state.mbChecked=false; state.mbFeedback=null; }
      if(info.lesson.intKey==='meetHost'){ state.meetStep=0; state.meetDone=false; }
      if(info.lesson.intKey==='notifTuner'){ state.notifPicked={}; state.notifChecked=false; }
    }
    state.view='lesson:'+lid; render();
  }
  else if(action==='complete-lesson'){
    var lid2=t.getAttribute('data-lesson-id');
    state.completed[lid2]=true;
    var info2=getLesson(lid2);
    if(info2){
      var next=null;
      for(var i=0;i<info2.cat.lessons.length;i++){
        if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){ next=info2.cat.lessons[i+1]; break; }
      }
      state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;
      render();
    }
  }
  // Message Builder
  else if(action==='mb-suggest'){
    state.mbMention=(state.mbMention.trim()+' '+t.getAttribute('data-val')).trim();
    state.mbFeedback=null; state.mbChecked=false;
    render();
  }
  else if(action==='mb-check'){ checkMsgBuilder(); }
  // Meeting Host
  else if(action==='meet-next'){
    if(state.meetStep<MEET_STEPS.length-1){ state.meetStep++; }
    else { state.meetDone=true; }
    render();
  }
  else if(action==='meet-reset'){ state.meetStep=0; state.meetDone=false; render(); }
  // Notification Tuner
  else if(action==='notif-pick'){
    var rid=t.getAttribute('data-row-id');
    state.notifPicked[rid]=t.value;
    render();
  }
  else if(action==='notif-check'){ state.notifChecked=true; render(); }
  else if(action==='notif-reset'){ state.notifPicked={}; state.notifChecked=false; render(); }
});

render();
